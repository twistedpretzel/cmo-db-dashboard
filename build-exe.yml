name: Build Windows executable

# Builds a single-file build_dashboard.exe with PyInstaller on a Windows runner.
# - Push a version tag (e.g. v1.0.0) -> a GitHub Release is created with the .exe attached.
# - Or trigger manually (Actions tab -> "Build Windows executable" -> Run workflow)
#   -> the .exe is available as a downloadable build artifact.
# A Windows .exe can only be built on Windows, which is why this runs in CI.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on tag builds

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build build_dashboard.exe
        run: pyinstaller build_dashboard.spec

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "dist/build_dashboard.exe"
          if (-not (Test-Path $exe)) { throw "build_dashboard.exe was not produced" }
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  build_dashboard.exe" |
            Out-File -Encoding ascii dist/build_dashboard.exe.sha256
          Get-Content dist/build_dashboard.exe.sha256

      - name: Upload build artifact (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: build_dashboard-exe
          path: |
            dist/build_dashboard.exe
            dist/build_dashboard.exe.sha256

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/build_dashboard.exe
            dist/build_dashboard.exe.sha256
          generate_release_notes: true
