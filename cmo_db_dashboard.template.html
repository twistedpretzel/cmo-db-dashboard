}
function trackingCard(s){
  const pairs=[['Scan interval',s.ScanInterval?s.ScanInterval+' s':null],['Range resolution',s.ResolutionRange?s.ResolutionRange+' nm':null],['Height resolution',s.ResolutionHeight?s.ResolutionHeight+' m':null],['Angular resolution',s.ResolutionAngle?s.ResolutionAngle+'°':null],['DF accuracy',s.DirectionFindingAccuracy?'±'+s.DirectionFindingAccuracy+'°':null],['Max contacts (air / surface / sub)',(s.MaxContactsAir||s.MaxContactsSurface||s.MaxContactsSubmarine)?[s.MaxContactsAir,s.MaxContactsSurface,s.MaxContactsSubmarine].map(v=>v||0).join(' / '):null],['Availability',s.Availability!=null&&s.Availability!==100?s.Availability+' %':null]];
  return `<div class="card"><h3>Tracking &amp; resolution</h3>${kv(pairs)}</div>`;
}
function esmPanels(s){
  const color=FAMILY.esm.color;
  let html = sensorEnvelopeCard(s,color);
  const radarBands = s.freqST.filter(f=>f<2000), other = s.freqST.filter(f=>f>=2000);

  html += `<div class="card"><h3>Receiver</h3><div style="display:flex;gap:14px;align-items:flex-start">${wedge?`<div>${wedge}</div>`:''}<div style="flex:1">${kv([['DF accuracy',acc?'±'+acc+'°':null],['Sensitivity',s.ESMSensitivity?s.ESMSensitivity+' dBm':null],['System loss',s.ESMSystemLoss?s.ESMSystemLoss+' dB':null],['Channels',s.ESMNumberOfChannels||null],['Precise emitter ID',s.ESMPreciseEmitterID?'yes':null],['Scan interval',s.ScanInterval?s.ScanInterval+' s':null],['Min signature (ESM)',s.MinimumSignature_ESM&&s.MinimumSignature_ESM>-99?s.MinimumSignature_ESM:null]])}</div></div></div>`;

function ecmPanels(s){

  html += `<div class="card"><h3>Jammer</h3>${kv([['Gain',s.ECMGain?s.ECMGain+' dB':null],['Peak power',s.ECMPeakPower?fmt.n(s.ECMPeakPower)+' W':null],['Bandwidth',s.ECMBandwidth?fmt.hz(s.ECMBandwidth):null],['Simultaneous targets',s.ECMNumberOfTargets||null],['PoK reduction',s.ECMPoKReduction?s.ECMPoKReduction+' %':null],['Scan interval',s.ScanInterval?s.ScanInterval+' s':null]])}</div>`;

}
function opticalPanels(s){
  const isIR = s.fam==='ir'; const color = isIR?FAMILY.ir.color:FAMILY.visual.color;
  const det = isIR? s.IRDetectionZoomLevel : s.VisualDetectionZoomLevel, cls = isIR? s.IRClassificationZoomLevel : s.VisualClassificationZoomLevel;
  const maxZoom = Math.max(...[...D.sensor.values()].map(x=>Math.max(x.VisualDetectionZoomLevel||0,x.VisualClassificationZoomLevel||0,x.IRDetectionZoomLevel||0,x.IRClassificationZoomLevel||0)), 1);
  const hasAlt = (s.AltitudeMax||s.AltitudeMax_ASL)>0;
  let html = hasAlt ? sensorEnvelopeCard(s,color) : (s.RangeMax>0 ? `<div class="card"><h3>Coverage<span class="hint">nominal range, all-round (arcs come from the fitting platform)</span></h3>${coverageRings([{label:s.Name,range:s.RangeMax,mask:0xFFFF,color,sub:E('SensorRole',s.Role)}],{size:300})}</div>` : '');
  const night = s.codes.includes(2701);
  html += `<div class="card"><h3>${isIR?'Imaging':'Optics'}<span class="hint">zoom level = magnification class used by the engine</span></h3>
    ${gauge('Detection zoom', Math.log10(1+(det||0)), Math.log10(1+maxZoom), color, det?'×'+det:'—')}${gauge('Classification zoom', Math.log10(1+(cls||0)), Math.log10(1+maxZoom), color, cls?'×'+cls:'—')}<div class="small" style="margin-bottom:6px">bar = log scale up to the database maximum of ×${fmt.n(maxZoom)}</div>
    ${kv([['Generation',E('SensorGeneration',s.Generation)],['Night capable',night?'yes (LLTV/NVG/CCD)':(isIR?'yes (infrared)':'day only')],['Scan interval',s.ScanInterval?s.ScanInterval+' s':null],['Min signature',(isIR?s.MinimumSignature_IR:s.MinimumSignature_Visual)>-99&&(isIR?s.MinimumSignature_IR:s.MinimumSignature_Visual)?(isIR?s.MinimumSignature_IR:s.MinimumSignature_Visual):null]])}
    <div class="note">Optics have no altitude ceiling in the database; range is a nominal maximum and the actual detection distance depends on the target's ${isIR?'infrared':'visual'} signature and zoom level.</div></div>`;
  html += trackingCard(s);
  return html;
}
function sonarPanels(s){
  const color=FAMILY.sonar.color;
  const isTowed = s.Type>=5011&&s.Type<=5023, isDip = s.Type>=5031&&s.Type<=5033;
  const active = [5002,5003,5004,5012,5013,5022,5023,5032,5033].includes(s.Type), passive = ![5003,5013,5023,5033].includes(s.Type);
  let html='';

  const dmin = s.SonarMinimumDeploymentDepth||0, dmax = s.SonarMaximumDeploymentDepth||0;
  if (dmin||dmax||s.SonarTowLength){
    const items=[{label:s.Name,color,r0:0,r1:s.RangeMax||1,a0:Math.min(dmin,dmax),a1:Math.max(dmin,dmax),tip:`deploy depth ${fmt.n(Math.abs(dmax))} – ${fmt.n(Math.abs(dmin))} m`}];
    html += `<div class="card"><h3>Deployment envelope<span class="hint">range × depth</span></h3>${envelopeChart(items,{mode:'depth',width:520,height:200})}<div class="note">${isTowed?'Towed array, cable '+fmt.n(s.SonarTowLength)+' m':isDip?'Dipping sonar':'Variable-depth'} · deploy ${fmt.n(Math.abs(dmax))} – ${fmt.n(Math.abs(dmin))} m</div></div>`;
  } else if (s.RangeMax>0){
    html += `<div class="card"><h3>Coverage</h3>${coverageRings([{label:s.Name,range:s.RangeMax,mask:0xFFFF,color}],{size:260})}</div>`;
  }
  html += `<div class="card"><h3>Acoustics<span class="hint">${active?'active':''}${active&&passive?' + ':''}${passive?'passive':''}</span></h3>${kv([['Max range',fmt.nm(s.RangeMax)],['Frequency bands',s.freqST.map(f=>E('SensorFrequency',f)).join('; ')||null],['Source level',s.SonarSourceLevel?s.SonarSourceLevel+' dB':null],['Pulse length',s.SonarPulseLength?s.SonarPulseLength+' ms':null],['Directivity index',s.SonarDirectivityIndex?s.SonarDirectivityIndex+' dB':null],['Recognition differential (active / passive)',(s.SonarRecognitionDifferentialActive||s.SonarRecognitionDifferentialPassive)?(s.SonarRecognitionDifferentialActive||0)+' / '+(s.SonarRecognitionDifferentialPassive||0)+' dB':null],['Sensor-to-machinery distance',s.SonarSensorToMachineryDistance?s.SonarSensorToMachineryDistance+' m':null],['Convergence zones',s.SonarCZNumber||null],['Scan interval',s.ScanInterval?s.ScanInterval+' s':null],['Angular resolution',s.ResolutionAngle?s.ResolutionAngle+'°':null],['Min signature (active / passive)',[s.MinimumSignature_ActiveSonar,s.MinimumSignature_PassiveSonar].some(v=>v&&v>-99)?[s.MinimumSignature_ActiveSonar,s.MinimumSignature_PassiveSonar].join(' / '):null]])}
  ${s.SonarCZNumber?`<div class="note">Convergence-zone capable: the engine can extend detection into ${s.SonarCZNumber} CZ annulus${s.SonarCZNumber>1?'es':''} beyond direct path when water conditions allow.</div>`:''}</div>`;
  return html;
}
function genericPanels(s){
  const color = FAMILY[s.fam].color;
  let html = sensorEnvelopeCard(s,color);
  const mine = (s.MineSweepWidth||s.MineSweepMaximumDepth)? kv([['Sweep width',s.MineSweepWidth?s.MineSweepWidth+' m':null],['Sweep depth',s.MineSweepMinimumDepth||s.MineSweepMaximumDepth?fmt.n(s.MineSweepMinimumDepth)+' – '+fmt.n(s.MineSweepMaximumDepth)+' m':null],['Max sweep speed',s.MineSweepMaximumSpeed?s.MineSweepMaximumSpeed+' kt':null]]) : '';
  if (mine) html += `<div class="card"><h3>Mine countermeasures</h3>${mine}</div>`;
  if (s.Type===9001){ html += `<div class="card"><h3>Group members</h3><div class="comp-list">${s.group.map(g=>{const m=D.sensor.get(g); return m?`<a class="comp" href="#/sensor/${m.ID}"><span></span><span><div class="nm">${esc(m.Name)}</div><div class="sub">${esc(E('SensorType',m.Type))} · ${esc(E('SensorRole',m.Role))}</div></span><span class="cnt">${fmt.nm(m.RangeMax)}</span></a>`:'';}).join('')}</div></div>`; }
  html += trackingCard(s);
  return html;
}
function viewSensor(id){
  const s=D.sensor.get(id); if(!s) return '<p>Unknown sensor.</p>';
  const f=FAMILY[s.fam];
  let html = `<div class="crumbs"><a href="#/">Overview</a> › <a href="#/sensor">Sensors</a> › <a href="#/sensor?f=${s.fam}">${f.label}</a></div>
  <h2 class="title"><span class="sw" style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${f.color};margin-right:8px"></span>${esc(s.Name)}${flags(s)}</h2>
  <div class="meta">${esc(E('SensorType',s.Type))} · ${esc(E('SensorRole',s.Role))}${D.enums.SensorRoleComment&&D.enums.SensorRoleComment[s.Role]?' '+esc(D.enums.SensorRoleComment[s.Role]):''} · ${esc(E('SensorGeneration',s.Generation))}${s.Comments&&s.Comments!=='-'?' · '+esc(s.Comments):''} · <span class="small">ID ${s.ID}</span></div>
  ${compareButton('sensor', s.ID, s.Name)}`;
  html += statTiles([['Max range',s.RangeMax?fmt.n(s.RangeMax,1):null,'nm'],['Min range',s.RangeMin?fmt.n(s.RangeMin,2):null,'nm'],['Altitude',sensorAltText(s)!=='—'?sensorAltText(s):null],['Scan',s.ScanInterval,'s'],['Max contacts',s.MaxContactsAir||s.MaxContactsSurface||s.MaxContactsSubmarine?Math.max(s.MaxContactsAir,s.MaxContactsSurface,s.MaxContactsSubmarine):null]]);
  html += capChips(s);
  html += `<div class="grid c2" style="margin-top:12px">`;
  if (s.fam==='radar') html += radarPanels(s);
  else if (s.fam==='esm') html += esmPanels(s);
  else if (s.fam==='ecm') html += ecmPanels(s);
  else if (s.fam==='visual'||s.fam==='ir') html += opticalPanels(s);
  else if (s.fam==='sonar') html += sonarPanels(s);
  else html += genericPanels(s);
  if (s.MasqueradeAs && s.MasqueradeAs!==1001){ const m=D.sensor.get(s.MasqueradeAs); if (m) html += `<div class="card"><h3>Masquerades as</h3><a href="#/sensor/${m.ID}">${esc(m.Name)}</a></div>`; }
  // used by
  html += carrierCard(sensorCarriers(id));
  const wps = (IDX.sensorWeapons.get(id)||[]).map(w=>D.weapon.get(w)).filter(Boolean);
  if (wps.length) html += `<div class="card"><h3>Seeker for<span class="hint">${wps.length} weapon${wps.length===1?'':'s'}</span></h3><div class="chips">${wps.slice(0,80).map(w=>`<a class="chip" href="#/weapon/${w.ID}">${esc(w.Name)}</a>`).join('')}${wps.length>80?`<span class="chip">… ${wps.length-80} more</span>`:''}</div></div>`;
  const grp = [...D.sensor.values()].filter(x=>x.Type===9001&&x.group.includes(id));
  if (grp.length) html += `<div class="card"><h3>Member of sensor groups</h3><div class="chips">${grp.map(g=>`<a class="chip" href="#/sensor/${g.ID}">${esc(g.Name)}</a>`).join('')}</div></div>`;
  html += `</div>`;
  return html;
}

<script>
/* ============================================================
   WEAPON DETAIL — family-specific presentation

function rangeBars(w, opts={}){
  // min→max bars per domain with PoK annotation
  const W=opts.width||520, rowH=26, L=90, Rm=110;
  const doms = DOMAINS.filter(d=>w[d.max]>0);
  if (!doms.length) return '';
  const max = Math.max(...doms.map(d=>w[d.max]));
  const xs = v => L + (W-L-Rm)*v/max;
  const out=[];
  doms.forEach((d,i)=>{ const y=i*rowH+4, x0=xs(w[d.min]||0), x1=xs(w[d.max]);
    out.push(`<text x="${L-8}" y="${y+rowH/2+4}" text-anchor="end" class="lbl-strong" style="font-weight:500">${d.label}</text>`);
    out.push(`<rect x="${L}" y="${y+6}" width="${W-L-Rm}" height="${rowH-12}" fill="var(--surface-2)" rx="3"/>`);
    out.push(`<rect x="${x0.toFixed(1)}" y="${y+6}" width="${Math.max(2,x1-x0).toFixed(1)}" height="${rowH-12}" fill="${d.color}" rx="3"${tipAttr(`${d.label}: ${fmt.n(w[d.min]||0,1)} – ${fmt.n(w[d.max],1)} nm\nPoK ${w[d.pok]||0} %`)}/>`);
    out.push(`<text x="${x1+6}" y="${y+rowH/2+4}" class="lbl" style="fill:var(--text-2)">${fmt.n(w[d.min]||0,1)}–${fmt.n(w[d.max],1)} nm · PoK ${w[d.pok]||0}%</text>`);
  });
  for (const t of niceTicks(max,5)) out.push(`<text x="${xs(t).toFixed(1)}" y="${doms.length*rowH+16}" text-anchor="middle" class="lbl">${t}</text>`);
  return SVG(W, doms.length*rowH+22, out.join(''));
}
function weaponEnvelopeCard(w){
  const maxR = weaponMaxRange(w); if (!(maxR>0)) return '';
  const fam = WFAM[w.fam];
  const items=[];
  const la0=(w.LaunchAltitudeMin_ASL||w.LaunchAltitudeMin)||null, la1=(w.LaunchAltitudeMax_ASL||w.LaunchAltitudeMax)||null;
  const ta0=(w.TargetAltitudeMin_ASL||w.TargetAltitudeMin)||null, ta1=(w.TargetAltitudeMax_ASL||w.TargetAltitudeMax)||null;
  const isUnderwater = (la0<0)||(ta0<0)||w.fam==='torpedo';
  if (isUnderwater){
    // depth mode: launch & target depth
    if (la0!=null||la1!=null) items.push({label:'Launch depth',color:'var(--s7)',r0:0,r1:maxR*0.05,a0:Math.min(la0||0,la1||0),a1:Math.max(la0||0,la1||0),tip:`launch ${fmt.n(la0||0)} – ${fmt.n(la1||0)} m`});
    for (const d of DOMAINS) if (w[d.max]>0) items.push({label:d.label+' targets',color:d.color,r0:w[d.min]||0,r1:w[d.max],a0:Math.min(ta0||0,ta1||0),a1:Math.max(ta0||0,ta1||0),tip:`${fmt.n(w[d.min]||0,1)} – ${fmt.n(w[d.max],1)} nm · depth ${fmt.n(ta0||0)} – ${fmt.n(ta1||0)} m`});
    return `<div class="card"><h3>Engagement envelope<span class="hint">range × depth</span></h3>${rangeBars(w)}${envelopeChart(items,{mode:'depth',width:520,height:200})}</div>`;
  }
  if (la0!=null||la1!=null) items.push({label:'Launch envelope',color:'var(--s7)',r0:0,r1:maxR*0.05,a0:la0||10,a1:la1||la0,tip:`launch alt ${fmt.altPair(w.LaunchAltitudeMin,w.LaunchAltitudeMax,w.LaunchAltitudeMin_ASL,w.LaunchAltitudeMax_ASL)}${w.LaunchSpeedMax?'\nlaunch speed '+(w.LaunchSpeedMin||0)+' – '+w.LaunchSpeedMax+' kt':''}`});
  for (const d of DOMAINS){ if (!(w[d.max]>0)) continue;
    const hasT = (ta0!=null||ta1!=null) && d.k==='Air';
    items.push({label:d.label+' targets',color:d.color,r0:w[d.min]||0,r1:w[d.max],a0:hasT?(ta0||10):null,a1:hasT?(ta1||ta0):(d.k==='Air'?null:15),fill:d.k==='Air'?0.12:0.35,tip:`${d.label}: ${fmt.n(w[d.min]||0,1)} – ${fmt.n(w[d.max],1)} nm${hasT?'\ntarget alt '+fmt.altPair(w.TargetAltitudeMin,w.TargetAltitudeMax,w.TargetAltitudeMin_ASL,w.TargetAltitudeMax_ASL):''}${w.TargetSpeedMax?'\ntarget speed ≤ '+w.TargetSpeedMax+' kt':''}`}); }
  const cruise=(w.CruiseAltitude_ASL||w.CruiseAltitude)||0;
  if (cruise) items.push({label:'Cruise altitude',color:'var(--text-3)',r0:0,r1:maxR,a0:cruise,a1:cruise*1.001,dash:'4 3',fill:0,tip:`cruise ${fmt.m(cruise)}`});
  if (w.SnapUpDownAltitude) items.push({label:'Snap-up/down',color:'var(--s8)',r0:0,r1:maxR,a0:w.SnapUpDownAltitude,a1:w.SnapUpDownAltitude*1.001,dash:'2 3',fill:0,tip:`snap-up/down limit ${fmt.m(w.SnapUpDownAltitude)}`});
  const legend = `<div class="legend"><span><span class="sw" style="background:var(--s7)"></span>launch</span>${DOMAINS.filter(d=>w[d.max]>0).map(d=>`<span><span class="sw" style="background:${d.color}"></span>${d.label} targets</span>`).join('')}${cruise?'<span><span class="sw" style="background:var(--text-3)"></span>cruise alt</span>':''}${w.SnapUpDownAltitude?'<span><span class="sw" style="background:var(--s8)"></span>snap-up/down</span>':''}</div>`;
  return `<div class="card"><h3>Engagement envelope<span class="hint">range per domain, then range × altitude</span></h3>${rangeBars(w)}${legend}${envelopeChart(items,{width:520,height:230})}
  ${kv([['CEP (land / surface)',(w.CEP||w.CEPSurface)?(w.CEP||0)+' / '+(w.CEPSurface||0)+' m':null],['Launch speed',w.LaunchSpeedMax?(w.LaunchSpeedMin||0)+' – '+w.LaunchSpeedMax+' kt':null],['Target speed',w.TargetSpeedMax?(w.TargetSpeedMin||0)+' – '+w.TargetSpeedMax+' kt':null],['Climb rate',w.ClimbRate?fmt.n(w.ClimbRate)+' m/s':null],['Burnout',w.BurnoutTime?w.BurnoutTime+' s':null],['Max flight time',w.MaxFlightTime?fmt.n(w.MaxFlightTime)+' s':null],['Waypoints',w.WaypointNumber||null],['Illumination time',w.IlluminationTime?w.IlluminationTime+' s':null],['Detonation delay',w.DetonationDelay||null]])}</div>`;
}
function torpedoCard(w){
  if (!(w.TorpedoSpeedCruise||w.TorpedoSpeedFull)) return '';
  const items=[]; if (w.TorpedoSpeedCruise) items.push({label:`Cruise ${w.TorpedoSpeedCruise} kt`,value:w.TorpedoRangeCruise,color:'var(--s3)',text:fmt.nm(w.TorpedoRangeCruise)});

function seekerCard(w){

  const guidRe=/Navigation|LOAL|Lock-On|HOJ|Illumination|TERCOM|GPS|GLONASS|BeiDou|NavIC|ARM|Bearing|Search Pattern|Drive|Re-Attack|Terminal|Profile|Trajectory|Loiter|Anti-Air|Seaskimmer|Diving|Multi-Stage|CEC|Subsystems|Pre-Briefed|Attitude|Altitude Control|Fuze|C-RAM|Launcher/;

  return `<div class="card"><h3>Seeker &amp; guidance</h3><div class="comp-list">${sk||'<span class="small">No onboard seeker'+(w.fam==='bomb'||w.fam==='gun'||w.fam==='rocket'?' (unguided or externally guided)':'')+'.</span>'}</div>

  ${guidIds.length?`<div style="font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-top:8px">Guidance / employment codes</div><div class="chips" style="margin-top:3px">${gchips('wcode',guidIds,{on:true})}</div>`:''}${otherIds.length?`<div class="chips" style="margin-top:6px">${gchips('wcode',otherIds)}</div>`:''}

function warheadCard(w){

function weaponPropCard(w){

    else html += kv([['Propulsion',p.Name+' ('+E('PropulsionType',p.Type)+')']]);
  }
  if (fuel.length) html += kv([['Fuel / coast',fuel.map(f=>fmt.n(f[1])+(f[0]===5003?' s coast':' kg '+E('FuelType',f[0]))).join(', ')]]);
  return `<div class="card"><h3>Propulsion<span class="hint">speed by altitude band</span></h3>${html}</div>`;
}
function podCard(w){
  if (!w.sensors.length) return '';
  return `<div class="card"><h3>Sensors carried</h3><div class="comp-list">${w.sensors.map(([sid,mask])=>{const s=D.sensor.get(sid); return s?`<a class="comp" href="#/sensor/${s.ID}"><span>${arcRose(mask,40,FAMILY[s.fam].color)}</span><span><div class="nm">${esc(s.Name)}</div><div class="sub">${esc(E('SensorRole',s.Role))}</div></span><span class="cnt">${fmt.nm(s.RangeMax)}</span></a>`:'';}).join('')}</div></div>`;
}
function weaponMountsCard(wid){
  const wrs = IDX.wrByWeapon.get(wid)||[];
  const mounts = new Map(); const mags=new Set(); let loadouts=0;
  for (const wr of wrs){ for (const m of (IDX.wrMounts.get(wr)||[])) mounts.set(m,(mounts.get(m)||0)+1); for (const g of (IDX.wrMagazines.get(wr)||[])) mags.add(g); loadouts += (IDX.wrLoadouts.get(wr)||[]).length; }
  const ml=[...mounts.keys()].map(id=>D.mount.get(id)).filter(Boolean).sort((a,b)=>a.Name.localeCompare(b.Name));
  if (!ml.length && !mags.size && !loadouts) return '';
  return `<div class="card"><h3>Launchers<span class="hint">${ml.length} mounts · ${mags.size} magazines · ${loadouts} loadouts</span></h3><div class="chips">${ml.slice(0,60).map(m=>`<a class="chip" href="#/mount/${m.ID}" title="ROF ${m.ROF}, capacity ${m.Capacity}">${esc(m.Name)}</a>`).join('')}${ml.length>60?`<span class="chip">… ${ml.length-60} more</span>`:''}</div></div>`;
}
function viewWeapon(id){
  const w=D.weapon.get(id); if(!w) return '<p>Unknown weapon.</p>';
  const f=WFAM[w.fam];
  const wh = w.warheads.map(i=>D.warhead.get(i)).filter(Boolean);
  let html = `<div class="crumbs"><a href="#/">Overview</a> › <a href="#/weapon">Weapons</a> › <a href="#/weapon?f=${w.fam}">${f.label}</a></div>
  <h2 class="title"><span class="sw" style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${f.color};margin-right:8px"></span>${esc(w.Name)}${flags(w)}</h2>
  <div class="meta">${esc(E('WeaponType',w.Type))}${w.Generation&&w.Generation!==1001?' · '+esc(E('WeaponGeneration',w.Generation)):''}${w.Comments&&w.Comments!=='-'?' · '+esc(w.Comments):''} · guidance: ${esc(weaponGuidance(w)||'none')} · <span class="small">ID ${w.ID}</span></div>
  ${compareButton('weapon', w.ID, w.Name)}`;
  html += statTiles([...DOMAINS.filter(d=>w[d.max]>0).map(d=>[d.label+' range',fmt.n(w[d.max],1),'nm']),['Weight',w.Weight?fmt.n(w.Weight,1):null,'kg'],['Length',w.Length?fmt.n(w.Length,2):null,'m'],['Diameter',w.Diameter?fmt.n(w.Diameter,3):null,'m'],['Span',w.Span?fmt.n(w.Span,2):null,'m'],['Warhead DP',wh.length?fmt.n(wh.reduce((a,h)=>a+(h.DamagePoints||0),0),1):null],['Cost',w.Cost?fmt.n(w.Cost):null]]);
  html += `<div class="grid c2">`;
  html += weaponEnvelopeCard(w);
  if (w.fam==='torpedo') html += torpedoCard(w);
  html += seekerCard(w);
  html += warheadCard(w);
  html += weaponPropCard(w);
  if (w.fam==='pod'||w.fam==='sonobuoy'||w.fam==='decoy'||w.fam==='dispenser') html += podCard(w);
  html += targetsCard(w);
  html += signatureCard(w.sig, false);
  html += weaponMountsCard(id);
  html += carrierCard(weaponCarriers(id));
  const cargo = (w.Cargo_Mass||w.Cargo_Area)? kv([['Cargo class',E('CargoType',w.Cargo_Type)],['Mass / area / volume',[w.Cargo_Mass,w.Cargo_Area,w.Cargo_Volume].map(v=>fmt.n(v||0,3)).join(' / ')],['Burnout weight',w.BurnoutWeight?fmt.n(w.BurnoutWeight)+' kg':null]]) : '';
  if (cargo) html += `<div class="card"><h3>Logistics footprint</h3>${cargo}</div>`;
  html += `</div>`;
  return html;
}
</script>
<script>
/* ============================================================
   COMPARE — tray + side-by-side views
   ============================================================ */
const SLOT = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)'];
let tray = {g:null, items:[]};
try { const t = JSON.parse(localStorage.getItem('cmo.tray')||'null'); if (t && t.items) tray=t; } catch(e){}
function saveTray(){ try{ localStorage.setItem('cmo.tray', JSON.stringify(tray)); }catch(e){} }
function groupOf(route){ return KIND_BY_ROUTE[route] ? 'unit' : route; }
function inTray(route,id){ return tray.items.some(i=>i.r===route && i.id===id); }
function toggleTray(route,id,name){
  const g = groupOf(route);
  if (inTray(route,id)){ tray.items = tray.items.filter(i=>!(i.r===route&&i.id===id)); }
  else {
    if (tray.g!==g && tray.items.length){ if(!confirm(`The compare tray holds ${tray.g}s. Start a new ${g} comparison?`)) return; tray.items=[]; }
    if (tray.items.length>=4){ alert('Compare holds up to 4 entries. Remove one first.'); return; }
    tray.g=g; tray.items.push({r:route,id,name});
  }
  if (!tray.items.length) tray.g=null;
  saveTray(); render();
}
function compareButton(route,id,name){
  const on=inTray(route,id);
  return `<button class="cmpbtn ${on?'on':''}" onclick="toggleTray('${route}',${id},${JSON.stringify(name).replace(/"/g,'&quot;')})">${on?'✓ In compare tray':'+ Add to compare'}</button>`;
}
function renderTray(){
  let el=document.getElementById('tray');
  if (!tray.items.length){ if(el) el.remove(); return; }
  if (!el){ el=document.createElement('div'); el.id='tray'; document.body.appendChild(el); }
  const ids = tray.items.map(i=>i.r+':'+i.id).join(',');
  el.innerHTML = `<div style="font-weight:600;margin-bottom:4px">Compare ${tray.g}s (${tray.items.length}/4)</div>${tray.items.map((i,n)=>`<div class="row"><span class="sw" style="background:${SLOT[n]}"></span><span class="nm">${esc(i.name)}</span><span class="x" onclick="toggleTray('${i.r}',${i.id},'')">✕</span></div>`).join('')}
  <div class="actions"><button onclick="tray.items=[];tray.g=null;saveTray();render()">Clear</button><button class="primary" onclick="location.hash='#/compare?ids=${ids}'">Compare</button></div>`;
}
function cmpTable(items, defs){
  const n=items.length; const rows=[];
  for (const d of defs){
    if (d.sec){ rows.push(`<tr class="sec"><td colspan="${n+1}">${esc(d.sec)}</td></tr>`); continue; }
    const vals = items.map(it=>{ try{ return d.get(it); }catch(e){ return null; } });
    if (vals.every(v=>v==null||v===''||v===0||v==='—') && !d.keep) continue;
    const nums = vals.map(v=>typeof v==='number'?v:null);
    const validNums = nums.filter(v=>v!=null);
    let best=null; if (d.better&&validNums.length>1){ best = d.better==='high'?Math.max(...validNums):Math.min(...validNums); if (validNums.every(v=>v===best)) best=null; }
    const max = validNums.length? Math.max(...validNums.map(Math.abs)) : 0;
    rows.push(`<tr><td class="k">${esc(d.label)}</td>${vals.map((v,i)=>{ const isNum = typeof v==='number'; const txt = v==null||v===''?'—':(d.fmt?d.fmt(v,items[i]):(isNum?fmt.n(v,2):v)); const bar = (d.bar!==false && isNum && max>0)? `<div class="bar" style="width:${(Math.abs(v)/max*100).toFixed(0)}%;--c:${SLOT[i]}"></div>`:''; return `<td class="v${best!=null&&v===best?' best':''}">${d.html?txt:esc(txt)}${bar}</td>`; }).join('')}</tr>`);
  }
  return `<div class="wrap"><table class="cmp-table"><thead><tr><th></th>${items.map((it,i)=>`<th class="col" style="--c:${SLOT[i]}"><a href="${it._href}">${esc(it._name)}</a><div class="small" style="font-weight:400">${esc(it._sub||'')}</div></th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function viewCompare(params){
  const ids = (params.ids||'').split(',').filter(Boolean).map(s=>{ const [r,id]=s.split(':'); return {r,id:+id}; });
  if (!ids.length) return `<h2 class="title">Compare</h2><div class="meta">Add up to four sensors, weapons or platforms to the tray from their detail pages, then press Compare.</div>
  <div class="card"><h3>Examples</h3><div class="chips">
  <a class="chip" href="#/compare?ids=weapon:52,weapon:53,weapon:945">AIM-120C-6 vs C-4 vs AIM-9X</a>
  <a class="chip" href="#/compare?ids=sensor:160,sensor:1379">AN/SPY-1D(V) vs AN/APG-79</a>
  <a class="chip" href="#/compare?ids=weapon:89,weapon:826,weapon:1611">JDAM vs JSOW vs Harpoon</a></div></div>`;
  const g = groupOf(ids[0].r);
  const items = ids.map(x=>{ if (g==='sensor'){ const s=D.sensor.get(x.id); return s&&{...s,_name:s.Name,_href:'#/sensor/'+s.ID,_sub:E('SensorType',s.Type)}; } if (g==='weapon'){ const w=D.weapon.get(x.id); return w&&{...w,_name:w.Name,_href:'#/weapon/'+w.ID,_sub:E('WeaponType',w.Type)}; } const k=KIND_BY_ROUTE[x.r]; const u=k&&getUnit(k.key,x.id); return u&&{...u,_name:u.Name,_href:'#/'+x.r+'/'+u.ID,_sub:E('OperatorCountry',u.OperatorCountry)+' · '+fmt.yr(u),_route:x.r}; }).filter(Boolean).slice(0,4);
  if (!items.length) return '<p>Nothing to compare.</p>';
  let html = `<div class="crumbs"><a href="#/">Overview</a> › Compare</div><h2 class="title">Compare ${g}s</h2><div class="meta">${items.length} entries · best value in each row is bold</div>`;
  if (g==='sensor') html += compareSensors(items); else if (g==='weapon') html += compareWeapons(items); else html += compareUnits(items);
  return html;
}
/* ---------- sensors ---------- */
function compareSensors(items){
  const defs=[
    {sec:'Identity'},
    {label:'Family',get:s=>FAMILY[s.fam].label},{label:'Type',get:s=>E('SensorType',s.Type)},{label:'Role',get:s=>E('SensorRole',s.Role)},{label:'Generation',get:s=>E('SensorGeneration',s.Generation)},
    {sec:'Coverage'},
    {label:'Max range (nm)',get:s=>s.RangeMax||null,better:'high',fmt:v=>fmt.n(v,1)},{label:'Min range (nm)',get:s=>s.RangeMin||null,better:'low',fmt:v=>fmt.n(v,2)},
    {label:'Max altitude',get:s=>(s.AltitudeMax_ASL||s.AltitudeMax)||null,better:'high',fmt:v=>fmt.mShort(v)},{label:'Min altitude',get:s=>(s.AltitudeMin_ASL||s.AltitudeMin)||null,better:'low',fmt:v=>fmt.mShort(v)},
    {label:'Scan interval (s)',get:s=>s.ScanInterval||null,better:'low'},{label:'Capabilities',get:s=>s.caps.map(c=>E('SensorCapability',c)).join(', ')},
    {sec:'Tracking'},
    {label:'Max contacts (air/surf/sub)',get:s=>(s.MaxContactsAir||s.MaxContactsSurface||s.MaxContactsSubmarine)?[s.MaxContactsAir,s.MaxContactsSurface,s.MaxContactsSubmarine].map(v=>v||0).join(' / '):null},
    {label:'Illuminations',get:s=>s.MaxContactsIlluminate||null,better:'high'},{label:'Range resolution (nm)',get:s=>s.ResolutionRange||null,better:'low',fmt:v=>fmt.n(v,3)},{label:'Height resolution (m)',get:s=>s.ResolutionHeight||null,better:'low'},{label:'Angular resolution (°)',get:s=>s.ResolutionAngle||null,better:'low'},{label:'DF accuracy (°)',get:s=>s.DirectionFindingAccuracy||null,better:'low'},
    {sec:'Radar'},
    {label:'Bands',get:s=>s.freqST.filter(f=>f<2000).map(f=>E('SensorFrequency',f).charAt(0)).join(' ')||null},{label:'Frequency',get:s=>s.FrequencyLower?fmt.hz(s.FrequencyLower)+' – '+fmt.hz(s.FrequencyUpper):null},
    {label:'Peak power (W)',get:s=>s.RadarPeakPower||null,better:'high',fmt:v=>fmt.n(v)},{label:'PRF (Hz)',get:s=>s.RadarPRF||null},{label:'Pulse width (µs)',get:s=>s.RadarPulseWidth||null},{label:'Beamwidth H×V (°)',get:s=>s.RadarHorizontalBeamwidth?s.RadarHorizontalBeamwidth+' × '+s.RadarVerticalBeamwidth:null},{label:'Noise (dB)',get:s=>s.RadarSystemNoiseLevel||null,better:'low'},{label:'Processing gain/loss (dB)',get:s=>s.RadarProcessingGainLoss||null,better:'high'},
    {sec:'ESM / ECM'},
    {label:'Sensitivity (dBm)',get:s=>s.ESMSensitivity||null,better:'low'},{label:'Channels',get:s=>s.ESMNumberOfChannels||null,better:'high'},{label:'Precise emitter ID',get:s=>s.ESMPreciseEmitterID?'yes':null},{label:'ECM gain (dB)',get:s=>s.ECMGain||null,better:'high'},{label:'ECM power (W)',get:s=>s.ECMPeakPower||null,better:'high'},{label:'ECM targets',get:s=>s.ECMNumberOfTargets||null,better:'high'},{label:'PoK reduction (%)',get:s=>s.ECMPoKReduction||null,better:'high'},
    {sec:'Optics'},
    {label:'Detection zoom',get:s=>s.VisualDetectionZoomLevel||s.IRDetectionZoomLevel||null,better:'high'},{label:'Classification zoom',get:s=>s.VisualClassificationZoomLevel||s.IRClassificationZoomLevel||null,better:'high'},{label:'Night capable',get:s=>s.fam==='ir'?'yes':(s.codes.includes(2701)?'yes':(s.fam==='visual'?'no':null))},
    {sec:'Sonar'},
    {label:'Source level (dB)',get:s=>s.SonarSourceLevel||null,better:'high'},{label:'Directivity index (dB)',get:s=>s.SonarDirectivityIndex||null,better:'high'},{label:'Recognition diff. active/passive',get:s=>(s.SonarRecognitionDifferentialActive||s.SonarRecognitionDifferentialPassive)?(s.SonarRecognitionDifferentialActive||0)+' / '+(s.SonarRecognitionDifferentialPassive||0):null},{label:'Convergence zones',get:s=>s.SonarCZNumber||null,better:'high'},{label:'Tow length (m)',get:s=>s.SonarTowLength||null,better:'high'},{label:'Deploy depth (m)',get:s=>(s.SonarMinimumDeploymentDepth||s.SonarMaximumDeploymentDepth)?fmt.n(Math.abs(s.SonarMaximumDeploymentDepth))+' – '+fmt.n(Math.abs(s.SonarMinimumDeploymentDepth)):null},
    {sec:'Usage'},
    {label:'Fitted on platforms',get:s=>sensorCarriers(s.ID).length,better:null},{label:'Seeker for weapons',get:s=>(IDX.sensorWeapons.get(s.ID)||[]).length},
  ];
  const ranged = items.filter(s=>s.RangeMax>0);
  const rings = coverageRings(items.map((s,i)=>({label:s.Name,range:s.RangeMax,mask:0xFFFF,color:SLOT[i],sub:E('SensorType',s.Type)})),{size:340});
  const env = envelopeChart(items.filter(s=>s.fam!=='sonar').map((s,i)=>({label:s.Name,color:SLOT[i],r0:s.RangeMin||0,r1:s.RangeMax,a0:(s.AltitudeMin_ASL||s.AltitudeMin)||null,a1:(s.AltitudeMax_ASL||s.AltitudeMax)||null,tip:`${fmt.nm(s.RangeMax)} · alt ${sensorAltText(s)}`})),{width:520,height:240});
  const freq = items.filter(s=>s.freqST.some(f=>f<2000)||s.FrequencyLower).map((s,i)=>`<div style="margin:6px 0 2px;font-size:12px"><span class="sw" style="display:inline-block;width:9px;height:9px;background:${SLOT[i]};border-radius:2px;margin-right:6px"></span>${esc(s.Name)}</div>${freqStrip(s.freqST,s.freqIL,s.FrequencyLower?[{label:'',lo:s.FrequencyLower,hi:s.FrequencyUpper,color:SLOT[i]}]:[],{width:520})}`).join('');
  const legend = `<div class="legend">${items.map((s,i)=>`<span><span class="sw" style="background:${SLOT[i]}"></span>${esc(s.Name)}</span>`).join('')}</div>`;
  return `<div class="grid c2" style="margin-bottom:14px">${ranged.length?`<div class="card"><h3>Range overlay<span class="hint">log radial scale, arcs ignored</span></h3>${legend}${rings}</div><div class="card"><h3>Range × altitude</h3>${legend}${env}</div>`:''}${freq?`<div class="card" style="grid-column:1/-1"><h3>Frequency coverage</h3>${freq}</div>`:''}</div>${cmpTable(items,defs)}`;
}
/* ---------- weapons ---------- */
function weaponMaxSpeed(w){ let m=0; for (const pid of w.prop) for (const r of (D.propPerf[pid]||[])) m=Math.max(m,r[2]); return m||null; }
function seekerRange(w){ let m=0; for (const [sid] of w.sensors){ const s=D.sensor.get(sid); if(s) m=Math.max(m,s.RangeMax||0);} return m||null; }
function compareWeapons(items){
  const wh = w => w.warheads.map(i=>D.warhead.get(i)).filter(Boolean);
  const defs=[
    {sec:'Identity'},{label:'Family',get:w=>WFAM[w.fam].label},{label:'Type',get:w=>E('WeaponType',w.Type)},{label:'Generation',get:w=>w.Generation&&w.Generation!==1001?E('WeaponGeneration',w.Generation):null},{label:'Guidance',get:w=>weaponGuidance(w)||null},
    {sec:'Reach'},
    ...DOMAINS.flatMap(d=>[{label:d.label+' range (nm)',get:w=>w[d.max]||null,better:'high',fmt:v=>fmt.n(v,1)},{label:d.label+' min range (nm)',get:w=>w[d.min]||null,better:'low',fmt:v=>fmt.n(v,1)},{label:d.label+' PoK (%)',get:w=>w[d.pok]||null,better:'high'}]),
    {label:'CEP (m)',get:w=>w.CEP||w.CEPSurface||null,better:'low'},
    {sec:'Envelope'},
    {label:'Launch altitude',get:w=>fmt.altPair(w.LaunchAltitudeMin,w.LaunchAltitudeMax,w.LaunchAltitudeMin_ASL,w.LaunchAltitudeMax_ASL)},{label:'Launch speed (kt)',get:w=>w.LaunchSpeedMax?(w.LaunchSpeedMin||0)+' – '+w.LaunchSpeedMax:null},
    {label:'Target altitude',get:w=>fmt.altPair(w.TargetAltitudeMin,w.TargetAltitudeMax,w.TargetAltitudeMin_ASL,w.TargetAltitudeMax_ASL)},{label:'Max target speed (kt)',get:w=>w.TargetSpeedMax||null,better:'high'},{label:'Snap-up/down (m)',get:w=>w.SnapUpDownAltitude||null,better:'high',fmt:v=>fmt.n(v)},{label:'Cruise altitude',get:w=>(w.CruiseAltitude_ASL||w.CruiseAltitude)?fmt.mShort(w.CruiseAltitude_ASL||w.CruiseAltitude):null},
    {label:'Max speed (kt)',get:w=>weaponMaxSpeed(w),better:'high'},{label:'Burnout (s)',get:w=>w.BurnoutTime||null},{label:'Max flight time (s)',get:w=>w.MaxFlightTime||null,better:'high'},{label:'Climb rate (m/s)',get:w=>w.ClimbRate||null,better:'high'},
    {label:'Torpedo cruise (kt / nm)',get:w=>w.TorpedoSpeedCruise?w.TorpedoSpeedCruise+' kt / '+w.TorpedoRangeCruise+' nm':null},{label:'Torpedo full (kt / nm)',get:w=>w.TorpedoSpeedFull?w.TorpedoSpeedFull+' kt / '+w.TorpedoRangeFull+' nm':null},
    {sec:'Seeker & warhead'},
    {label:'Seeker',get:w=>w.sensors.map(([sid])=>{const s=D.sensor.get(sid); return s?s.Name:'';}).filter(Boolean).join(', ')||null},{label:'Seeker range (nm)',get:w=>seekerRange(w),better:'high'},
    {label:'Warhead',get:w=>wh(w).map(h=>E('WarheadType',h.Type)).join(', ')||null},{label:'Warhead damage points',get:w=>{const s=wh(w).reduce((a,h)=>a+(h.DamagePoints||0),0); return s||null;},better:'high'},{label:'Explosive (kg)',get:w=>{const s=wh(w).reduce((a,h)=>a+((h.ExplosivesWeight&&h.ExplosivesWeight!==1001)?h.ExplosivesWeight:0),0); return s||null;},better:'high'},
    {sec:'Physical'},{label:'Weight (kg)',get:w=>w.Weight||null,better:'low',fmt:v=>fmt.n(v,1)},{label:'Length (m)',get:w=>w.Length||null},{label:'Diameter (m)',get:w=>w.Diameter||null},{label:'Span (m)',get:w=>w.Span||null},{label:'Cost',get:w=>w.Cost||null,better:'low',fmt:v=>fmt.n(v)},
    {sec:'Signature'},{label:'RCS front/side/rear (dBsm)',get:w=>w.sig[5002]&&w.sig[5002].some(v=>v)?w.sig[5002].map(v=>fmt.n(v,1)).join(' / '):null},{label:'IR range front/side/rear (nm)',get:w=>w.sig[4001]&&w.sig[4001].some(v=>v)?w.sig[4001].map(v=>fmt.n(v,1)).join(' / '):null},
    {sec:'Usage'},{label:'Targets',get:w=>w.targets.map(t=>E('WeaponTarget',t)).join(', ')||null},{label:'Carried by platforms',get:w=>weaponCarriers(w.ID).length},
  ];
  const legend = `<div class="legend">${items.map((w,i)=>`<span><span class="sw" style="background:${SLOT[i]}"></span>${esc(w.Name)}</span>`).join('')}</div>`;
  // reach overlay: grouped by domain
  const bars=[]; for (const d of DOMAINS){ if (!items.some(w=>w[d.max]>0)) continue; items.forEach((w,i)=>{ if (w[d.max]>0) bars.push({label:d.label+' · '+w.Name, value:w[d.max], color:SLOT[i], text:fmt.nm(w[d.max]), tip:`${w.Name}\n${d.label}: ${fmt.n(w[d.min]||0,1)} – ${fmt.n(w[d.max],1)} nm · PoK ${w[d.pok]||0}%`}); }); }
  const env = envelopeChart(items.flatMap((w,i)=>{ const maxR=weaponMaxRange(w); if(!(maxR>0)) return []; const ta0=(w.TargetAltitudeMin_ASL||w.TargetAltitudeMin)||null, ta1=(w.TargetAltitudeMax_ASL||w.TargetAltitudeMax)||null; const la0=(w.LaunchAltitudeMin_ASL||w.LaunchAltitudeMin)||null, la1=(w.LaunchAltitudeMax_ASL||w.LaunchAltitudeMax)||null; const minR=Math.min(...DOMAINS.filter(d=>w[d.max]>0).map(d=>w[d.min]||0));
    const out=[{label:w.Name+' — target zone',color:SLOT[i],r0:minR,r1:maxR,a0:ta0!=null?ta0:null,a1:ta1!=null?ta1:(ta0!=null?ta0:15),fill:0.12,tip:`${w.Name}\nreach ${fmt.n(minR,1)} – ${fmt.n(maxR,1)} nm\ntarget alt ${fmt.altPair(w.TargetAltitudeMin,w.TargetAltitudeMax,w.TargetAltitudeMin_ASL,w.TargetAltitudeMax_ASL)}`}];
    if (la0!=null||la1!=null) out.push({label:w.Name+' — launch',color:SLOT[i],r0:0,r1:maxR*0.04,a0:la0||10,a1:la1||la0,dash:'3 2',fill:0.3,tip:`${w.Name}\nlaunch alt ${fmt.altPair(w.LaunchAltitudeMin,w.LaunchAltitudeMax,w.LaunchAltitudeMin_ASL,w.LaunchAltitudeMax_ASL)}`}); return out; }),{width:540,height:250});
  const speed = stepChart(items.map((w,i)=>{ const pts=[]; for (const pid of w.prop) for (const [band,thr,spd,a0,a1] of (D.propPerf[pid]||[])) if (thr===2) pts.push({a0,a1,v:spd}); return {label:w.Name,color:SLOT[i],pts:pts.sort((a,b)=>a.a0-b.a0)}; }).filter(s=>s.pts.length),{width:520,height:200,xlabel:'altitude band (m)'});
  const hasSpeed = items.some(w=>weaponMaxSpeed(w));
  return `<div class="grid c2" style="margin-bottom:14px"><div class="card"><h3>Reach by domain</h3>${legend}${hbars(bars,{width:540,rowH:18,labelW:250})}</div><div class="card"><h3>Envelope overlay<span class="hint">solid = target zone, dashed = launch</span></h3>${legend}${env}</div>${hasSpeed?`<div class="card" style="grid-column:1/-1"><h3>Speed profile (cruise throttle)</h3>${legend}${speed}</div>`:''}</div>${cmpTable(items,defs)}`;
}
/* ---------- units ---------- */
function unitMaxSpeed(u){ let m=0; for (const pid of u.prop) for (const r of (D.propPerf[pid]||[])) m=Math.max(m,r[2]); return m||null; }
function unitBestSensor(u, fam){ let best=null; for (const o of sensorInstancesAll(u)) for (const [,s] of expandSensorGroup(o.s)) if (s.fam===fam && s.RangeMax>(best?best.RangeMax:0)) best=s; return best; }
function unitBestWeapon(u, d){ let best=null; for (const e of unitWeapons(u)) if (e.w[d.max]>(best?best[d.max]:0)) best=e.w; return best; }
function compareUnits(items){
  const defs=[
    {sec:'Identity'},{label:'Class',get:u=>KIND_BY_KEY[u.kind].label.replace(/s$/,'')},{label:'Type',get:u=>{const k=u.kind; return k==='Facility'?E('FacilityType',u.Type):k==='GroundUnit'?E('GroundUnitCategory',u.Category):E(k+'Type',u.Type);}},{label:'Operator',get:u=>E('OperatorCountry',u.OperatorCountry)},{label:'In service',get:u=>fmt.yr(u)},
    {sec:'Physical'},{label:'Length (m)',get:u=>u.Length||null},{label:'Span / beam (m)',get:u=>u.Span||u.Beam||null},{label:'Displacement full (t)',get:u=>u.DisplacementFull||null,fmt:v=>fmt.n(v)},{label:'Empty weight (kg)',get:u=>u.WeightEmpty||null,fmt:v=>fmt.n(v)},{label:'Max weight (kg)',get:u=>u.WeightMax||null,fmt:v=>fmt.n(v)},{label:'Payload (kg)',get:u=>u.WeightPayload||null,better:'high',fmt:v=>fmt.n(v)},{label:'Crew',get:u=>u.Crew||null,fmt:v=>fmt.n(v)},
    {sec:'Survivability'},{label:'Damage points',get:u=>u.DamagePoints||null,better:'high',fmt:v=>fmt.n(v)},{label:'Armor',get:u=>u.kind==='Ship'?[u.ArmorBelt,u.ArmorBulkheads,u.ArmorDeck].map(armorTxt).join(' · '):u.kind==='Aircraft'?[u.AircraftEngineArmor,u.AircraftFuselageArmor,u.AircraftCockpitArmor].map(armorTxt).join(' · '):(u.ArmorGeneral?armorTxt(u.ArmorGeneral):null)},{label:'Missile defence',get:u=>u.MissileDefense||null,better:'high'},{label:'RCS front/side/rear (dBsm)',get:u=>u.sig[5002]&&u.sig[5002].some(v=>v)?u.sig[5002].slice(0,3).map(v=>fmt.n(v,1)).join(' / '):null},{label:'IR range front/side/rear (nm)',get:u=>u.sig[4001]&&u.sig[4001].some(v=>v)?u.sig[4001].slice(0,3).map(v=>fmt.n(v,1)).join(' / '):null},{label:'Passive sonar LF (dB)',get:u=>u.sig[1002]&&u.sig[1002].some(v=>v)?u.sig[1002].slice(0,3).map(v=>fmt.n(v,1)).join(' / '):null},
    {sec:'Performance'},{label:'Max speed (kt)',get:u=>unitMaxSpeed(u),better:'high'},{label:'Agility',get:u=>u.Agility||null,better:'high'},{label:'Climb rate (m/s)',get:u=>u.ClimbRate||null,better:'high'},{label:'Max depth (m)',get:u=>u.MaxDepth||null,better:'high'},{label:'Fuel',get:u=>fuelText(u.fuel)||null},{label:'OODA detect/target/evade (s)',get:u=>[u.OODADetectionCycle,u.OODATargetingCycle,u.OODAEvasiveCycle].join(' / ')},{label:'Combat system / cockpit',get:u=>u.kind==='Aircraft'?E('AircraftCockpitGen',u.CockpitGen):E((u.kind==='Ship'?'Ship':u.kind==='Submarine'?'Submarine':u.kind==='Facility'?'Facility':'GroundUnit')+'CSGen',u.CSGen)},
    {sec:'Sensors'},{label:'Sensors (distinct)',get:u=>sensorInstancesAll(u).length,better:'high'},{label:'Best radar (nm)',get:u=>{const s=unitBestSensor(u,'radar'); return s?s.RangeMax:null;},better:'high',fmt:(v,u)=>fmt.n(v,1)+' · '+unitBestSensor(u,'radar').Name},{label:'Best ESM (nm)',get:u=>{const s=unitBestSensor(u,'esm'); return s?s.RangeMax:null;},better:'high',fmt:(v,u)=>fmt.n(v,1)+' · '+unitBestSensor(u,'esm').Name},{label:'Best sonar (nm)',get:u=>{const s=unitBestSensor(u,'sonar'); return s?s.RangeMax:null;},better:'high',fmt:(v,u)=>fmt.n(v,1)+' · '+unitBestSensor(u,'sonar').Name},{label:'Best IR / EO (nm)',get:u=>{const s=unitBestSensor(u,'ir')||unitBestSensor(u,'visual'); return s?s.RangeMax:null;},better:'high',fmt:(v,u)=>fmt.n(v,1)+' · '+(unitBestSensor(u,'ir')||unitBestSensor(u,'visual')).Name},
    {sec:'Weapons (mounts & magazines)'},{label:'Mounts',get:u=>u.mounts.length,better:'high'},{label:'Distinct weapons',get:u=>unitWeapons(u).length,better:'high'},
    ...DOMAINS.map(d=>({label:'Longest '+d.label.toLowerCase()+' reach (nm)',get:u=>{const w=unitBestWeapon(u,d); return w?w[d.max]:null;},better:'high',fmt:(v,u)=>fmt.n(v,1)+' · '+unitBestWeapon(u,d).Name})),
    {label:'Loadouts',get:u=>u.loadouts.length||null,better:'high'},{label:'Cost',get:u=>u.Cost||null,better:'low',fmt:v=>fmt.n(v)},
  ];
  const legend = `<div class="legend">${items.map((u,i)=>`<span><span class="sw" style="background:${SLOT[i]}"></span>${esc(u.Name)}</span>`).join('')}</div>`;
  // sensor coverage small multiples, shared scale
  let gmax=1; const per = items.map(u=>{ const it=[]; const seen=new Set(); for (const o of sensorInstancesAll(u)) for (const [sid,s] of expandSensorGroup(o.s)){ if(seen.has(sid)||!(s.RangeMax>0)) continue; seen.add(sid); it.push({label:s.Name,range:s.RangeMax,mask:o.mask,color:FAMILY[s.fam].color,sub:E('SensorRole',s.Role)}); gmax=Math.max(gmax,s.RangeMax);} return it; });
  const rings = items.map((u,i)=>`<div style="text-align:center"><div style="font-size:12px;margin-bottom:2px"><span class="sw" style="display:inline-block;width:9px;height:9px;background:${SLOT[i]};border-radius:2px;margin-right:5px"></span>${esc(u.Name)}</div>${per[i].length?coverageRings(per[i],{size:250,minMax:gmax}):'<div class="small">no ranged sensors</div>'}</div>`).join('');
  const famLegend = `<div class="legend">${Object.entries(FAMILY).filter(([f])=>per.some(p=>p.some(i=>i.color===FAMILY[f].color))).map(([f,v])=>`<span><span class="sw" style="background:${v.color}"></span>${v.label}</span>`).join('')}</div>`;
  const bars=[]; for (const d of DOMAINS){ items.forEach((u,i)=>{ const w=unitBestWeapon(u,d); if (w) bars.push({label:d.label+' · '+u.Name, value:w[d.max], color:SLOT[i], text:fmt.nm(w[d.max])+' · '+w.Name, tip:`${u.Name}\n${w.Name}: ${fmt.n(w[d.max],1)} nm ${d.label.toLowerCase()}`}); }); }
  const speed = stepChart(items.map((u,i)=>{ const pts=[]; for (const pid of u.prop) for (const [band,thr,spd,a0,a1] of (D.propPerf[pid]||[])) if (thr===3) pts.push({a0,a1,v:spd}); return {label:u.Name,color:SLOT[i],pts:pts.sort((a,b)=>a.a0-b.a0)}; }).filter(s=>s.pts.length&&s.pts.length>1),{width:520,height:200,xlabel:'altitude band (m)'});
  const hasProfile = items.some(u=>u.prop.some(pid=>(D.propPerf[pid]||[]).filter(r=>r[1]===3).length>1));
  return `<div class="card" style="margin-bottom:14px"><h3>Sensor coverage<span class="hint">shared log scale · max ${fmt.nm(gmax)}</span></h3>${famLegend}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px">${rings}</div></div>
  <div class="grid c2" style="margin-bottom:14px"><div class="card"><h3>Longest weapon reach by domain</h3>${legend}${bars.length?hbars(bars,{width:540,rowH:18,labelW:230,log:true}):'<span class="small">No ranged weapons.</span>'}</div>${hasProfile?`<div class="card"><h3>Speed by altitude (full throttle)</h3>${legend}${speed}</div>`:''}</div>${cmpTable(items,defs)}`;
}
</script>
<script>
/* ============================================================
   SYSTEMS PAGES — game-mechanics explainers driven by live data
   ============================================================ */
function ewFindOECM(){ return [...D.sensor.values()].filter(s=>s.Role===4001 && !s.Deprecated); }
function ewFindDECM(){ return [...D.sensor.values()].filter(s=>s.Role===4011 && !s.Deprecated); }
function ewFindMALDJ(){ return [...D.weapon.values()].find(w=>/MALD-J/i.test(w.Name)) || [...D.weapon.values()].find(w=>/MALD/i.test(w.Name)&&w.sensors.length); }

/* stand-in jamming geometry schematic */
function ewGeometry(){
  const W=560,H=250;
  const rx=470, ry=120;            // threat radar (right)
  const strikeX=150, strikeY=95;   // strikers (left)
  const jamX=70, jamY=150;         // stand-in jammer (behind/below strikers)
  const o=[];
  // radar detection fan (toward left)
  o.push(`<path d="M${rx},${ry} L${rx-330},${ry-95} A340,340 0 0 1 ${rx-330},${ry+95} Z" fill="var(--s1)" fill-opacity="0.06" stroke="var(--s1)" stroke-opacity="0.4" stroke-width="1"/>`);
  // burn-through ring (jamming fails inside this)
  o.push(`<circle cx="${rx}" cy="${ry}" r="78" fill="var(--s8)" fill-opacity="0.10" stroke="var(--s8)" stroke-dasharray="4 3" stroke-width="1.3"/>`);
  o.push(`<text x="${rx-78}" y="${ry-64}" text-anchor="middle" class="lbl" style="fill:var(--s8)">burn-through</text>`);
  // jam cone from jammer to radar
  o.push(`<path d="M${jamX},${jamY} L${rx-6},${ry-46} L${rx-6},${ry+46} Z" fill="var(--s2)" fill-opacity="0.14" stroke="var(--s2)" stroke-opacity="0.5" stroke-width="1"/>`);
  // radar icon
  o.push(`<circle cx="${rx}" cy="${ry}" r="8" fill="var(--s1)"/><path d="M${rx},${ry} l0,-24" stroke="var(--s1)" stroke-width="2"/><path d="M${rx-9},${ry-24} q9,-8 18,0" fill="none" stroke="var(--s1)" stroke-width="2"/>`);
  o.push(`<text x="${rx}" y="${ry+24}" text-anchor="middle" class="lbl-strong">SAM engagement radar</text>`);
  // strikers
  for (const dx of [0,30,60]){ const x=strikeX+dx, y=strikeY+dx*0.16;
    o.push(`<path d="M${x},${y} l14,4 l-14,4 l4,-4 Z" fill="var(--text)" transform="rotate(8 ${x} ${y})"/>`); }
  o.push(`<text x="${strikeX+28}" y="${strikeY-9}" text-anchor="middle" class="lbl-strong">strike package →</text>`);
  // jammer
  o.push(`<circle cx="${jamX}" cy="${jamY}" r="7" fill="var(--s2)"/><path d="M${jamX-3},${jamY-13} l3,-6 l3,6 Z" fill="var(--s2)"/>`);
  o.push(`<text x="${jamX+4}" y="${jamY+22}" text-anchor="middle" class="lbl-strong" style="fill:var(--s2)">MALD-J (stand-in)</text>`);
  o.push(`<text x="${jamX+4}" y="${jamY+34}" text-anchor="middle" class="lbl">between strikers &amp; threat</text>`);
  return SVG(W,H,o.join(''));
}

/* frequency coverage: jammer bands vs the bands radars actually use */
function ewBandCoverage(jammerBands){
  const W=560,top=20,bh=22;
  const cov=new Set(jammerBands.map(id=>E('SensorFrequency',id).charAt(0)));
  const roleBand=[['A','B','C','early-warning / VHF-UHF search','var(--s4)'],['D','E','','long-range search','var(--s1)'],['F','G','H','medium search / acquisition','var(--s1)'],['I','J','','fire-control / engagement / missile seekers','var(--s2)']];
  const o=[]; const f0=Math.log10(30e6),f1=Math.log10(100e9);
  const xs=f=>8+(W-16)*(Math.log10(f)-f0)/(f1-f0);
  for (const [b,lo,hi] of RADAR_BANDS){ const x0=xs(lo),x1=xs(hi),on=cov.has(b);
    o.push(`<rect x="${x0.toFixed(1)}" y="${top}" width="${(x1-x0-1).toFixed(1)}" height="${bh}" rx="3" fill="${on?'var(--s2)':'var(--surface-2)'}" fill-opacity="${on?0.85:1}" stroke="${on?'var(--s2)':'var(--border-2)'}" stroke-width="1"${tipAttr(E('SensorFrequency', jammerBands.find(id=>E('SensorFrequency',id).charAt(0)===b))||(b+' band '+fmt.hz(lo)+'–'+fmt.hz(hi)+(on?' · JAMMED':' · not covered')))}/>`);
    o.push(`<text x="${((x0+x1)/2).toFixed(1)}" y="${top+bh/2+4}" text-anchor="middle" class="lbl" style="fill:${on?'#fff':'var(--text-3)'};font-weight:600">${b}</text>`);
  }
  for (const f of [100e6,1e9,10e9,100e9]) o.push(`<text x="${xs(f).toFixed(1)}" y="${top-6}" text-anchor="middle" class="lbl">${fmt.hz(f)}</text>`);
  // what lives in each band
  o.push(`<text x="8" y="${top+bh+18}" class="lbl">${cov.has('A')?'':'gap: '} low-band search (A–C) — MALD-J cannot attack</text>`);
  return SVG(W,top+bh+28,o.join(''));
}

function viewEW(params){
  const oecm=ewFindOECM(), decm=ewFindDECM();
  const maldj=ewFindMALDJ();
  const jammer = maldj && maldj.sensors.map(([sid])=>D.sensor.get(sid)).find(s=>s&&s.Role===4001);
  const esm = maldj && maldj.sensors.map(([sid])=>D.sensor.get(sid)).find(s=>s&&s.fam==='esm');
  let html = `<div class="crumbs"><a href="#/">Overview</a> › Systems › Electronic Warfare</div>
  <h2 class="title">Electronic warfare in Command</h2>
  <div class="meta">How the sim models jamming — extracted from the sensor tables and the game manual (§9.2.6). Figures below are live from <b>${esc(D.meta.name)}</b>: ${oecm.length} OECM and ${decm.length} DECM systems.</div>`;

  // Two models
  html += `<div class="grid c2">
  <div class="card"><h3>DECM — defensive, self-protection<span class="hint">role 4011</span></h3>
    <p style="margin:0 0 8px;font-size:13px;line-height:1.55">Resolves <b>only at the weapon endgame</b>: when a seeker-guided weapon closes on the carrying unit, DECM rolls to spoof it. Success is random chance weighted by the <b>generation of the jammer vs. the generation of the seeker</b> — an old jammer rarely beats a modern seeker. It protects <b>only its own platform</b>, never emits on the map, and is invisible to enemy ESM.</p>
    <p style="margin:0;font-size:13px">Modeled by one field, <span class="v" style="font-family:var(--mono)">ECMPoKReduction</span> — a flat probability-of-kill cut:</p>
    ${hbars(ewDecmByGrade(decm),{width:460,labelW:150,rowH:20})}</div>
  <div class="card"><h3>OECM — offensive, area jamming<span class="hint">role 4001</span></h3>
    <p style="margin:0 0 8px;font-size:13px;line-height:1.55">Projects <b>noise jamming</b> that degrades enemy <b>detection and track quality</b> across an area — it can confuse many radars at once. It does <b>not</b> touch the endgame calc; instead it works upstream, corrupting tracks so SARH shots fail or the enemy never gets a firing solution. Costs: enemy ESM can hear it and geolocate the jammer, and it needs line-of-sight geometry.</p>
    <p style="margin:0;font-size:13px">Modeled by four physical fields — power drives jamming strength:</p>
    ${hbars(oecm.slice().sort((a,b)=>b.ECMPeakPower-a.ECMPeakPower).filter((s,i,a)=>a.findIndex(x=>x.ECMPeakPower===s.ECMPeakPower)===i).slice(0,5).map(s=>({label:'≤ '+fmt.n(s.ECMPeakPower)+' W',value:s.ECMPeakPower,color:'var(--s2)',text:fmt.n(s.ECMPeakPower)+' W'})),{width:460,labelW:150,rowH:20,log:true})}</div>
  </div>`;

  // How OECM picks targets
  html += `<div class="card full"><h3>How OECM decides what to jam<span class="hint">the target-selection logic</span></h3>
  <div style="font-size:13.5px;line-height:1.6;max-width:1100px">
  <p style="margin:0 0 8px">There is <b>no manual "jam this contact" order</b>. OECM is automatic and gated only by <b>EMCON</b>: set the emitter's OECM state to <b>Active</b> and it radiates; set it <b>Passive</b> and it stays silent (like any radar, an active jammer is loud and can be located from farther than its own useful range). Once Active, the engine decides the affect-set from four gates:</p>
  <div class="grid c2" style="gap:10px;margin:6px 0">
    <div>${kv([['① Band overlap','the jammer can only touch radars whose operating band it covers — see the strip below'],['② Line-of-sight geometry','the manual is explicit: OECM is "very dependent on geometry and positioning" — no LOS, no effect'],])}</div>
    <div>${kv([['③ Tech contest','effect scales with jammer strength vs. the radar’s resistance; frequency-agile and PESA/AESA radars shrug much of it off'],['④ Capacity cap','it services at most ECMNumberOfTargets emitters at once']])}</div>
  </div>
  <p style="margin:8px 0 0">When more in-band emitters are visible than the capacity cap, the exact priority order (nearest first, highest-threat first, illuminators first) is <b>engine-internal and not documented</b> — treat it as automatic area coverage of the emitters it can reach, not a controllable target list. The observable result: jammed fire-control radars can't hold the track needed to guide, which is why the "can't engage" reasons in the manual list <i>counter jamming</i> as a fix.</p>
  </div></div>`;

  // Band coverage + geometry
  if (jammer) html += `<div class="grid c2">
    <div class="card"><h3>Gate ① — band overlap<span class="hint">${esc(jammer.Name)} coverage vs. radar bands</span></h3>${ewBandCoverage(jammer.freqST)}
    <p class="note">Orange = jammed. This jammer covers <b>${jammer.freqST.map(f=>E('SensorFrequency',f).charAt(0)).join(', ')}</b> (${fmt.hz(1e9)}–${fmt.hz(20e9)}) — the fire-control and engagement bands (a Patriot MPQ-53 is G-band, squarely inside). It cannot touch A–C low-band early-warning search: those radars still see the package.</p></div>
    <div class="card"><h3>Gate ② — geometry<span class="hint">stand-in escort jamming</span></h3>${ewGeometry()}
    <p class="note">Position the jammer <b>between the strikers and the threat</b>, as close to the target radar as it can survive. Jamming weakens with range and off-axis angle; close enough, the radar <b>burns through</b> and the jamming fails.</p></div>
  </div>`;

  // MALD-J case study
  if (maldj) html += ewMaldCase(maldj, jammer, esm);

  // Jammer roster (live)
  html += `<div class="card full"><h3>OECM systems in this database<span class="hint">${oecm.length} — sorted by power; click for detail</span></h3>
  <div class="wrap"><table class="list"><thead><tr><th>System</th><th>Peak power</th><th>Gain</th><th>Emitters</th><th>Bands</th><th>Comments</th></tr></thead><tbody>
  ${oecm.slice().sort((a,b)=>(b.ECMPeakPower-a.ECMPeakPower)||a.Name.localeCompare(b.Name)).slice(0,40).map(s=>`<tr><td><a href="#/sensor/${s.ID}">${esc(s.Name)}</a></td><td class="num">${fmt.n(s.ECMPeakPower)} W</td><td class="num">${s.ECMGain||'—'} dB</td><td class="num">${s.ECMNumberOfTargets||'—'}</td><td class="dim">${s.freqST.map(f=>E('SensorFrequency',f).charAt(0)).join(' ')}</td><td class="dim">${esc(s.Comments||'')}</td></tr>`).join('')}
  </tbody></table></div>${oecm.length>40?`<p class="note">Showing 40 of ${oecm.length}. Full list under Sensors → filter ECM / Jammer.</p>`:''}</div>`;

  // Tactics
  html += `<div class="card full"><h3>Employment notes</h3><div style="font-size:13.5px;line-height:1.6;columns:2;column-gap:28px;max-width:1100px">
  <p style="margin:0 0 8px;break-inside:avoid"><b>Jam and decoy at once.</b> A stand-in like MALD-J flies as an air contact, so it also soaks SAM shots. The battery either wastes rounds on decoys or holds fire under jamming — both help the strikers.</p>
  <p style="margin:0 0 8px;break-inside:avoid"><b>Open the window, don't close it.</b> OECM never kills the site and doesn't touch the endgame calc. Use it to suppress launches and break tracks, then finish with HARM/AARGM.</p>
  <p style="margin:0 0 8px;break-inside:avoid"><b>Mind the band gap.</b> A jammer that covers only D–J won't blind low-band VHF search — expect the package to be <i>seen</i>, just not cleanly <i>engaged</i>.</p>
  <p style="margin:0 0 8px;break-inside:avoid"><b>EMCON discipline.</b> Active OECM is a beacon for enemy ESM. Turn it on approaching the threat ring, not at the tanker.</p>
  <p style="margin:0 0 8px;break-inside:avoid"><b>Generation matters.</b> Old jammers do little against modern AESA/agile radars. Match jammer era to threat era, or bring more power (NGJ ALQ-249 is 10× the ALQ-99/MALD-J).</p>
  <p style="margin:0;break-inside:avoid"><b>DECM ≠ OECM.</b> Jamming the area does not make a DECM-carrying target easy to kill — that protection is a separate endgame roll.</p>
  </div></div>`;

  html += `<p class="note" style="max-width:1100px">Sourced from the CMO sensor tables and manual §9.2.6 / §9.3 (engagement failure reasons). The precise burn-through and jam-to-signal equations live inside the (obfuscated) game engine and are not reproduced here — the behavior is documented, the formula is not.</p>`;
  return html;
}
function ewDecmByGrade(decm){
  const g=new Map(); for (const s of decm){ const k=s.ECMPoKReduction||0; g.set(k,(g.get(k)||0)+1); }
  return [...g.entries()].filter(([k])=>k>0).sort((a,b)=>a[0]-b[0]).map(([k,n])=>({label:k+'% PoK cut',value:k,color:'var(--s7)',text:k+'% · '+n+' systems'}));
}
function ewMaldCase(w, jammer, esm){
  const st=[['Type',E('WeaponType',w.Type)],['Range',w.SurfaceRangeMax?fmt.n(w.SurfaceRangeMax)+' nm':null],['Warhead','none — pure EW / decoy'],['Jammer power',jammer?fmt.n(jammer.ECMPeakPower)+' W':null],['Emitters',jammer?jammer.ECMNumberOfTargets:null],['ESM range',esm?fmt.n(esm.RangeMax)+' nm':null]];

  <p style="margin:0">Its jammer parameters are <b>identical to the AN/ALQ-99</b> carried by the EA-6B Prowler / EA-18G Growler${jammer?` (same ${fmt.n(jammer.ECMPeakPower)} W)`:''}, and it services <b>more</b> emitters at once than most ALQ-99 variants — a Growler-class electronic attack in a disposable body you can fly <i>inside</i> the SAM ring instead of standing off. Use the compare tool to put it beside a Growler pod or the NGJ.</p></div>

<script>
/* ============================================================
   DETECTION MATCHUP — sensor vs. target signature calculator
   ============================================================ */
const ASPECTS = ['Front','Side','Rear','Top'];
const ASPECT_COLOR = ['var(--s2)','var(--s4)','var(--s8)','var(--s7)'];
/* radar band the sensor works in -> which target RCS signature to read (5001 A–D, 5002 E–M) */
function radarSigBand(s){
  const em = s.freqST.some(f=>f>=1005 && f<=1013);      // E band (2 GHz) and up
  const ad = s.freqST.some(f=>f>=1001 && f<=1004);      // A–D (<2 GHz)
  if (em) return 5002; if (ad) return 5001;
  return (s.FrequencyLower>2e9 || s.FrequencyUpper>2e9) ? 5002 : 5002;
}
/* radar detection range per aspect. ref = reference RCS in m². R = min(Rmax, Rmax·(σ/ref)^¼) */
function detectRadar(sensor, target, ref){
  const band = radarSigBand(sensor);
  let sig = target.sig[band] || target.sig[band===5002?5001:5002];
  if (!sig) return null;
  const rmax = sensor.RangeMax||0; if (!(rmax>0)) return null;
  return {band, vals: sig.map(db=> db==null?null : Math.min(rmax, rmax*Math.pow(Math.pow(10,db/10)/ref, 0.25))), sig, rmax};
}
/* IR / visual detection: target signature is already a range (nm) per aspect, scaled by sensor zoom, capped at RangeMax */
function detectOptical(sensor, target){
  const isIR = sensor.fam==='ir';
  const sigT = isIR?4001:3001, zoom = (isIR? sensor.IRDetectionZoomLevel : sensor.VisualDetectionZoomLevel)||1;
  const sig = target.sig[sigT]; if (!sig) return null;
  const cap = sensor.RangeMax||Infinity;
  return {vals: sig.map(v=> v==null?null : Math.min(cap, v*zoom)), sig, zoom, cap:sensor.RangeMax||0};
}
/* aspect bar chart */
function aspectBars(vals, max, unit='nm'){
  const n=vals.length, W=300, rowH=22, L=52, Rm=52;
  const o=[]; const mx=max||Math.max(...vals.filter(v=>v!=null),1e-9);
  vals.forEach((v,i)=>{ const y=i*rowH+3;
    o.push(`<text x="${L-8}" y="${y+rowH/2+4}" text-anchor="end" class="lbl" style="fill:var(--text-2)">${ASPECTS[i]}</text>`);
    o.push(`<rect x="${L}" y="${y+4}" width="${W-L-Rm}" height="${rowH-8}" fill="var(--surface-2)" rx="3"/>`);
    if (v!=null){ const w=(W-L-Rm)*Math.min(1,v/mx); o.push(`<rect x="${L}" y="${y+4}" width="${w.toFixed(1)}" height="${rowH-8}" fill="${ASPECT_COLOR[i]}" rx="3"${tipAttr(ASPECTS[i]+' aspect: '+fmt.n(v,1)+' '+unit)}/>`);
      o.push(`<text x="${L+w+5}" y="${y+rowH/2+4}" class="lbl" style="fill:var(--text-2)">${fmt.n(v,1)}</text>`); }
    else o.push(`<text x="${L+4}" y="${y+rowH/2+4}" class="lbl">n/a</text>`);
  });
  return SVG(W, n*rowH+6, o.join(''));
}
function observerSensors(u){
  const seen=new Set(), out=[];
  for (const o of sensorInstancesAll(u)) for (const [sid,s] of expandSensorGroup(o.s)){
    if (seen.has(sid)) continue; seen.add(sid);
    if (['radar','ir','visual'].includes(s.fam) && (s.RangeMax>0)) out.push(s);
  }
  // strongest first within family
  return out.sort((a,b)=> (['radar','ir','visual','esm'].indexOf(a.fam)-['radar','ir','visual','esm'].indexOf(b.fam)) || b.RangeMax-a.RangeMax);
}
function esmSensors(u){ const seen=new Set(),out=[]; for(const o of sensorInstancesAll(u)) for(const [sid,s] of expandSensorGroup(o.s)){ if(seen.has(sid))continue; seen.add(sid); if(s.fam==='esm'&&s.RangeMax>0) out.push(s);} return out; }

/* one direction: observer detecting target */
function detectDirection(obs, tgt, ref, slot){
  const sensors = observerSensors(obs);
  if (!sensors.length) return `<div class="card"><h3>${esc(obs.Name)} → ${esc(tgt.Name)}</h3><span class="small">No radar / IR / EO sensors on ${esc(obs.Name)}.</span></div>`;
  const cards=[]; let best={r:0,txt:''};
  for (const s of sensors){
    let res, note, isRadar=s.fam==='radar';
    if (isRadar){ res=detectRadar(s,tgt,ref); if(!res) continue; note=`vs ${E('SignatureType',res.band).replace('Radar, ','')} RCS · nominal range ${fmt.n(res.rmax)} nm · <span title="reference RCS, adjustable">calibrated</span>`; }
    else { res=detectOptical(s,tgt); if(!res) continue; note=`${s.fam==='ir'?'IR':'visual'} signature × zoom ×${res.zoom}${res.cap?` · cap ${fmt.n(res.cap)} nm`:''}${s.fam==='visual'?' · daylight/clear':''}`; }
    const vals=res.vals; const mx=Math.max(...vals.filter(v=>v!=null),1e-9);
    for (let i=0;i<vals.length;i++) if(vals[i]>best.r) best={r:vals[i], txt:`${fmt.n(vals[i],1)} nm — ${s.Name} (${ASPECTS[i].toLowerCase()} aspect)`};
    cards.push(`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><a href="#/sensor/${s.ID}" style="font-weight:600;font-size:13px"><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${FAMILY[s.fam].color};margin-right:5px"></span>${esc(s.Name)}</a><span class="small">${esc(E('SensorType',s.Type))}</span></div><div class="note" style="margin:1px 0 3px">${note}</div>${aspectBars(vals, mx)}</div>`);
  }
  const esm=esmSensors(obs);
  const esmNote = esm.length? `<div class="note" style="margin-top:6px">Passive: <b>${esc(esm[0].Name)}</b> (${fmt.n(esm[0].RangeMax)} nm) will detect ${esc(tgt.Name)} at long range <i>whenever its radar radiates</i> — independent of RCS. This is why stealth aircraft manage emissions.</div>`:'';
  return `<div class="card"><h3><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${slot};margin-right:6px"></span>${esc(obs.Name)} detects ${esc(tgt.Name)}<span class="hint">best: ${esc(best.txt||'—')}</span></h3>${cards.join('')}${esmNote}</div>`;
}

let DET_MAP=null;
function buildDetMap(){
  if (DET_MAP) return DET_MAP;
  DET_MAP=new Map();
  for (const k of KINDS) for (const [id,u] of D.platforms[k.key]){ if(!state.showDep && u.Deprecated) continue; DET_MAP.set(`${u.Name} (${k.route} #${id})`, {kind:k.key,route:k.route,id}); }
  return DET_MAP;
}
function detDatalist(){
  const m=buildDetMap();
  return `<datalist id="detlist">${[...m.keys()].sort().map(l=>`<option value="${esc(l)}">`).join('')}</datalist>`;
}
function detPick(which){
  const inp=document.getElementById('det_'+which); if(!inp) return;
  const hit=buildDetMap().get(inp.value.trim());
  if (hit) setParam(which, hit.route+':'+hit.id);
}
function viewDetect(params){
  const parse=v=>{ if(!v) return null; const [r,id]=v.split(':'); const k=KIND_BY_ROUTE[r]; return k&&getUnit(k.key,+id); };
  // defaults: F-35A vs J-20B if present
  const newest=re=>[...D.platforms.Aircraft.values()].filter(u=>re.test(u.Name)&&!u.Deprecated).sort((x,y)=>(y.YearCommissioned||0)-(x.YearCommissioned||0))[0];
  let a=parse(params.a), b=parse(params.b);
  if (!a) a=newest(/F-35A/i)||[...D.platforms.Aircraft.values()][0];
  if (!b) b=newest(/J-20B/i)||[...D.platforms.Aircraft.values()][1];
  const ref = params.ref? Math.pow(10,(+params.ref)/10) : 1.0;   // reference RCS in m² (param is dBsm)
  const refDb = params.ref? +params.ref : 0;
  const routeOf=u=>KIND_BY_KEY[u.kind].route;
  const lbl=u=>`${u.Name} (${routeOf(u)} #${u.ID})`;
  // optional external-stores RCS: replace each side's radar signature with clean + external loadout
  const aAdj=applyLoadoutRCS(a, params.la), bAdj=applyLoadoutRCS(b, params.lb);
  let html=`<div class="crumbs"><a href="#/">Overview</a> › Systems › Detection matchup</div>
  <h2 class="title">Detection matchup</h2>
  <div class="meta">At what range does one platform detect another, per sensor and aspect. Type any platform name (aircraft, ship, facility, sub, ground unit).</div>
  ${detDatalist()}
  <div class="toolbar">
    <label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small">Platform A (observer ↔ target)</span><input id="det_a" list="detlist" value="${esc(lbl(a))}" style="min-width:280px;padding:7px 10px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)" onchange="detPick('a')"></label>
    <label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small">Platform B</span><input id="det_b" list="detlist" value="${esc(lbl(b))}" style="min-width:280px;padding:7px 10px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)" onchange="detPick('b')"></label>
    <label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small" title="The target size each radar's rated range is assumed to hit. A calibration knob — it shifts absolute detection ranges but never the ratio between the two sides.">Radar rated against ⓘ</span><select onchange="setParam('ref',this.value)" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)">${[['0.01 m²',-20],['0.1 m²',-10],['1 m² · default',0],['3.2 m²',5],['5 m²',7]].map(([l,v])=>`<option value="${v}"${refDb===v?' selected':''}>${l}</option>`).join('')}</select></label>
  </div>
  <div class="toolbar" style="margin-top:-4px">${loadoutRcsSelect(a,'la',params.la)}${loadoutRcsSelect(b,'lb',params.lb)}</div>`;
  html += `<div class="grid c2">${detectDirection(aAdj,bAdj,ref,'var(--s1)')}${detectDirection(bAdj,aAdj,ref,'var(--s2)')}</div>`;
  // headline ratio (radar, front) if both have radar + RCS
  html += detMethodCard(aAdj,bAdj,ref,refDb);
  return html;
}
/* external-stores RCS: combine clean aircraft RCS with the non-internal weapons of a loadout (linear power sum) */
function loadoutExternalWeapons(l){ return l? l.weapons.filter(w=>!w[2]).map(w=>{ const rec=D.weaponRecord[w[0]]; return rec&&D.weapon.get(rec[0]); }).filter(Boolean) : []; }
function applyLoadoutRCS(u, loId){
  if(!loId) return u; if(!(u.loadouts&&u.loadouts.includes(+loId))) return u; const l=D.loadout.get(+loId); if(!l) return u;
  const ext=loadoutExternalWeapons(l); if(!ext.length) return u;
  const sig=Object.assign({}, u.sig);
  for(const band of [5001,5002]){ const base=u.sig[band]; if(!base) continue;
    sig[band]=base.map((db,ai)=>{ if(db==null) return db; let lin=Math.pow(10,db/10);
      for(const w of ext){ const ws=w.sig&&w.sig[band]; if(!ws) continue; const wv= ai<3? ws[ai] : ws[1]; /* top≈side */ if(wv!=null&&wv>-999) lin+=Math.pow(10,wv/10); }
      return 10*Math.log10(lin); });
  }
  return Object.assign({}, u, {sig, _lo:l.Name});
}
function loadoutRcsSelect(u, param, cur){
  if(u.kind!=='Aircraft'||!u.loadouts||!u.loadouts.length) return '';
  const los=u.loadouts.map(id=>D.loadout.get(id)).filter(l=>l&&loadoutExternalWeapons(l).length).sort((a,b)=>a.Name.localeCompare(b.Name));
  if(!los.length) return '';
  return `<label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small">${esc(u.Name)} loadout (adds external-store RCS)</span><select onchange="setParam('${param}',this.value)" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);max-width:320px"><option value="">clean (internal only)</option>${los.map(l=>`<option value="${l.ID}"${String(cur||'')===String(l.ID)?' selected':''}>${esc(l.Name)}</option>`).join('')}</select></label>`;
}
function detMethodCard(a,b,ref,refDb){
  // reference-independent radar ratio, front aspect, using each side's best air-search/FC radar
  const bestRadar=u=>observerSensors(u).find(s=>s.fam==='radar');
  const ra=bestRadar(a), rb=bestRadar(b);
  let ratioLine='';
  if (ra&&rb){ const da=detectRadar(ra,b,ref), db=detectRadar(rb,a,ref);
    if (da&&db&&da.vals[0]&&db.vals[0]){ const r=da.vals[0]/db.vals[0];
      ratioLine=`<p style="margin:0 0 8px"><b>Head-on radar ratio ${fmt.n(r,2)}×</b> — ${esc(a.Name)} detects ${esc(b.Name)} ${r>=1?fmt.n(r,2)+'× farther':fmt.n(1/r,2)+'× closer'} than the reverse (front aspect, both radars). <b>This ratio is reference-independent</b> and holds whatever the RCS calibration; only the absolute nm above shift with the reference.</p>`; }
  }
  return `<div class="card full"><h3>Method &amp; confidence</h3>${ratioLine}
  <div style="font-size:13px;line-height:1.6;max-width:1100px">
  <p style="margin:0 0 6px"><b>Radar</b> [calibrated] — the target's RCS (dBsm, from its signature, in the band the radar works in) scales the radar's nominal range by the radar equation: <span class="v" style="font-family:var(--mono)">R = R<sub>max</sub> · (σ / σ<sub>ref</sub>)<sup>¼</sup></span>, capped at R<sub>max</sub>. The fourth-root law is physics; the <b>reference RCS σ<sub>ref</sub></b> that anchors R<sub>max</sub> is not exposed by the engine, so the absolute ranges are a calibration (default 1 m²) — change it above. Ratios between two targets are exact regardless.</p>
  <p style="margin:0 0 6px"><b>IR &amp; EO (IRST / EOTS / DAS)</b> [extracted + calibrated] — the target's IR/visual signature is stored <i>directly as a detection range in nm</i> per aspect (rear aspect is largest — hot exhaust). The observer's sensor scales it by its zoom level and caps at its own max range. The raw signature is extracted; the zoom scaling is the sim's, approximated here.</p>
  <p style="margin:0 0 6px"><b>Passive ESM</b> — asymmetric: a radar-warning/ELINT receiver detects the target only when the target's radar <i>emits</i>, but then from much farther than the radar sees back. Not RCS-dependent; shown as a note.</p>
  <p style="margin:0"><b>Not modeled here:</b> jamming, terrain/horizon masking, notching, weather, altitude effects, and the engine's exact detailed-radar equation (peak power, noise, processing gain feed a fuller calc inside <span class="v" style="font-family:var(--mono)">Command.exe</span>). Treat these as clean-air nominal envelopes for planning, not guaranteed in-game numbers.</p>
  </div></div>`;
}
</script>
<script>
/* ============================================================
   ANALYSIS — trend/scatter explorer, leaderboards, timeline

const PAL=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const rcsEM = u => { const v=u.sig&&u.sig[5002]&&u.sig[5002][0]; return (v!=null&&v!==0&&v>-100)? v : null; };   // drop -10000 sentinels

const genYear = g => { const d=E('WeaponGeneration',g)||E('SensorGeneration',g)||''; const mm=/((?:19|20)\d0)s/.exec(d); if(mm) return +mm[1]; if(/Early 1950/.test(d))return 1950; return null; };

    colors:[{key:'type',label:'Type',get:u=>E('SubmarineType',u.Type)},{key:'op',label:'Operator',get:u=>E('OperatorCountry',u.OperatorCountry)}]},

  let colorOf=()=>'var(--s1)', legend='';
  if(cd){ const cnt=new Map(); for(const r of rows){ const g=cd.get(r)||'—'; cnt.set(g,(cnt.get(g)||0)+1); } const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]); const cmap=new Map(top.map((g,i)=>[g,PAL[i]])); colorOf=r=>cmap.get(cd.get(r)||'—')||'var(--text-3)'; legend=`<div class="legend">${top.map((g,i)=>`<span><span class="sw" style="background:${PAL[i]}"></span>${esc(g)}</span>`).join('')}${cnt.size>8?'<span><span class="sw" style="background:var(--text-3)"></span>Other</span>':''}</div>`; }
  const pts=rows.map(r=>({x:xm.get(r),y:ym.get(r),label:r.Name,color:colorOf(r),href:ds.href(r)}));
  const opt=(sel,cur)=>sel.map(o=>`<option value="${o.key}"${o.key===cur?' selected':''}>${esc(o.label)}</option>`).join('');
  const dsSel=Object.entries(EXPLORE).map(([k,d])=>`<option value="${k}"${k===dsKey?' selected':''}>${esc(d.label)}</option>`).join('');
  return `<div class="crumbs"><a href="#/">Overview</a> › Analysis › Trend explorer</div>
  <h2 class="title">Trend explorer</h2><div class="meta">Plot any metric against any other across the whole database — click a point to open it. Every value is extracted from the DB; missing values are dropped.</div>
  <div class="toolbar">
    <label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small">Dataset</span><select onchange="setParam('ds',this.value)" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)">${dsSel}</select></label>
    <label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small">X axis</span><select onchange="setParam('x',this.value)" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)">${opt(ds.metrics,xm.key)}</select></label>
    <label class="chk"><input type="checkbox" ${xlog?'checked':''} onchange="setParam('xl',this.checked?'1':'0')"> log X</label>
    <label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small">Y axis</span><select onchange="setParam('y',this.value)" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)">${opt(ds.metrics,ym.key)}</select></label>
    <label class="chk"><input type="checkbox" ${ylog?'checked':''} onchange="setParam('yl',this.checked?'1':'0')"> log Y</label>
    <label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small">Colour by</span><select onchange="setParam('c',this.value)" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)"><option value="">none</option>${(ds.colors||[]).map(c=>`<option value="${c.key}"${cd&&cd.key===c.key?' selected':''}>${esc(c.label)}</option>`).join('')}</select></label>
  </div>
  <div class="card">${legend}${scatterChart(pts,{width:840,height:460,xlabel:xm.label,ylabel:ym.label,xlog,ylog,xfmt:xm.fmt,yfmt:ym.fmt})}</div>`;
}

/* ---------- leaderboards + timeline ---------- */
function board(title, hint, rows, getV, better, textFn){
  const scored=rows.map(r=>({r,v:getV(r)})).filter(o=>o.v!=null&&isFinite(o.v));
  scored.sort((a,b)=>better==='low'? a.v-b.v : b.v-a.v);
  const top=scored.slice(0,10);
  if(!top.length) return '';
  const vals=top.map(o=>o.v); const best= better==='low'? Math.min(...vals) : Math.max(...vals);
  // bar length proportional to the actual value (equal values → equal bars); best value = full bar
  const frac=v=>{ if(best===0) return v===0?1:0; let f = (better==='high') ? v/best : (best<0 ? v/best : best/v); return Math.max(0, Math.min(1, f)); };
  const items=top.map(o=>({label:o.r.Name, value:frac(o.v), color:o.v===best?'var(--s2)':'var(--s1)', text:textFn(o.v,o.r), tip:o.r.Name+': '+textFn(o.v,o.r)}));
  return `<div class="card"><h3>${title}<span class="hint">${hint}</span></h3>${hbars(items,{width:440,labelW:200,rowH:19,textW:110,max:1})}</div>`;
}
function viewTops(params){
  const AC=[...D.platforms.Aircraft.values()].filter(u=>!u.Deprecated&&!u.Hypothetical);
  const SH=[...D.platforms.Ship.values()].filter(u=>!u.Deprecated&&!u.Hypothetical);
  const SU=[...D.platforms.Submarine.values()].filter(u=>!u.Deprecated&&!u.Hypothetical&&REAL_SUB(u));
  const showNuke = params.nk==='1';
  // nuclear if: a direct nuclear warhead (type 4001), a warhead named nuclear, the weapon name says nuclear,
  // or a MIRV/RV bus whose sub-munition weapon (warhead type 5002 → DP = weapon ID) is nuclear
  const isNuke=(w,depth)=>{ if(!w) return false; if(/\bnuclear\b/i.test(w.Name||'')) return true;
    for(const id of (w.warheads||[])){ const h=D.warhead.get(id); if(!h) continue;
      if(h.Type===4001 || /nuclear/i.test(h.Name||'')) return true;
      if(h.Type===5002 && (depth||0)<3 && isNuke(D.weapon.get(h.DamagePoints),(depth||0)+1)) return true; }
    return false; };
  const WP=[...D.weapon.values()].filter(w=>!w.Deprecated&&!w.Hypothetical&&(showNuke||!isNuke(w)));
  const SE=[...D.sensor.values()].filter(s=>!s.Deprecated&&!s.Hypothetical);
  const nm=v=>fmt.n(v,1)+' nm', kt=v=>fmt.n(v)+' kt', dbsm=v=>fmt.n(v,1)+' dBsm', dp=v=>fmt.n(v,0)+' DP';
  let html=`<div class="crumbs"><a href="#/">Overview</a> › Analysis › Leaderboards</div><h2 class="title">Leaderboards &amp; extremes</h2><div class="meta">Top 10 by category across ${esc(D.meta.name)} (current, non-deprecated). Bar length is proportional to the value — tied entries show equal bars; the leader is highlighted.</div>
  <div class="toolbar"><label class="chk"><input type="checkbox" ${showNuke?'checked':''} onchange="setParam('nk',this.checked?'1':'')"> include nuclear-warhead weapons</label></div>`;
  // timeline
  const decs=[]; for(let y=1940;y<=2030;y+=10) decs.push(y);
  const kindsForTL=[{k:'Aircraft',c:'var(--s1)'},{k:'Ship',c:'var(--s2)'},{k:'Submarine',c:'var(--s3)'},{k:'Facility',c:'var(--s4)'},{k:'GroundUnit',c:'var(--s7)'}];
  const series=kindsForTL.map(({k,c})=>({label:KIND_BY_KEY[k].label,color:c,vals:decs.map(d=>{ let n=0; for(const [,u] of D.platforms[k]) if(!u.Deprecated && u.YearCommissioned>=d && u.YearCommissioned<d+10) n++; return n; })}));
  html+=`<div class="card"><h3>Entering service, by decade<span class="hint">count of current entries commissioned in each decade</span></h3><div class="legend">${kindsForTL.map(({k,c})=>`<span><span class="sw" style="background:${c}"></span>${KIND_BY_KEY[k].label}</span>`).join('')}</div>${vbars(decs.map(d=>d+"s"),series,{width:840,height:250})}</div>`;
  html+='<div class="grid c2">';
  html+=board('Fastest aircraft','max speed',AC,unitMaxSpeed,'high',kt);
  html+=board('Highest climb rate','m/s',AC,u=>u.ClimbRate||null,'high',v=>fmt.n(v)+' m/s');
  html+=board('Stealthiest aircraft','lowest front RCS (E–M)',AC,u=>rcsEM(u),'low',dbsm);
  html+=board('Longest-range air-to-air / SAM','max air-target range',WP.filter(w=>w.fam==='aam'),w=>w.AirRangeMax||null,'high',nm);
  html+=board('Longest-range anti-ship','max surface range',WP.filter(w=>w.SurfaceRangeMax>0&&(w.fam==='asm')),w=>w.SurfaceRangeMax||null,'high',nm);
  html+=board('Longest-range land attack','max land range',WP.filter(w=>w.LandRangeMax>0),w=>w.LandRangeMax||null,'high',nm);
  html+=board('Biggest warhead','total warhead damage points',WP,w=>warheadDP(w)||null,'high',dp);
  html+=board('Longest-range torpedo','cruise-speed run',WP.filter(w=>w.fam==='torpedo'),w=>w.TorpedoRangeCruise||null,'high',nm);
  html+=board('Longest-range air-search radar','max range, air-search',SE.filter(s=>s.fam==='radar'&&s.caps.includes(1001)),s=>s.RangeMax||null,'high',nm);
  html+=board('Fastest ships','max speed',SH,unitMaxSpeed,'high',kt);
  html+=board('Deepest-diving submarines','max depth below sea level',SU,u=>u.MaxDepth||null,'low',v=>fmt.n(Math.abs(v))+' m');
  html+=board('Quietest submarines','lowest passive sonar LF',SU,u=>sonarLF(u),'low',v=>fmt.n(v,1)+' dB');
  html+='</div>';
  return html;
}
