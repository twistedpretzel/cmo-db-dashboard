  ['SPECIAL_MSG',       /^\s*(?:<|@import\b|\{|\}|(?:font|background|color|margin|padding|border|display|text|line|width|height|max|min|flex|grid|position|top|left|right|bottom|letter|box|opacity|z-index)[\w-]*\s*:\s*\S)/],
];

/* which classes belong to which tier — drives the overview grouping */
const AAR_TIER = {
  ENG_MISSILE:1, ENG_GUN:1, FIRE_POH:1, FIRE_CEP:1, SOFTKILL:1, TERM:1, TERM_NOSENSOR:1, IMPACT:1, PENETRATION:1, NEARMISS:1,
  DMG_DP:2, DMG_COMP_DEGRADE:2, DMG_COMPONENT:2, DMG_STATE:2, SINKING:2, DESTROYED:2, CEP_UPDATE:2,
  SEEKER_DETECT:2, LOCKON:2, DOCTRINE:2, BDA_REPORT:2, COMMS:2, POSTURE:2, SIDE_SWITCH:2, GROUP_DISSOLVE:2,
  AIRFIELD_SPOT_NEW:2, AIRFIELD_SPOT_ID:2, GODSEYE:2, CONTACT_MANUAL:2, CONTACT_ATTRIB:2,
  FUEL_LOSS:2, ABANDONED:2, CREW_INCAP:2, COMPONENT_HIT:2, FIRE_OUT:2, FIRE_WARN:2, REPAIR:2,
  CONTROLS_LOST:2, CABIN_HIT:2, REPAIR_DONE:2, REPAIRING:2,
  CONTACT_PROBABLE:2, HOSTED:2,
  CONTACT_NEW:2, CONTACT_ID:2, CONTACT_RENAME:2, CONTACT_HOSTILE:2, CONTACT_UPDATE:2, CONTACT_LOST:2, CONTACT_LOST_PRIV:2,
  EVENT:3, WPN_LOGIC:3, WPN_NOUPDATE:3, WPN_NOREFLECT:3, PATHEVAL:3, SPECIAL_MSG:3, FLIGHT_ASSEMBLED:3,
};
const AAR_TIER_LABEL = {1:'Scored events', 2:'Effects & context', 3:'Noise'};

/* The unit a terminal record acted on. "Has impacted X, No other units affected" /
   "Missed X by 39ft, The explosion affected X" / "Has impacted X." — X is what we want. */
function aarTermTarget(detail){
  const d = String(detail||'');
  // Unit names contain their own commas - "Bridge (Two-Lane, 60 Tons)" - so stopping at the
  // first comma splits one unit into two. Stop only at a comma that begins a known trailing
  // clause, or at the end of the record.
  const TAIL = ', (?:No other units|No units|The explosion|Has detonated|Has malfunctioned|Will )';
  let m = new RegExp('^Has impacted (.+?)(?:' + TAIL + '|\\.?\\s*$)').exec(d);
  if (m) return m[1].trim().replace(/[.,]+$/,'');
  m = /^Missed (.+?) by [\d.]+\s*(?:ft|m|nm)/.exec(d);
  if (m) return m[1].trim().replace(/[.,]+$/,'');
  m = new RegExp('^The explosion(?: also)? affected (.+?)(?:' + TAIL + '|\\.?\\s*$)').exec(d);
  if (m) return m[1].trim().replace(/[.,]+$/,'');
  return null;
}

/* terminal miss/hit mode classification (LOG_GRAMMAR F5) */
function aarTermMode(res, detail){
  const d = detail || '';
  if (res === 'HIT') return /Missed .+ by /i.test(d) ? 'near-miss detonation' : 'impact';
  if (/run out of energy/i.test(d))       return 'out of energy';
  if (/seekers were spoofed/i.test(d))    return 'seduced / spoofed';
  if (/malfunction/i.test(d))             return 'malfunction';
  if (/Impact(?:ed|s)? surface/i.test(d)) return 'impacted surface';
  if (/no functioning sensors/i.test(d))  return 'lost terminal homing';
  if (/cannot have its target illuminated/i.test(d)) return 'no illumination';
  if (/Has detonated/i.test(d))           return 'detonated off target';
  if (/^Missed .+ by /i.test(d))          return 'near-miss, no effect';
  if (/^No units affected by explosion/i.test(d)) return 'no effect';
  return 'other';
}

/* Split raw text into records using the detected format. A line without a timestamp
   continues the previous record. Returns [{t, ts, body}] plus the format that was used. */
function aarSplitRecords(text){
  const lines = String(text).split('\n');
  const det = aarDetectFormat(lines);
  const recs = [];
  if (!det.fmt) return Object.assign(recs, {format:null, ambiguous:false});
  let cur = null;
  for (const line of lines){
    const m = det.fmt.re.exec(line);
    if (m){
      const v = det.fmt.build(m);
      if (v){ if (cur) recs.push(cur); cur = {t:v.t, ts:line.slice(0, line.indexOf(' - ')), body:v.rest}; continue; }
    }
    if (cur) cur.body += '\n' + line;
  }
  if (cur) recs.push(cur);
  recs.format = det.fmt; recs.ambiguous = det.ambiguous;
  return recs;
}

/* ---------- side mirroring ----------
   A record visible to several sides is written once per side: same timestamp, same body,
   different [Side] prefix. Those are ONE event. But a side can also legitimately log the
   same body twice in the same second ("100% penetration achieved"), and those are separate
   events — collapsing them destroys real data. So the number of real events is the largest
   count any SINGLE side reports, and the surviving records are that side's. */
function aarDedupeSides(recs){
  const groups = new Map();
  for (const r of recs){
    const sm = AAR_SIDE.exec(r.body);
    r.side = sm ? sm[1].trim() : null;
    r.core = (sm ? sm[2] : r.body).trim();
    const k = r.t + '\u0000' + r.core;
    let g = groups.get(k); if (!g){ g = new Map(); groups.set(k, g); }
    const sk = r.side == null ? '\u0001none' : r.side;
    g.set(sk, (g.get(sk)||0) + 1);
  }
  const keep = new Map();      // key -> {side, n}
  for (const [k,g] of groups){
    let bs=null, bn=0;
    for (const [sk,n] of g) if (n>bn){ bn=n; bs=sk; }
    keep.set(k, {side:bs, n:bn});
  }
  const out = []; const used = new Map(); let dropped = 0;
  for (const r of recs){
    const k = r.t + '\u0000' + r.core;
    const kp = keep.get(k);
    const sk = r.side == null ? '\u0001none' : r.side;
    const u = used.get(k) || 0;
    if (sk === kp.side && u < kp.n){ used.set(k, u+1); out.push(r); }
    else dropped++;
  }
  out.mirrored = dropped;
  return out;
}

function aarNumList(mods, re){ const m = re.exec(mods||''); return m ? m.slice(1).map(Number) : null; }

/* pull the typed modifier chain out of an engagement's free-text middle */
function aarMods(mods){
  const out = [];
  const push = (name, v, raw) => out.push({name, v, raw});
  let m;
  if ((m = /Target speed modifier: (-?[\d.]+)%/.exec(mods)))            push('Target speed', +m[1], m[0]);
  if ((m = /PH adjusted for weapon speed: ([\d.]+)%/.exec(mods)))       push('Weapon speed', +m[1], m[0]);
  if ((m = /Base-Ph adjusted for distance: ([\d.]+)%/.exec(mods)))      push('Distance', +m[1], m[0]);
  if ((m = /Target signature modifier: (-?[\d.]+)%/.exec(mods)))        push('Target signature', +m[1], m[0]);
  if ((m = /Sea-skimmer modifier: (-?[\d.]+)%/.exec(mods)))             push('Sea-skimmer', +m[1], m[0]);
  if ((m = /Proximity fuze \(.+?\) - Ph increased by ([\d.]+)x/.exec(mods))) push('Proximity fuze', +m[1], m[0]);
  if ((m = /PH reduced by (-?[\d.]+)%/.exec(mods)))                     push('Kinematic penalty', -Math.abs(+m[1]), m[0]);
  if ((m = /Final agility modifier: (-?[\d.]+)%/.exec(mods)))           push('Agility', +m[1], m[0]);
  if (/random terminal manouver|zig-zag terminal manouver/.test(mods))  push('Terminal manoeuvre', null, (/Target is missile with [^.]+\./.exec(mods)||[''])[0]);
  if ((m = /Target is at Mach ([\d.]+)/.exec(mods)))                    push('Target Mach', +m[1], m[0]);
  return out;
}

/* CEP chain terms. Polarity is the opposite of PH: a SMALLER CEP is better. */
const AAR_SALVO = {slightly:1, measurably:2, substantially:3, tremendously:4};
function aarCepMods(mods){
  const out=[]; let m;
  if ((m=/Director \((?<d>.+?)\) is (?<how>[^;]+); accuracy (?:decreased by (?<pct>[\d.]+)%|unaffected)/.exec(mods)))
    out.push({name:'Director', v:m.groups.pct?-Math.abs(+m.groups.pct):0, detail:m.groups.d, raw:m[0]});
  if ((m=/(?<lad>A few|Some|Quite a few|Lots)(?: of| \(less than \d+\))? rounds already fired in salvo; accuracy improving (?<adv>\w+)/.exec(mods)))
    out.push({name:'Salvo warming', v:AAR_SALVO[m.groups.adv]||null, detail:m.groups.adv, raw:m[0]});
  if ((m=/Sea state (?<ss>[\d-]+)[^.]*?accuracy (?:decreased by (?<pct2>[\d.]+)%|unaffected)/.exec(mods)))
    out.push({name:'Sea state', v:m.groups.pct2?-Math.abs(+m.groups.pct2):0, detail:m.groups.ss, raw:m[0]});
  return out;
}

function parseAAR(text, name){
  const raw = aarSplitRecords(text);
  if (!raw.length || !raw.format) throw new Error(
    'No timestamped records found. CMO writes the log in your machine\'s regional date format; '
    + 'this file uses one the reader does not recognise yet. Recognised: '
    + AAR_TS_FORMATS.map(f=>f.label).join(' · ') + '.');
  const recs = aarDedupeSides(raw);

  const out = {
    format: AAR_FMT, name: name || '(pasted log)',
    classes: {}, sides: {}, engagements: [], unguided: [], softkill: [],
    terminal: [], damage: [], denied: [], isr: [], unmatched: [], godseye: [],
    times: [],                                  // every record's timestamp — drives the activity chart
    records: recs.length, blank: 0, span: {start:null, end:null},
    tsFormat: raw.format.label, tsAmbiguous: !!raw.ambiguous,
    rawRecords: raw.length, mirrored: recs.mirrored || 0,
  };
  const bump = k => out.classes[k] = (out.classes[k]||0) + 1;

  for (const rec of recs){
    const t = rec.t, ts = rec.ts, side = rec.side, body = rec.core;
    if (t != null){
      out.times.push(t);
      if (out.span.start==null||t<out.span.start) out.span.start=t;
      if (out.span.end==null||t>out.span.end) out.span.end=t;
    }
    if (side) out.sides[side] = (out.sides[side]||0) + 1;
    if (!body){ out.blank++; continue; }

    let hit = null, g = null;
    for (const [nm, re] of AAR_PATTERNS){
      const mm = re.exec(body);
      if (mm){ hit = nm; g = mm.groups || {}; break; }
    }
    if (!hit){
      if (out.unmatched.length < 500) out.unmatched.push({t, ts, side, body: body.split('\n')[0].slice(0,200)});
      bump('UNMATCHED'); continue;
    }
    bump(hit);

    if (hit === 'ENG_MISSILE' || hit === 'ENG_GUN'){
      const kin  = aarNumList(g.mods, /Intercept angle (\d+) deg, tgt (\d+) kts, intc (\d+) kts/);
      const los  = aarNumList(g.mods, /LOS rate ([\d.]+) deg\/s/);
      const fin  = +g.fph;
      out.engagements.push({
        t, ts, kind: hit==='ENG_GUN' ? 'gun' : 'missile',
        weapon: (g.gun || g.w || '').trim(), serial: g.sn ? +g.sn : null,
        target: (g.tgt||'').replace(/ #\d+$/,'').trim(), targetSerial: (/#(\d+)$/.exec(g.tgt||'')||[])[1] || null,
        base: +g.bph, final: fin, roll: +g.roll, result: g.r2,
        floored: fin <= AAR_FLOOR,          // F8: the engine gave up, it did not compute 5%
        note: (g.tail||'').replace(/^[,.\s]+|[.\s]+$/g,'') || null,   // e.g. "Hit-To-Kill warhead: Target destroyed outright" 
        angle: kin?kin[0]:null, tgtKts: kin?kin[1]:null, intcKts: kin?kin[2]:null,
        los: los?los[0]:null, mods: aarMods(g.mods||''),
      });
    } else if (hit === 'FIRE_POH'){
      // probability-of-hit fire (air/point-defence): HIGHER is better, units are %
      out.unguided.push({t, ts, side, metric:'PoH', unit:'%',
        platform:(g.plat||'').trim(), weapon:(g.w||'').trim(),
        nominal:+g.nom, final:+g.fin, mods: aarMods(g.mods||''), raw:(g.mods||'').trim()});
    } else if (hit === 'FIRE_CEP'){
      // circular-error-probable fire (surface/land direct fire): LOWER is better, units are length
      out.unguided.push({t, ts, side, metric:'CEP', unit:g.u||'m',
        platform:(g.plat||'').trim(), weapon:(g.w||'').trim(),
        nominal:+g.nom, final:+g.fin, mods: aarCepMods(g.mods||''), raw:(g.mods||'').trim()});
    } else if (hit === 'IMPACT'){
      // a round that impacted without an endgame record — a terminal outcome all the same
      out.terminal.push({t, ts, side, weapon:(g.w||'').trim(), serial:null,
        result:'HIT', detail:'Has impacted '+(g.tgt||'').trim(), mode:'impact',
        target:(g.tgt||'').trim().replace(/[.,]$/,''), unscored:true});
    } else if (hit === 'GODSEYE'){
      out.godseye.push({t, ts, side, state:g.state});
    } else if (hit === 'SOFTKILL'){
      out.softkill.push({t, ts, side, kind:g.kind, system:(g.sys||'').trim(), tech:g.tech,
        platform:(g.plat||'').trim(), verb:g.verb, sensor:(g.sensor||'').trim(), sensorTech:g.stech,
        weapon:(g.wpn||'').replace(/ #\d+$/,'').trim(), prob:+g.p, roll:+g.roll, result:g.r});
    } else if (hit === 'TERM' || hit === 'TERM_NOSENSOR'){
      const detail = hit==='TERM_NOSENSOR' ? 'Has no functioning sensors for terminal homing' : (g.detail||'').trim();
      out.terminal.push({t, ts, side, weapon:(g.w||'').trim(), serial:g.sn?+g.sn:null,
        result:g.res, detail, mode: aarTermMode(g.res, detail), target: aarTermTarget(detail)});
    } else if (hit === 'DMG_DP'){
      out.damage.push({t, ts, side, unit:(g.unit||'').trim(), kind:'dp', dtype:g.type, dp:+g.dp});
    } else if (hit === 'DMG_COMPONENT' || hit === 'DMG_COMP_DEGRADE'){
      out.damage.push({t, ts, side, unit:(g.unit||'').trim(), kind: hit==='DMG_COMPONENT'?'component-destroyed':'component-damaged', component:(g.comp||'').trim()});
    } else if (hit === 'FUEL_LOSS' || hit === 'ABANDONED'){
      out.damage.push({t, ts, side, unit:(g.unit||'').trim(),
        kind:'lost', cause: hit==='FUEL_LOSS' ? 'out of fuel' : 'engines lost / abandoned'});
    } else if (hit === 'DESTROYED' || hit === 'SINKING' || hit === 'DMG_STATE'){
      out.damage.push({t, ts, side, unit:(g.unit||'').trim(),
        kind: hit==='DESTROYED' ? 'destroyed' : hit==='SINKING' ? 'sinking' : 'state', state:g.state||null});
    } else if (hit === 'DOCTRINE'){
      out.denied.push({t, ts, side, unit:(g.u||'').trim(), target:(g.tgt||'').trim(),
        weapon:(g.w||'').trim(), reason:(g.reason||'').trim()||null});
    } else if (hit === 'AIRFIELD_SPOT_NEW' || hit === 'AIRFIELD_SPOT_ID'){
      out.isr.push({t, ts, side, loc:(g.loc||'').trim(), cap:g.cap,
        cls: g.cls ? g.cls.trim() : null, by:(g.by||'').trim(), sensor:(g.sensor||'').trim()});
    }
  }
  out.coverage = out.records ? (out.records - (out.classes.UNMATCHED||0)) / out.records : 1;
  return out;
}

/* ---------- store: one log at a time, replace on ingest ---------- */
function ingestAAR(text, source, name){
  let a;
  if (/"format"\s*:\s*"cmo-aar\//.test(text)){        // re-import of our own export
    a = JSON.parse(text);
    if (a.format !== AAR_FMT) throw new Error('That export is format "'+a.format+'"; this dashboard reads '+AAR_FMT+'.');
  } else {
    a = parseAAR(text, name);
  }
  a.source = source || 'paste'; a.ingested = new Date().toISOString();
  D.aar = a;
  try { localStorage.setItem(AAR_KEY, JSON.stringify(a)); }
  catch(e){ a.notPersisted = true; }                   // quota/private mode: memory only
  location.hash = '#/aar'; render();
}
function clearAAR(){ D.aar = null; try { localStorage.removeItem(AAR_KEY); } catch(e){} location.hash='#/aar'; render(); }
function loadAARFromStore(){ try { const s = localStorage.getItem(AAR_KEY); if (s) D.aar = JSON.parse(s); } catch(e){ D.aar = null; } }
function aarIngestFromBox(){
  const t = (document.getElementById('aarpaste')||{}).value || '';
  try { ingestAAR(t, 'paste'); }
  catch(e){ const el=document.getElementById('aarerr'); if(el){ el.textContent=e.message; el.hidden=false; } }
}
function aarIngestFromFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { ingestAAR(String(r.result), 'file', f.name); }
    catch(e){ const el=document.getElementById('aarerr'); if(el){ el.textContent=e.message; el.hidden=false; } } };
  r.readAsText(f);
}

/* ---------- export ---------- */
function aarDownload(filename, text, mime){
  const blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
}
function aarStem(){
  const a = D.aar; if (!a) return 'aar';
  return String(a.name||'aar').replace(/\.[^.]+$/,'').replace(/[^\w.-]+/g,'_') || 'aar';
}
function aarExportJSON(){
  if (!D.aar) return;
  aarDownload(aarStem()+'_aar.json', JSON.stringify(D.aar), 'application/json');
}
function aarCSV(rows, cols){
  const q = v => { const s = v==null?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [cols.join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\r\n');
}
function aarExportEngagementsCSV(){
  const a = D.aar; if (!a) return;
  const rows = a.engagements.map(e=>({
    time:e.ts, kind:e.kind, weapon:e.weapon, serial:e.serial, target:e.target,
    base_ph:e.base, final_ph:e.final, floored:e.floored?1:0, roll:e.roll, result:e.result,
    intercept_angle_deg:e.angle, target_kts:e.tgtKts, interceptor_kts:e.intcKts, los_deg_s:e.los,
    modifiers:(e.mods||[]).map(m=>m.name+(m.v==null?'':'='+m.v)).join('; '),
  }));
  aarDownload(aarStem()+'_engagements.csv',
    aarCSV(rows, ['time','kind','weapon','serial','target','base_ph','final_ph','floored','roll','result',
                  'intercept_angle_deg','target_kts','interceptor_kts','los_deg_s','modifiers']), 'text/csv');
}
function aarExportTerminalCSV(){
  const a = D.aar; if (!a) return;
  const rows = a.terminal.map(t=>({time:t.ts, side:t.side, weapon:t.weapon, serial:t.serial, result:t.result, mode:t.mode, detail:t.detail}));
  aarDownload(aarStem()+'_terminal.csv', aarCSV(rows, ['time','side','weapon','serial','result','mode','detail']), 'text/csv');
}

/* ============================================================
   UI STATE - collapsible sections and scroll position across navigation

   render() rebuilds #main wholesale on every hash change, so every <details>
   and every expandable AAR row reverts to its authored default. That makes the
   back button destructive: open three levels of a scenario ORBAT, click into a
   platform, come back, and the whole tree is shut again.

   Keys are derived from the DOM after each render rather than authored into
   each view, so no view function has to know this exists. A key is the route
   plus the chain of <summary> labels from the outermost <details> inward -
   "#/scenario | Blue Force > TF 60 > Surface ships" - which survives sorting,
   filtering and paging, because it does not depend on element position.
   Repeated label chains are disambiguated by order of appearance.

   State lives for the life of the page only. It is deliberately not persisted
   to localStorage: a tree restored from a session three days ago, against a
   scenario that has since been replaced, is confusing rather than helpful.
   ============================================================ */

const UIS = {
  open: new Map(),      // key -> boolean          (details / expandable rows)
  scroll: new Map(),    // history entry -> scrollY
  seq: null,            // history entry on screen, so scroll is filed correctly
  next: 0,              // counter handing out history-entry numbers
  quiet: false,         // set while re-applying, so restores do not re-record
};
const UIS_MAX = 5000;   // a long session should not grow without bound
const SEP='~|~', SUB='~>~', DUP='~#~', ROW='~row~';   // separators no <summary> label contains

function uisRoute(){ return location.hash.split('?')[0] || '#/'; }

/* Which history entry are we on, and have we been on it before?

   Not popstate: Chromium fires popstate on EVERY fragment navigation, forward
   ones included, so it cannot tell a click from a back button. Instead stamp
   each entry with a number the first time it is rendered. An entry that already
   carries a number is one the reader has been on before - a back or forward -
   and only then is a scroll position restored. */
function uisEntry(){
  const st = history.state;
  if (st && typeof st.uisSeq === 'number') return {seq: st.uisSeq, fresh: false};
  const seq = ++UIS.next;
  try { history.replaceState(Object.assign({}, st, {uisSeq: seq}), ''); }
  catch(e){ return {seq: null, fresh: true}; }
  return {seq, fresh: true};
}

function uisRemember(k, v){
  if (k == null) return;
  if (UIS.open.size > UIS_MAX) UIS.open.clear();
  UIS.open.set(k, v);
}

function uisLabel(d){
  const s = d.firstElementChild;
  if (!s || s.tagName !== 'SUMMARY') return '';
  return s.textContent.replace(/\s+/g, ' ').trim().slice(0, 80);
}

/* Assign every collapsible in #main a stable key, then re-apply what we know
   about it. Anything we have never seen keeps the author's default. */
function uisIndex(){
  const main = document.getElementById('main');
  if (!main) return;
  const route = uisRoute(), seen = new Map();
  UIS.quiet = true;

  for (const d of main.querySelectorAll('details')){
    const chain = [];
    for (let n = d; n && n !== main; n = n.parentElement)
      if (n.tagName === 'DETAILS') chain.push(uisLabel(n));
    let k = route + SEP + chain.reverse().join(SUB);
    const n = seen.get(k) || 0; seen.set(k, n + 1);
    if (n) k += DUP + n;
    d.__uisk = k;
    const v = UIS.open.get(k);
    if (v !== undefined && d.open !== v) d.open = v;
  }

  /* AAR expandable rows are not <details> - they are a hidden sibling <tr>
     driven by aarTog(), keyed by an id already derived from the row's name. */
  for (const r of main.querySelectorAll('tr.aarsub[id]')){
    const k = route + SEP + ROW + r.id;
    r.__uisk = k;
    const v = UIS.open.get(k);
    if (v === undefined) continue;
    r.hidden = !v;
    const c = document.getElementById(r.id + 'c');
    if (c) c.textContent = v ? '▾' : '▸';
  }

  UIS.quiet = false;
}

/* toggle does not bubble, so listen in the capture phase. */
document.addEventListener('toggle', e => {
  const d = e.target;
  if (UIS.quiet || !d || d.tagName !== 'DETAILS') return;
  uisRemember(d.__uisk, d.open);
}, true);

/* The browser does its own scroll restoration on history navigation,
   asynchronously and after ours. Take it over so there is one owner. */
try { if (history.scrollRestoration) history.scrollRestoration = 'manual'; } catch(e){}

window.addEventListener('scroll', () => {
  if (UIS.seq != null) UIS.scroll.set(UIS.seq, window.scrollY);
}, {passive: true});

/* Called at the top of render(), before #main is replaced. This is the last
   moment the outgoing page is still on screen, so it is where the reader's
   position is filed. Going to the top here rather than after the swap also
   keeps the browser from anchoring the new content to the old offset.
   UIS.seq goes null so the scroll events this causes are not filed anywhere. */
function uisBeforeRender(){
  if (UIS.seq != null) UIS.scroll.set(UIS.seq, window.scrollY);
  UIS.seq = null;                 // ignore the scroll events the next line causes
  window.scrollTo(0, 0);
}

/* Called at the end of render(), in place of the old unconditional
   scrollTo(0,0). A fresh navigation still lands at the top; only back and
   forward restore where the reader was. */
function uisAfterRender(){
  const e = uisEntry();
  uisIndex();
  const y = e.fresh ? 0 : (UIS.scroll.get(e.seq) || 0);
  window.scrollTo(0, y);
  if (y) requestAnimationFrame(() => window.scrollTo(0, y));   // after late layout
  UIS.seq = e.seq;
}

/* ---------- overview ---------- */
function aarFmtSpan(a){
  if (a.span.start==null) return '—';
  const d = t => new Date(t).toISOString().replace('T',' ').replace(/\.\d+Z$/,'');
  const mins = (a.span.end - a.span.start)/60000;
  return d(a.span.start) + ' → ' + d(a.span.end).slice(11) + ' Z  ·  ' + (mins>=60 ? fmt.n(mins/60,1)+' h' : fmt.n(mins,0)+' min');
}

/* activity histogram + engagement rail. One series each, directly labelled — no legend needed. */
function aarTimeline(a){
  if (a.span.start==null || a.span.end<=a.span.start) return '';
  const W=880, H=92, PAD=4, RAIL=14, BODY=H-RAIL-16;
  const NB=72, t0=a.span.start, span=a.span.end-t0, bw=(W-PAD*2)/NB;
  const bins=new Array(NB).fill(0), ebins=new Array(NB).fill(0);
  const idx = t => Math.min(NB-1, Math.max(0, Math.floor((t-t0)/span*NB)));
  // activity = EVERY timestamped record, not only the typed-payload ones: a detection-only
  // log (no engagements at all) must still draw a timeline.
  const times = Array.isArray(a.times) && a.times.length ? a.times
    : [].concat(a.engagements, a.terminal, a.softkill, a.damage, a.denied, a.isr).map(r=>r.t);
  for (const t of times) if (t!=null) bins[idx(t)]++;
  for (const e of a.engagements) if (e.t!=null) ebins[idx(e.t)]++;
  const max=Math.max(1,...bins);
  const minsPer = span/NB/60000;
  let bars='';
  for (let i=0;i<NB;i++){
    const h = bins[i] ? Math.max(2, Math.round(bins[i]/max*BODY)) : 0;
    if (!h) continue;
    const lbl = `${fmt.n(bins[i])} record${bins[i]===1?'':'s'}${ebins[i]?` · ${ebins[i]} scored engagement${ebins[i]===1?'':'s'}`:''} — +${fmt.n(i*minsPer,0)} min`;
    bars += `<rect x="${(PAD+i*bw).toFixed(1)}" y="${PAD+BODY-h}" width="${Math.max(1,bw-2).toFixed(1)}" height="${h}" rx="2" fill="var(--border-2)" data-tip="${esc(lbl)}"></rect>`;
    if (ebins[i]) bars += `<rect x="${(PAD+i*bw).toFixed(1)}" y="${PAD+BODY+4}" width="${Math.max(1,bw-2).toFixed(1)}" height="${RAIL-6}" rx="1.5" fill="var(--accent)" data-tip="${esc(lbl)}"></rect>`;
  }
  const clock = t => new Date(t).toISOString().slice(11,19) + 'Z';
  return `<div class="card"><h3>Activity</h3>`
    + `<svg class="aartl" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Log activity over time">`
    + `<line x1="${PAD}" y1="${PAD+BODY+.5}" x2="${W-PAD}" y2="${PAD+BODY+.5}" stroke="var(--axis)" stroke-width="1"></line>${bars}</svg>`
    + `<div class="aartlx"><span class="aartlt">${esc(clock(t0))}</span>`
    + `<span class="aartlnote">bars: all records per ${fmt.n(minsPer,1)} min`
    + (a.engagements.length ? ` · <b class="aartlkey">blue rail</b>: scored engagements` : '')
    + `</span><span class="aartlt">${esc(clock(a.span.end))}</span></div>`
    + `</div>`;
}

function aarKPI(a){
  const scored=a.engagements.length, expended=a.terminal.length;
  const hits=a.engagements.filter(e=>e.result==='HIT').length;
  const tile=(v,l,sub,cls)=>`<div class="aarkpi ${cls||''}"><div class="aarkv">${v}</div><div class="aarkl">${l}</div>${sub?`<div class="aarks">${sub}</div>`:''}</div>`;
  return `<div class="aarkpis">`
    + tile(fmt.n(a.records), 'records', (a.coverage>=1?'100%':fmt.n(a.coverage*100,2)+'%')+' classified')
    + tile(fmt.n(scored), 'scored engagements', scored?`${fmt.n(hits)} hit · ${fmt.n(100*hits/scored,0)}%`:'no shots resolved')
    // scored engagements and terminal records are two different record classes, not a
    // subset relationship — a weapon can be scored without a separate terminal record.
    // Only state the ratio when it is actually a ratio.
    + tile(fmt.n(expended), 'weapons to endgame',
        !expended ? ''
        : !scored ? 'none scored — see unguided fire'
        : scored <= expended ? `${fmt.n(100*scored/expended,0)}% reached a PH roll`
        : 'more scored than terminal — see record classes')
    + tile(fmt.n(a.softkill.length), 'soft-kill attempts', a.softkill.length?`${fmt.n(a.softkill.filter(s=>s.result==='SUCCESS').length)} succeeded`:'')
    + tile(fmt.n(a.damage.length), 'damage events', a.damage.length?`${fmt.n(a.damage.filter(d=>d.kind==='destroyed'||d.kind==='sinking').length)} kills / sinkings`:'')
    + tile(fmt.n(a.denied.length), 'denied shots', a.denied.filter(d=>d.reason).length?`${fmt.n(a.denied.filter(d=>d.reason).length)} with a stated reason`:'')
    + `</div>`;
}

/* F5: two denominators. Rounds that reached an endgame vs rounds that got a PH roll. */
function aarMissModes(a){
  if (!a.terminal.length) return '';
  const by=new Map();
  for (const t of a.terminal){ const k=(t.result==='HIT'?'HIT · ':'MISS · ')+t.mode; by.set(k,(by.get(k)||0)+1); }
  const rows=[...by.entries()].sort((x,y)=>y[1]-x[1]);
  const max=rows[0][1];
  return `<div class="card"><h3>Terminal outcomes</h3>`
    + `<p class="small">How each weapon that reached an endgame actually ended. Modes other than a scored engagement never reached a probability roll at all.</p>`
    + rows.map(([k,v])=>`<div class="aarbar"><span class="aarbl ${k.startsWith('HIT')?'hit':'miss'}">${esc(k)}</span>`
        + `<span class="aarbt"><i style="width:${(v/max*100).toFixed(1)}%"></i></span><span class="aarbn">${fmt.n(v)}</span></div>`).join('')
    + `</div>`;
}

/* Direct/unguided fire is logged at the trigger pull, not at the endgame, and comes in two
   flavours that must never be pooled: PoH (probability, % — higher is better) and
   CEP (dispersion, length — LOWER is better). */
function aarUnguided(a){
  const rows = a.unguided || []; if (!rows.length) return '';
  let html = `<div class="card"><h3>Unguided fire</h3>`
    + `<p class="small">Logged at the moment of firing, with its own modifier chain. `
    + `<b>PoH</b> is a probability (higher is better); <b>CEP</b> is a dispersion radius (<b>lower</b> is better) — they are different measures and are listed separately.</p>`;
  for (const metric of ['CEP','PoH']){
    const set = rows.filter(r=>r.metric===metric); if (!set.length) continue;
    const by = new Map();
    for (const r of set){ const k=r.weapon; if(!by.has(k)) by.set(k,[]); by.get(k).push(r); }
    html += `<div class="aartier">${metric==='CEP'?'Circular error probable — lower is better':'Probability of hit — higher is better'}<span>${fmt.n(set.length)}</span></div>`
      + `<div class="aarftw"><table class="list aarft"><thead><tr><th>Weapon</th><th class="num">bursts</th>`
      + `<th class="num">nominal</th><th class="num">final</th><th class="num">${metric==='CEP'?'tighter / worse':'better / worse'}</th><th>modifiers seen</th></tr></thead><tbody>`;
    for (const [w,rs] of [...by.entries()].sort((x,y)=>y[1].length-x[1].length)){
      const u=rs[0].unit, mean=k=>rs.reduce((s,r)=>s+r[k],0)/rs.length;
      const good = metric==='CEP' ? rs.filter(r=>r.final<r.nominal).length : rs.filter(r=>r.final>r.nominal).length;
      const bad  = metric==='CEP' ? rs.filter(r=>r.final>r.nominal).length : rs.filter(r=>r.final<r.nominal).length;
      // one entry per modifier NAME; show the detail only when it never varies
      const seen=new Map();
      for (const r of rs) for (const m of (r.mods||[])){
        if (!seen.has(m.name)) seen.set(m.name,new Set());
        if (m.detail) seen.get(m.name).add(m.detail);
      }
      const names=[...seen.entries()].map(([n,ds])=>ds.size===1?`${n} (${[...ds][0]})`:n);
      html += `<tr><td>${esc(w)}</td><td class="num">${fmt.n(rs.length)}</td>`
        + `<td class="num">${fmt.n(mean('nominal'),1)}${esc(u)}</td>`
        + `<td class="num"><b>${fmt.n(mean('final'),1)}${esc(u)}</b></td>`
        + `<td class="num">${good?`<span class="aargood">${good}</span>`:'0'} / ${bad?`<span class="aarbad">${bad}</span>`:'0'}</td>`
        + `<td class="dim">${esc(names.join(' · '))||'—'}</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }
  return html+`</div>`;
}

function aarClassTable(a){
  const tiers={1:[],2:[],3:[]}; let un=0;
  for (const [k,v] of Object.entries(a.classes)){
    if (k==='UNMATCHED'){ un=v; continue; }
    (tiers[AAR_TIER[k]||2]).push([k,v]);
  }
  let html=`<div class="card"><h3>Record classes</h3>`;
  for (const t of [1,2,3]){
    const rows=tiers[t].sort((x,y)=>y[1]-x[1]);
    if (!rows.length) continue;
    html += `<div class="aartier">${AAR_TIER_LABEL[t]}<span>${fmt.n(rows.reduce((s,r)=>s+r[1],0))}</span></div>`
      + `<div class="aarcls">` + rows.map(([k,v])=>`<span class="aarcl"><b>${esc(k)}</b>${fmt.n(v)}</span>`).join('') + `</div>`;
  }
  html += `<div class="aarunm ${un?'bad':'ok'}">${un ? `⚠ ${fmt.n(un)} record${un===1?'':'s'} did not match any known pattern — the grammar needs extending for this scenario type.` : '✓ Every record matched a known pattern.'}</div>`;
  if (un) html += `<details class="aarunmd"><summary>Show unmatched</summary><pre>${esc(a.unmatched.slice(0,60).map(u=>u.ts+' — '+u.body).join('\n'))}</pre></details>`;
  return html+`</div>`;
}

/* F3: a log with no weapon employment is valid — show what it DOES contain. */
function aarDetectionPanel(a){
  const c=a.classes, n=k=>c[k]||0;
  const contacts=n('CONTACT_NEW'), ids=n('CONTACT_ID'), lost=n('CONTACT_LOST')+n('CONTACT_LOST_PRIV');
  const byObs=new Map(); for(const r of a.isr) byObs.set(r.by,(byObs.get(r.by)||0)+1);
  let html=`<div class="card"><h3>Detection &amp; tracking</h3>`
    + `<p class="small">No weapon reached an endgame in this log, so there is nothing to score. This is what the log does contain.</p>`
    + `<div class="aarkpis">`
    + `<div class="aarkpi"><div class="aarkv">${fmt.n(contacts)}</div><div class="aarkl">new contacts</div></div>`
    + `<div class="aarkpi"><div class="aarkv">${fmt.n(ids)}</div><div class="aarkl">classifications</div></div>`
    + `<div class="aarkpi"><div class="aarkv">${fmt.n(lost)}</div><div class="aarkl">contacts lost</div></div>`
    + `<div class="aarkpi"><div class="aarkv">${fmt.n(n('COMMS'))}</div><div class="aarkl">comms events</div></div>`
    + `</div>`;
  if (byObs.size) html += `<div class="aartier">Airfield ISR by observer<span>${fmt.n(a.isr.length)}</span></div><div class="aarcls">`
    + [...byObs.entries()].sort((x,y)=>y[1]-x[1]).slice(0,12).map(([k,v])=>`<span class="aarcl"><b>${esc(k)}</b>${fmt.n(v)}</span>`).join('')+`</div>`;
  return html+`</div>`;
}

function aarSidesBanner(a){
  const sides=Object.entries(a.sides).sort((x,y)=>y[1]-x[1]);
  if (!sides.length) return '';
  const ge = (a.godseye||[]).filter(g=>g.state==='ENABLED').length;
  return `<div class="aarwarn"><b>Visibility:</b> a CMO log records what the selected side could see. `
    + `Side-tagged records in this log: ` + sides.map(([s,n])=>`<span class="aarchip">${esc(s)} <b>${fmt.n(n)}</b></span>`).join(' ')
    + `. Engagement-resolution records carry no side tag at all, so every rate below is “as observed”, not ground truth.`
    + (ge ? `<br><b>God's Eye was enabled ${fmt.n(ge)}×</b> during this log — while it is on the log is not limited to one side's picture, so contact and detection counts here are not a fair measure of what that side actually knew.` : '')
    + `</div>`;
}

function viewAAR(params, tab){
  const a = D.aar;
  if (!a) return aarIngestPanel();
  let html = `<div class="scen aarpage"><div class="schead"><h2>AAR — message log</h2>`

    + (a.tsFormat?` · dates read as <b>${esc(a.tsFormat)}</b>${a.tsAmbiguous?` <span class="aarflag warn" data-tip="No day above 12 appears anywhere in this log, so month-first vs day-first cannot be proven. Ordering is unaffected.">assumed</span>`:''}`:'')
    + (a.mirrored?` · <span data-tip="The same event is written once per observing side; duplicates were collapsed so counts are not doubled.">${fmt.n(a.mirrored)} side-mirrored records merged</span>`:'')
    + (a.notPersisted?` · <span class="aarno">not saved to this browser (storage unavailable) — export if you want to keep it</span>`:'')
    + `</div></div>`;

    + `<button onclick="aarExportWeaponsCSV()" ${a.engagements.length?'':'disabled'}>Weapons CSV (DB-joined)</button>`
    + `<button onclick="aarExportTerminalCSV()" ${a.terminal.length?'':'disabled'}>Terminal CSV</button>`
    + `<button onclick="aarExportEffectsCSV()" ${(a.terminal.length||a.damage.length)?'':'disabled'}>Effects CSV</button>`
    + `<button onclick="aarExportXrefCSV()" ${(D.scenario&&D.scenario.units&&D.scenario.units.length)?'':'disabled'}>ORBAT x-ref CSV</button>`
    + `<button onclick="clearAAR()">Clear</button></div>`;
  html += aarTabs(tab||'');
  html += aarSidesBanner(a);
  html += aarKPI(a);
  html += aarTimeline(a);
  if (tab === 'weapons'){
    html += aarWeaponsView(a);
    html += `<div class="aarnext">The per-engagement modifier waterfall and the ORBAT cross-join are later phases.</div>`;
    return html + `</div>`;
  }
  if (tab === 'mechanics'){
    html += aarMechanicsView(a);
    return html + `</div>`;
  }
  if (tab === 'orbat'){
    html += aarOrbatView(a);
    return html + `</div>`;
  }
  if (tab === 'losses'){
    html += aarLossesView(a);
    return html + `</div>`;
  }

function aarIngestPanel(){
  return `<div class="scen aarpage"><div class="schead"><h2>AAR — message log</h2>`
    + `<div class="scnote">Load one CMO message log to see what happened in it — engagements, terminal outcomes, soft-kill, damage and detection. One log at a time: loading a new one replaces the current one, so export anything you want to keep.</div></div>`
    + `<div class="card"><h3>Load a log</h3>`
    + `<ol class="scsteps"><li>In CMO, the running log is written to <code>AALog.txt</code> in your scenario/log folder. It is overwritten each session — <b>copy it aside before loading a new scenario.</b></li>`
    + `<li>Choose that file below, or paste its contents into the box.</li>`

    + `<div class="aarcfg"><p><b>Required</b> — the analysis does not work without these: Weapon Endgame Calculations · Unguided Weapon Accuracy Modifiers · Weapon Damage · Unit Damage · Unit Lost · Point Defence.</p>`
    + `<p><b>Recommended on:</b> Contact change and the New-contact family · Comms-related Message · Special Messages.</p>`

    + `<label class="scfile">or choose a file<input type="file" accept=".txt,.log,.json" onchange="aarIngestFromFile(this)" hidden></label></div>`
    + `<div id="aarerr" class="scerr" hidden></div></div></div>`;
}

/* ============================================================
   AAR PHASE 2 — DB JOIN + WEAPON PERFORMANCE
   The log carries only name strings. The dashboard already holds the whole weapon and
   platform catalog, so every log entity is resolved by name to its DB record. That gives
   click-through, the declared PoK/CEP to compare the logged value against, and
   TargetSpeedMax — which turns out to explain most of the bad engagements.
   ============================================================ */

const AAR_GUN_POK = 2/3;   // OBSERVED: gun engagements log base-Ph at exactly 2/3 of DB AirPoK
const AAR_MIN_N   = 5;     // below this, a rate is shown but never ranked or emphasised

let AAR_IDX = null;
function aarIndex(){
  if (AAR_IDX) return AAR_IDX;
  const norm = s => String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
  const w = new Map(), p = new Map();
  for (const [id,x] of D.weapon) if (x.Name){ const k=norm(x.Name); if(!w.has(k)) w.set(k,x); }
  for (const kind of Object.keys(D.platforms)) for (const [id,u] of D.platforms[kind])
    if (u.Name){ const k=norm(u.Name); if(!p.has(k)) p.set(k,{kind,u}); }
  AAR_IDX = {norm, w, p};
  return AAR_IDX;
}
function aarWeapon(name){ const i=aarIndex(); return i.w.get(i.norm(name)) || null; }
function aarPlatform(name){ const i=aarIndex(); return i.p.get(i.norm(name)) || null; }

/* "STRIX #1 (Su-35K Flanker E)" -> {instance:'STRIX #1', type:'Su-35K Flanker E'} */
function aarSplitTarget(name){
  const m = /^(.*?)\s*#\d+\s*\((.+)\)$/.exec(String(name||''));
  return m ? {instance:m[1].trim(), type:m[2].trim()} : {instance:null, type:String(name||'').trim()};
}

/* coarse target class — what F9 says the performance table must segment on */
function aarTargetClass(name){
  const {type} = aarSplitTarget(name);
  const w = aarWeapon(type);
  if (w) return {cls: (WFAM[w.fam]||WFAM.other).label, kind:'weapon', rec:w, route:`#/weapon/${w.ID}`};
  const p = aarPlatform(type);
  if (p) return {cls:(KIND_BY_KEY[p.kind]||{label:p.kind}).label, kind:'platform', rec:p.u,
                 route:`#/${(KIND_BY_KEY[p.kind]||{route:''}).route}/${p.u.ID}`};
  return {cls:'Unresolved', kind:null, rec:null, route:null};
}

/* speed bands. The cliff in the corpus sits between ~2,400 and ~3,500 kts. */
const AAR_BANDS = [
  {k:'subsonic',        label:'Subsonic (<600 kt)',        lo:0,    hi:600},
  {k:'transonic',       label:'Transonic (600–1,200)',     lo:600,  hi:1200},
  {k:'supersonic',      label:'Supersonic (1,200–2,400)',  lo:1200, hi:2400},
  {k:'high-supersonic', label:'High supersonic (2,400–3,500)', lo:2400, hi:3500},
  {k:'hypersonic',      label:'Hypersonic (>3,500)',       lo:3500, hi:Infinity},
];
function aarBand(kts){ if (kts==null) return null; return AAR_BANDS.find(b=>kts>=b.lo&&kts<b.hi) || null; }

/* Wilson score interval — honest at the small n a single log produces */
function aarWilson(hits, n, z){
  if (!n) return null; z = z||1.96;
  const p=hits/n, d=1+z*z/n, c=p+z*z/(2*n), m=z*Math.sqrt((p*(1-p)+z*z/(4*n))/n);
  return {lo:Math.max(0,(c-m)/d), hi:Math.min(1,(c+m)/d)};
}

/* attach DB facts to every engagement, once per ingest */
function aarJoin(a){
  if (a._joined) return a._joined;
  const rows = a.engagements.map(e => {
    const w = aarWeapon(e.weapon);
    const tc = aarTargetClass(e.target);
    const isGun = e.kind === 'gun';
    const dbPok = w ? w.AirPoK : null;
    const expect = (dbPok==null) ? null : (isGun ? dbPok*AAR_GUN_POK : dbPok);
    const tsMax = w && w.TargetSpeedMax ? w.TargetSpeedMax : null;
    return {...e, w, wid: w?w.ID:null, tcls: tc.cls, troute: tc.route,
      dbPok, expect,
      baseMatches: expect==null ? null : Math.abs(expect - e.base) <= 0.1,
      tsMax, overspeed: !!(tsMax && e.tgtKts && e.tgtKts > tsMax),
      band: aarBand(e.tgtKts)};
  });
  a._joined = rows;
  return rows;
}

function aarPk(n, hits){
  const ci = aarWilson(hits, n);
  const pk = n ? 100*hits/n : 0;
  const low = n < AAR_MIN_N;
  return `<span class="aarpk ${low?'low':''}">${fmt.n(pk,0)}%</span>`
    + (ci ? `<span class="aarci">${fmt.n(ci.lo*100,0)}–${fmt.n(ci.hi*100,0)}</span>` : '');
}

function aarWeaponsView(a){
  const rows = aarJoin(a);
  if (!rows.length) return `<div class="card"><h3>Weapon performance</h3>`
    + `<p class="small">This log contains no scored engagements, so there is no probability data to analyse. `
    + (a.unguided&&a.unguided.length ? `Its ${fmt.n(a.unguided.length)} unguided-fire records are on the Overview tab.` : '')
    + `</p></div>`;

  const unres = rows.filter(r=>!r.w).length;
  const byW = new Map();
  for (const r of rows){ const k=r.weapon; if(!byW.has(k)) byW.set(k,[]); byW.get(k).push(r); }

  let html = `<div class="card"><h3>Weapon performance</h3>`
    + `<p class="small">Every weapon resolved against the loaded database (${esc(D.meta.file||'')}). `
    + `Rates below n=${AAR_MIN_N} are dimmed and should not be ranked — the range after each rate is a 95% confidence interval. `
    + `Expand a row to see it split by target class, which is where the real differences are.</p>`;
  if (unres) html += `<div class="aarnote">${fmt.n(unres)} engagement${unres===1?'':'s'} use a weapon name absent from this database — shown without a link. A log made under a different DB version will do this.</div>`;

  html += `<div class="aarftw"><table class="list aarwt"><thead><tr>`
    + `<th>Weapon</th><th class="num">n</th><th class="num">hits</th><th class="num">Pk (95% CI)</th>`
    + `<th class="num">base PH</th><th class="num">DB PoK</th><th class="num">final PH</th><th class="num">erosion</th><th>flags</th>`
    + `</tr></thead><tbody>`;

  for (const [name,rs] of [...byW.entries()].sort((x,y)=>y[1].length-x[1].length)){
    const n=rs.length, h=rs.filter(r=>r.result==='HIT').length;
    const base=rs.reduce((s,r)=>s+r.base,0)/n, fin=rs.reduce((s,r)=>s+r.final,0)/n;
    const w=rs[0].w, isGun=rs[0].kind==='gun';
    const over=rs.filter(r=>r.overspeed).length, floored=rs.filter(r=>r.floored).length;
    const mism=rs.filter(r=>r.baseMatches===false).length;
    const flags=[];
    if (over) flags.push(`<span class="aarflag bad" data-tip="Target was faster than this weapon's database TargetSpeedMax (${fmt.n(rs[0].tsMax)} kt)">${over}× overspeed</span>`);
    if (floored) flags.push(`<span class="aarflag warn" data-tip="Final PH hit the engine's 5% floor — the model gave up rather than computing 5%">${floored}× floored</span>`);
    const id=`aw${name.replace(/[^a-z0-9]/gi,'')}`;
    html += `<tr class="aarwrow" onclick="aarTog('${id}')"><td>`
      + `<span class="aarchev" id="${id}c">▸</span> `
      + (w?`<a href="#/weapon/${w.ID}" onclick="event.stopPropagation()">${esc(name)}</a>`:`${esc(name)} <span class="aarflag warn">not in DB</span>`)
      + `</td><td class="num">${n}</td><td class="num">${h}</td><td class="num">${aarPk(n,h)}</td>`
      + `<td class="num">${fmt.n(base,1)}%</td>`
      + `<td class="num">${rs[0].dbPok==null?'—':fmt.n(rs[0].dbPok,0)+'%'+(isGun?`<span class="aarx" data-tip="Guns log base-Ph at two-thirds of the database AirPoK">×⅔</span>`:'')}${mism?`<span class="aarflag warn" data-tip="Logged base PH does not match this database — likely a different DB version">≠</span>`:''}</td>`
      + `<td class="num"><b>${fmt.n(fin,1)}%</b></td>`
      + `<td class="num aarero">${fmt.n(fin-base,1)}</td><td>${flags.join(' ')||''}</td></tr>`;
    // per-target-class breakdown (F9)
    const byC=new Map();
    for (const r of rs){ const k=r.tcls+' · '+(r.band?r.band.label:'speed unknown'); if(!byC.has(k)) byC.set(k,[]); byC.get(k).push(r); }
    html += `<tr class="aarsub" id="${id}" hidden><td colspan="9"><table class="aarsubt"><tbody>`;
    for (const [k,cs] of [...byC.entries()].sort((x,y)=>y[1].length-x[1].length)){
      const cn=cs.length, ch=cs.filter(r=>r.result==='HIT').length;
      const cf=cs.reduce((s,r)=>s+r.final,0)/cn;
      const co=cs.filter(r=>r.overspeed).length;
      html += `<tr><td>${esc(k)}</td><td class="num">${cn}</td><td class="num">${aarPk(cn,ch)}</td>`
        + `<td class="num">final ${fmt.n(cf,1)}%</td><td>${co?`<span class="aarflag bad">${co}× overspeed</span>`:''}</td></tr>`;
    }
    html += `</tbody></table></td></tr>`;
  }
  html += `</tbody></table></div></div>`;
  html += aarBandPanel(rows) + aarOverspeedPanel(rows);
  return html;
}

/* The mechanism behind F9, pooled across weapons so it survives small n. */
function aarBandPanel(rows){
  const set=rows.filter(r=>r.band); if(!set.length) return '';
  const by=new Map();
  for (const r of set){ const k=r.band.k; if(!by.has(k)) by.set(k,[]); by.get(k).push(r); }
  const max=Math.max(...[...by.values()].map(v=>v.length));
  let html=`<div class="card"><h3>Performance by target speed</h3>`
    + `<p class="small">Pooled across every weapon in this log, so it stays readable where per-weapon cells are too thin to trust. `
    + `${fmt.n(rows.length-set.length)} engagement${rows.length-set.length===1?'':'s'} logged no target speed and are excluded.</p>`;
  for (const b of AAR_BANDS){
    const rs=by.get(b.k); if(!rs) continue;
    const n=rs.length,h=rs.filter(r=>r.result==='HIT').length;
    const f=rs.reduce((s,r)=>s+r.final,0)/n;
    const los=rs.filter(r=>r.los!=null);
    html += `<div class="aarbar"><span class="aarbl">${esc(b.label)}</span>`
      + `<span class="aarbt"><i style="width:${(n/max*100).toFixed(1)}%"></i></span>`
      + `<span class="aarbn">n=${n}</span>`
      + `<span class="aarbx">Pk ${aarPk(n,h)} · final PH ${fmt.n(f,1)}%`
      + (los.length?` · LOS ${fmt.n(los.reduce((s,r)=>s+r.los,0)/los.length,2)}°/s`:'')
      + `</span></div>`;
  }
  return html+`</div>`;
}

/* Weapons shooting past their own declared envelope. */
function aarOverspeedPanel(rows){
  const set=rows.filter(r=>r.overspeed); if(!set.length) return '';
  const by=new Map();
  for (const r of set){ const k=r.weapon; if(!by.has(k)) by.set(k,[]); by.get(k).push(r); }
  let html=`<div class="card"><h3>Engagements beyond the weapon's declared envelope</h3>`
    + `<p class="small">The target was faster than the weapon's <code>TargetSpeedMax</code> in this database. `
    + `These are shots the catalog says the weapon cannot make.</p>`
    + `<div class="aarftw"><table class="list"><thead><tr><th>Weapon</th><th class="num">TargetSpeedMax</th>`
    + `<th class="num">fastest engaged</th><th class="num">n</th><th class="num">Pk</th><th class="num">mean final PH</th></tr></thead><tbody>`;
  for (const [k,rs] of [...by.entries()].sort((x,y)=>y[1].length-x[1].length)){

      + `<td class="num">${n}</td><td class="num">${aarPk(n,h)}</td>`
      + `<td class="num">${fmt.n(rs.reduce((s,r)=>s+r.final,0)/n,1)}%</td></tr>`;

}

/* F10 — the shots that were never taken, with the engine's stated reason. */
function aarDeniedView(a){

  if (!rows.length) return `<div class="card"><h3>Denied engagements</h3><p class="small">No doctrine or targeting-quality refusals in this log.</p></div>`;

    + `<div class="aarftw"><table class="list"><thead><tr><th>Weapon ⟵ shooter</th><th class="num">refusals</th><th>targets</th><th>reason</th></tr></thead><tbody>`;
  for (const [k,rs] of [...by.entries()].sort((x,y)=>y[1].length-x[1].length)){

    const reasons=new Set(rs.map(r=>(r.reason||'—').replace(/\(([\d.]+)\s*nm\)/g,'(N nm)')));
    const nums=rs.map(r=>{const m=/\(([\d.]+)\s*nm\)/.exec(r.reason||''); return m?+m[1]:null;}).filter(v=>v!=null);
    html += `<tr><td>${w?`<a href="#/weapon/${w.ID}">${esc(rs[0].weapon)}</a>`:esc(rs[0].weapon)} <span class="dim">⟵ ${esc(rs[0].unit)}</span></td>`
      + `<td class="num">${rs.length}</td><td class="dim">${esc([...tg].slice(0,3).join(' · '))}${tg.size>3?` +${tg.size-3}`:''}</td>`
      + `<td class="aarreason">${esc([...reasons][0])}`
      + (nums.length?`<div class="dim">observed values ${fmt.n(Math.min(...nums),1)}–${fmt.n(Math.max(...nums),1)} nm</div>`:'')
      + `</td></tr>`;

}
