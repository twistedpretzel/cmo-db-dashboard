/* ============================================================
   AAR PHASE 3 - ENGAGEMENT MECHANICS & SOFT KILL

   This was scoped as a "modifier waterfall". It is not one, deliberately.

   OBSERVED: across 1,599 unfloored, uncapped missile engagements, no composition of the
   logged modifier terms reconstructs the logged Final PH - additive gets within half a
   point 25% of the time, multiplicative and mixed models do worse. There are terms the
   engine applies but does not print. A cascade chart implying base -> term -> term -> final
   would therefore be a drawing of arithmetic that does not happen.

   So: the chain is shown as the engine wrote it, the modifier table is framed as
   association rather than contribution, and the causal story is carried by the geometry
   scatter, which is pure observation.
   ============================================================ */

/* how far the additive model misses, reported honestly on the page */
function aarChainResidual(e){
  const get = n => { const x=(e.mods||[]).find(m=>m.name===n); return x?x.v:null; };
  const ws=get('Weapon speed');
  const b = ws!=null ? ws : e.base;
  const sum = b + (get('Target speed')||0) + (get('Target signature')||0)
            + (get('Kinematic penalty')||0) + (get('Agility')||0) + (get('Sea-skimmer')||0);
  return {sum, resid: e.final - sum};
}

function aarChainCard(e){
  const r = aarChainResidual(e);
  const rows = (e.mods||[]).map(m=>{
    const sign = m.v==null ? '' : (m.v>0?'+':'');
    const cls  = m.v==null ? '' : (m.v>0?'aargood':(m.v<0?'aarbad':''));
    return `<tr><td>${esc(m.name)}${m.detail?` <span class="dim">${esc(m.detail)}</span>`:''}</td>`
      + `<td class="num ${cls}">${m.v==null?'&mdash;':sign+fmt.n(m.v,2)}</td>`
      + `<td class="dim aarraw">${esc(m.raw||'')}</td></tr>`;
  }).join('');
  const hit = e.result==='HIT';
  return `<div class="aarchain">`
    + `<div class="aarchainhd"><b>${esc(e.weapon)}</b>${e.serial?` <span class="dim">#${e.serial}</span>`:''}`
    + ` &rarr; ${esc(e.target)}<span class="aarchaint">${esc(e.ts||'')}</span></div>`
    + `<div class="aarchainkpi">`
    + `<span>base <b>${fmt.n(e.base,1)}%</b></span>`
    + `<span>final <b>${fmt.n(e.final,1)}%</b>${e.floored?` <span class="aarflag warn" data-tip="At the engine's 5% floor - the model gave up rather than computing 5%">floor</span>`:''}</span>`
    + `<span>roll <b>${e.roll}</b></span>`
    + `<span class="${hit?'aargood':'aarbad'}"><b>${e.result}</b></span>`
    + (e.note?`<span class="dim">${esc(e.note)}</span>`:'')
    + `</div>`
    + `<table class="aarchaint2"><tbody>${rows||'<tr><td class="dim">no modifier clauses logged</td></tr>'}</tbody></table>`
    + `<div class="aarchainnote">`
    + (r.sum < 0 || r.sum > 100
        ? `The printed terms do not reconstruct this result at all &mdash; taken as a sum they fall outside 0&ndash;100%. `
        : `The engine prints these terms but not everything it applies: as a sum they give ${fmt.n(r.sum,1)}%, `
          + (Math.abs(r.resid)<0.5 ? `which happens to match the logged final. `
             : `against a logged final of ${fmt.n(e.final,1)}% &mdash; a ${fmt.n(Math.abs(r.resid),1)}-point difference. `))
    + `Read the chain as the reasons, not as the sum.</div>`
    + `</div>`;
}

/* association, not contribution: how engagements carrying a term compare with those that don't */
function aarModTable(rows){
  const names = new Set(); for (const e of rows) for (const m of (e.mods||[])) names.add(m.name);
  if (!names.size) return '';
  let html = `<div class="card"><h3>Modifier incidence</h3>`
    + `<p class="small">How often each clause appears, and how engagements carrying it compare with those that do not. `
    + `This is <b>association</b>: the terms do not sum to the final PH (see any engagement chain below), so no column here is a contribution.</p>`
    + `<div class="aarftw"><table class="list"><thead><tr><th>Clause</th><th class="num">appears</th>`
    + `<th class="num">mean value</th><th class="num">final PH with</th><th class="num">final PH without</th><th class="num">Pk with</th></tr></thead><tbody>`;
  const stat = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
  for (const n of [...names].sort()){
    const withs = rows.filter(e=>(e.mods||[]).some(m=>m.name===n));
    const without = rows.filter(e=>!(e.mods||[]).some(m=>m.name===n));
    const vals = withs.map(e=>(e.mods.find(m=>m.name===n)||{}).v).filter(v=>v!=null);
    const fw = stat(withs.map(e=>e.final)), fo = stat(without.map(e=>e.final));
    const hits = withs.filter(e=>e.result==='HIT').length;
    html += `<tr><td>${esc(n)}</td><td class="num">${fmt.n(withs.length)}</td>`
      + `<td class="num">${vals.length?fmt.n(stat(vals),1):'&mdash;'}</td>`
      + `<td class="num"><b>${fw==null?'&mdash;':fmt.n(fw,1)+'%'}</b></td>`
      + `<td class="num">${fo==null?'&mdash;':fmt.n(fo,1)+'%'}</td>`
      + `<td class="num">${aarPk(withs.length,hits)}</td></tr>`;
  }
  return html+`</tbody></table></div></div>`;
}

/* final PH against crossing rate - the F9 mechanism, drawn straight from observation.
   Two series, so they are separated by SHAPE as well as colour and carry a legend. */
function aarGeomScatter(rows){
  const pts = rows.filter(e=>e.los!=null && e.final!=null);
  if (pts.length < 8) return '';
  const W=880, H=300, L=46, R=12, T=14, B=34;
  const iw=W-L-R, ih=H-T-B;
  const xs = v => L + iw * Math.min(1, Math.log10(1+Math.max(0,v)) / Math.log10(1+60));
  const ys = v => T + ih - ih*(Math.max(0,Math.min(100,v))/100);
  let marks='';
  for (const e of pts){
    const x=xs(e.los).toFixed(1), y=ys(e.final).toFixed(1);
    const tip = `${e.weapon} vs ${e.target} - final PH ${fmt.n(e.final,1)}%, LOS ${fmt.n(e.los,2)} deg/s${e.tgtKts?`, target ${fmt.n(e.tgtKts)} kt`:''} - ${e.result}`;
    marks += e.result==='HIT'
      ? `<circle cx="${x}" cy="${y}" r="3" fill="var(--good)" fill-opacity="0.75" data-tip="${esc(tip)}"></circle>`
      : `<circle cx="${x}" cy="${y}" r="3.2" fill="none" stroke="var(--bad)" stroke-width="1.3" stroke-opacity="0.8" data-tip="${esc(tip)}"></circle>`;
  }
  let grid='', xticks=[0,0.5,2,5,15,60];
  for (const v of [0,25,50,75,100]){
    const y=ys(v).toFixed(1);
    grid += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--grid)" stroke-width="1"></line>`
      + `<text x="${L-7}" y="${+y+3.5}" text-anchor="end" class="aaraxt">${v}%</text>`;
  }
  for (const v of xticks){
    const x=xs(v).toFixed(1);
    grid += `<text x="${x}" y="${H-B+16}" text-anchor="middle" class="aaraxt">${v}</text>`;
  }
  return `<div class="card"><h3>Probability against crossing rate</h3>`
    + `<p class="small">Every scored engagement: its final PH against the line-of-sight rate the engine recorded. `
    + `The collapse to the right is the geometry problem - a fast crosser, not a bad weapon. Log scale on the x axis.</p>`
    + `<div class="aarlegend"><span><span class="aarsw hit"></span>hit</span><span><span class="aarsw miss"></span>miss</span></div>`
    + `<svg class="aarsc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Final probability of hit against line-of-sight rate">`
    + grid
    + `<line x1="${L}" y1="${T}" x2="${L}" y2="${T+ih}" stroke="var(--axis)"></line>`
    + `<line x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}" stroke="var(--axis)"></line>`
    + marks
    + `<text x="${L+iw/2}" y="${H-3}" text-anchor="middle" class="aaraxl">line-of-sight rate (deg/s)</text>`
    + `</svg><div class="aarsn">${fmt.n(pts.length)} engagements plotted; ${fmt.n(rows.length-pts.length)} logged no LOS rate.</div></div>`;
}

/* declared probability against what actually happened */
function aarSoftkillView(a){
  const sk = a.softkill||[];
  if (!sk.length) return `<div class="card"><h3>Soft kill</h3><p class="small">No decoy or jammer attempts in this log.</p></div>`;
  const by = new Map();
  for (const s of sk){
    let x=by.get(s.system);
    if(!x){ x={system:s.system, kind:s.kind, n:0, ok:0, p:0, sensors:new Set(), weapons:new Set()}; by.set(s.system,x); }
    x.n++; x.ok += s.result==='SUCCESS'; x.p += s.prob;
    x.sensors.add(s.sensor); x.weapons.add(s.weapon);
  }
  const N=sk.length, OK=sk.filter(s=>s.result==='SUCCESS').length, P=sk.reduce((s,x)=>s+x.prob,0)/N;
  let html = `<div class="card"><h3>Soft kill</h3>`
    + `<p class="small">Each decoy or jammer attempt carries the probability the engine assigned it and the die roll against it, `
    + `so declared and realised rates can be compared directly. Unlike the engagement PH, these probabilities are printed unrounded: `
    + `the roll predicts the outcome in every one of the ${fmt.n(N)} attempts here.</p>`
    + `<div class="aarkpis">`
    + `<div class="aarkpi"><div class="aarkv">${fmt.n(N)}</div><div class="aarkl">attempts</div></div>`
    + `<div class="aarkpi"><div class="aarkv">${fmt.n(P,1)}%</div><div class="aarkl">mean declared</div></div>`
    + `<div class="aarkpi"><div class="aarkv">${fmt.n(100*OK/N,1)}%</div><div class="aarkl">realised</div>`
    + `<div class="aarks">${fmt.n(OK)} of ${fmt.n(N)} succeeded</div></div>`
    + `</div>`
    + `<div class="aarftw"><table class="list"><thead><tr><th>System</th><th>type</th><th class="num">attempts</th>`
    + `<th class="num">declared</th><th class="num">realised (95% CI)</th><th class="num">seekers faced</th></tr></thead><tbody>`;
  for (const x of [...by.values()].sort((p,q)=>q.n-p.n).slice(0,30)){
    const w = aarWeapon(x.system);
    html += `<tr><td>${w?`<a href="#/weapon/${w.ID}">${esc(x.system)}</a>`:esc(x.system)}</td>`
      + `<td class="dim">${esc(x.kind)}</td><td class="num">${x.n}</td>`
      + `<td class="num">${fmt.n(x.p/x.n,1)}%</td>`
      + `<td class="num">${aarPk(x.n, x.ok)}</td>`
      + `<td class="num">${x.sensors.size}</td></tr>`;
  }
  return html+`</tbody></table></div></div>`;
}

function aarMechanicsView(a){
  const rows = a.engagements||[];
  if (!rows.length) return `<div class="card"><h3>Engagement mechanics</h3>`
    + `<p class="small">This log has no scored engagements, so there is no probability chain to inspect.</p></div>`
    + aarSoftkillView(a);
  // Worked examples. Prefer engagements that were actually computed: a floored one shows the
  // clamp rather than the mechanism, which makes a poor illustration.
  const live = rows.filter(e=>!e.floored);
  const pool = live.length ? live : rows;
  const worst = pool.slice().sort((x,y)=>(x.final-x.base)-(y.final-y.base))[0];
  const fastest = (pool.filter(e=>e.los!=null).sort((x,y)=>y.los-x.los)[0])
               || (rows.filter(e=>e.los!=null).sort((x,y)=>y.los-x.los)[0]);
  let html = aarGeomScatter(rows) + aarModTable(rows);
  html += `<div class="card"><h3>Engagement chains</h3>`
    + `<p class="small">The engine's own reasoning for two engagements from this log: the one that lost the most probability between base and final, and the one fought at the highest crossing rate.`
    + (live.length && live.length<rows.length ? ` Engagements clamped at the 5% floor are excluded from these examples &mdash; they show the clamp, not the mechanism.` : '')
    + `</p>`
    + aarChainCard(worst)
    + (fastest && fastest!==worst ? aarChainCard(fastest) : '')
    + `</div>`;
  html += aarSoftkillView(a);
  return html;
}

/* ============================================================
   AAR PHASE 4 - ORBAT CROSS-REFERENCE

   The scenario ORBAT and the message log are independent features and stay that way: each
   ingests separately, each renders fully on its own, and neither requires the other. This
   tab is the only place they meet, and it is inert unless both are present.

   What the join adds that neither has alone:
     - the log knows damage points taken; the ORBAT knows each unit's DBID, and the catalog
       knows that class's DamagePoints - so damage can finally be read against capacity
     - the ORBAT knows what was in the magazines; the log knows what was fired
     - the ORBAT is the roster the losses came out of
   ============================================================ */

function aarScenUnits(){
  const s = D.scenario;
  if (!s || !Array.isArray(s.units)) return null;
  const byName = new Map();
  for (const u of s.units) if (u.name) byName.set(String(u.name).toLowerCase().trim(), u);
  return byName;
}

/* the catalog record behind an ORBAT unit, for DamagePoints and a link */
function aarScenCatalog(u){
  if (!u || u.dbid == null) return null;
  const kind = (typeof SCEN_TYPE_KIND!=='undefined' && SCEN_TYPE_KIND[u.type]) || null;
  if (!kind || !D.platforms[kind]) return null;
  const rec = D.platforms[kind].get(u.dbid);
  if (!rec) return null;
  const route = (typeof SCEN_TYPE_ROUTE!=='undefined' && SCEN_TYPE_ROUTE[u.type]) || null;
  return {rec, kind, route};
}

function aarCrossref(a){
  if (a._xref) return a._xref;
  const byName = aarScenUnits();
  if (!byName) return null;
  const e = aarEffects(a);

  const rows = [];
  let matched = 0;
  for (const u of e.units){
    const su = byName.get(u.unit.toLowerCase().trim()) || null;
    if (su) matched++;
    const cat = aarScenCatalog(su);
    const cap = cat && cat.rec.DamagePoints ? cat.rec.DamagePoints : null;
    rows.push({...u, scen:su, cat, cap,
      pct: (cap && u.dp) ? 100*u.dp/cap : null});
  }

  // expenditure: what the snapshot carried against what the log shows leaving the rail
  const carried = new Map();                    // weapon dbid -> qty in the ORBAT snapshot
  for (const su of (D.scenario.units||[])) for (const [wid,qty] of (su.inv||[]))
    carried.set(wid, (carried.get(wid)||0) + (qty||0));

  const fired = new Map();                      // weapon name -> rounds seen in the log
  const bump = (n)=> fired.set(n, (fired.get(n)||0)+1);
  for (const t of (a.terminal||[])) if (t.weapon) bump(t.weapon);
  for (const en of (a.engagements||[])) if (en.kind!=='gun' && en.weapon) { /* counted via terminal */ }

  const exp = [];
  for (const [name, n] of fired){
    const w = aarWeapon(name);
    const have = w ? (carried.get(w.ID) || 0) : 0;
    exp.push({name, w, fired:n, carried:have});
  }
  exp.sort((x,y)=>y.fired-x.fired);

  const lostNames = new Set(e.units.filter(u=>u.destroyed||u.sinking).map(u=>u.unit.toLowerCase().trim()));
  const roster = {total:(D.scenario.units||[]).length, lost:0, bySide:new Map()};
  for (const su of (D.scenario.units||[])){
    const side = su.side || 'Unknown';
    let r = roster.bySide.get(side);
    if (!r){ r={side, total:0, lost:0}; roster.bySide.set(side,r); }
    r.total++;
    if (lostNames.has(String(su.name||'').toLowerCase().trim())){ r.lost++; roster.lost++; }
  }

  a._xref = {rows, matched, total:e.units.length, exp, roster,
    scenName: (D.scenario.name || (D.scenario.meta&&D.scenario.meta.title) || 'scenario snapshot'),
    scenUnits: (D.scenario.units||[]).length};
  return a._xref;
}

function aarOrbatView(a){
  const hasScen = !!(D.scenario && Array.isArray(D.scenario.units) && D.scenario.units.length);
  if (!hasScen) return `<div class="card"><h3>ORBAT cross-reference</h3>`
    + `<p class="small">This tab compares the log against a scenario order of battle. `
    + `The two features are independent &mdash; each works on its own &mdash; but a few things can only be `
    + `worked out from both together:</p>`
    + `<ul class="aarul"><li><b>Damage against capacity.</b> The log records damage points taken; the ORBAT supplies each unit's database ID, and the catalog supplies that class's total damage points. Only with all three can "took 754 DP" become "took 140% of what it could absorb".</li>`
    + `<li><b>Expenditure against inventory.</b> The ORBAT knows what was in the magazines at the snapshot; the log knows what was fired.</li>`
    + `<li><b>Losses against the roster.</b> The ORBAT is the force the losses came out of.</li></ul>`
    + `<p class="small">Load one on the <a href="#/scenario">Scenario ORBAT</a> page and come back. The log stays loaded.</p></div>`;

  const x = aarCrossref(a);
  if (!x) return `<div class="card"><h3>ORBAT cross-reference</h3><p class="small">Could not read the loaded scenario.</p></div>`;

  const pctMatch = x.total ? 100*x.matched/x.total : 0;
  let html = `<div class="card"><h3>ORBAT cross-reference</h3>`
    + `<p class="small">Log matched against <b>${esc(String(x.scenUnits))}</b> units in the loaded scenario snapshot, by unit name. `
    + `<b>${fmt.n(x.matched)} of ${fmt.n(x.total)}</b> units mentioned in the log (${fmt.n(pctMatch,0)}%) were found in it.</p>`
    + (pctMatch < 50 ? `<div class="aarwarn">Fewer than half the log's units appear in this snapshot. `
        + `That usually means the snapshot is from a different scenario, or was taken after the units in question were already gone. `
        + `The tables below only cover the units that matched.</div>` : '');

  // --- damage against capacity: the DamagePoints denominator ---
  const dmg = x.rows.filter(r=>r.cap && r.dp).sort((p,q)=>q.pct-p.pct);
  if (dmg.length){
    html += `<div class="aartier">Damage against capacity<span>${fmt.n(dmg.length)}</span></div>`
      + `<p class="small">Damage points taken against the class total from the database. Over 100% is ordnance spent on a unit that was already finished.</p>`
      + `<div class="aarftw"><table class="list"><thead><tr><th>Unit</th><th>class</th><th class="num">DP taken</th>`
      + `<th class="num">class DP</th><th class="num">of capacity</th><th class="num">impacts</th><th>outcome</th></tr></thead><tbody>`;
    for (const r of dmg.slice(0,60)){
      const c=r.cat;
      html += `<tr><td>${esc(r.unit)}</td>`
        + `<td>${c&&c.route?`<a href="#/${c.route}/${c.rec.ID}">${esc(c.rec.Name)}</a>`:'<span class="dim">&mdash;</span>'}</td>`
        + `<td class="num">${fmt.n(r.dp,1)}</td><td class="num">${fmt.n(r.cap)}</td>`
        + `<td class="num ${r.pct>100?'aarbadn':''}"><b>${fmt.n(r.pct,0)}%</b></td>`
        + `<td class="num">${r.impacts.length}</td><td>${esc(r.outcome)}</td></tr>`;
    }
    html += `</tbody></table></div>`;
  } else {
    html += `<div class="aarnote">No unit in this log both took recorded damage and resolved to a scenario unit with a catalog class, so damage cannot be read against capacity here.</div>`;
  }
  html += `</div>`;

  // --- expenditure against what the snapshot carried ---
  const exp = x.exp.filter(r=>r.fired>0);
  if (exp.length){
    html += `<div class="card"><h3>Expenditure against inventory</h3>`
      + `<p class="small">Rounds seen reaching an endgame in the log, against the quantity of that weapon held across the whole snapshot. `
      + `The ORBAT is a <b>point in time</b>: if it was taken mid-battle the remaining column is what was left at that moment, not what the force started with.</p>`
      + `<div class="aarftw"><table class="list"><thead><tr><th>Weapon</th><th class="num">seen in log</th>`
      + `<th class="num">held in snapshot</th><th class="num">ratio</th></tr></thead><tbody>`;
    for (const r of exp.slice(0,40)){
      const ratio = r.carried ? 100*r.fired/r.carried : null;
      html += `<tr><td>${r.w?`<a href="#/weapon/${r.w.ID}">${esc(r.name)}</a>`:esc(r.name)}</td>`
        + `<td class="num">${fmt.n(r.fired)}</td>`
        + `<td class="num">${r.carried?fmt.n(r.carried):'<span class="dim">not carried</span>'}</td>`
        + `<td class="num">${ratio==null?'<span class="dim">&mdash;</span>':fmt.n(ratio,0)+'%'}</td></tr>`;
    }
    html += `</tbody></table></div></div>`;
  }

  // --- losses against the roster ---
  if (x.roster.total){
    const sides=[...x.roster.bySide.values()].filter(r=>r.total).sort((p,q)=>q.lost-p.lost);
    const max=Math.max(1,...sides.map(r=>r.total));
    html += `<div class="card"><h3>Losses against the roster</h3>`
      + `<p class="small">${fmt.n(x.roster.lost)} of the snapshot's ${fmt.n(x.roster.total)} units appear in this log as destroyed or sinking. `
      + `Units lost before the snapshot was taken will not be counted.</p>`;
    for (const r of sides){
      html += `<div class="aarbar"><span class="aarbl">${esc(r.side)}</span>`
        + `<span class="aarbt"><i style="width:${(r.total/max*100).toFixed(1)}%"></i></span>`
        + `<span class="aarbn">${fmt.n(r.lost)}/${fmt.n(r.total)}</span>`
        + `<span class="aarbx">${r.total?fmt.n(100*r.lost/r.total,0):0}% lost</span></div>`;
    }
    html += `</div>`;
  }
  return html;
}

function aarExportXrefCSV(){
  const a=D.aar; if(!a) return;
  const x=aarCrossref(a); if(!x) return;
  const rows=x.rows.map(r=>({
    unit:r.unit, in_orbat:r.scen?1:0, dbid:r.scen?r.scen.dbid:'', class:r.cat?r.cat.rec.Name:'',
    side:r.scen?r.scen.side:'', group:r.scen?r.scen.group:'',
    dp_taken:r.dp||'', class_damage_points:r.cap||'', pct_of_capacity:r.pct==null?'':Math.round(r.pct),
    impacts:r.impacts.length, effective:r.tracked?r.effective:'', outcome:r.outcome, cause:r.cause||'',
  }));
  aarDownload(aarStem()+'_orbat_xref.csv',
    aarCSV(rows,['unit','in_orbat','dbid','class','side','group','dp_taken','class_damage_points',
                 'pct_of_capacity','impacts','effective','outcome','cause']), 'text/csv');
}

/* ============================================================
   AAR PHASE 5 - LOSSES & EFFECTS
   Who killed what, what killed whom, what the losses actually cost, and how much of the
   ordnance was wasted on targets that were already finished.

   The overkill measure rests on one observation: CMO stops emitting damage records once a
   unit is dead or sinking. So an impact with no damage record beside it is a round that
   changed nothing. That needs no database lookup - the log says it on its own.
   ============================================================ */

const AAR_EFFECT_WIN = 3;   // seconds either side of an impact to look for its damage record

function aarEffects(a){
  if (a._effects) return a._effects;

  const dmgAt = new Map();                    // "unit sec" -> damage happened for that unit then
  const byUnit = new Map();
  const unit = u => { let x=byUnit.get(u); if(!x){ x={unit:u, dp:0, dpEvents:0, destroyed:false,
      sinking:false, cause:null, comps:0, impacts:[], effective:0}; byUnit.set(u,x); } return x; };

  for (const d of (a.damage||[])){
    const u = unit(d.unit);
    const k = d.unit + ' ' + Math.floor(d.t/1000);
    if (d.kind === 'dp'){
      u.dp += d.dp || 0; u.dpEvents++;
      dmgAt.set(k, true);
    } else if (d.kind === 'component-destroyed' || d.kind === 'component-damaged'){
      u.comps++; dmgAt.set(k, true);          // a component event still proves effect
    } else if (d.kind === 'destroyed'){ u.destroyed = true; if(!u.cause) u.cause='enemy action';
    } else if (d.kind === 'sinking'){ u.sinking = true; if(!u.cause) u.cause='enemy action';
    } else if (d.kind === 'lost'){ u.destroyed = true; u.cause = d.cause; }
  }

  for (const t of (a.terminal||[])){
    if (t.result !== 'HIT' || !t.target) continue;
    const u = unit(t.target);
    const sec = Math.floor(t.t/1000);
    let eff = false;
    for (let d=-AAR_EFFECT_WIN; d<=AAR_EFFECT_WIN && !eff; d++)
      if (dmgAt.has(t.target + ' ' + (sec+d))) eff = true;
    u.impacts.push({weapon:t.weapon, t:t.t, ts:t.ts, effective:eff});
    if (eff) u.effective++;
  }

  const units = [...byUnit.values()].filter(u => u.impacts.length || u.destroyed || u.sinking || u.dp);
  for (const u of units){
    // A unit with no damage record ANYWHERE in the log tells us nothing about whether its
    // impacts did anything - damage logging may simply be off. Those impacts are UNKNOWN,
    // not wasted. Calling them wasted would manufacture an overkill finding out of a
    // logging setting, which is the single easiest way for this page to lie.
    u.tracked = (u.dpEvents > 0 || u.comps > 0);
    u.wasted  = u.tracked ? u.impacts.length - u.effective : 0;
    u.unknown = u.tracked ? 0 : u.impacts.length;
    u.outcome = u.destroyed ? (u.cause && u.cause!=='enemy action' ? u.cause : 'destroyed')
              : u.sinking ? 'sinking' : (u.dp||u.comps ? 'damaged' : u.impacts.length ? 'effect unknown' : 'no effect');
  }

  const byWeapon = new Map();
  for (const u of units) for (const i of u.impacts){
    let w = byWeapon.get(i.weapon);
    if (!w){ w = {weapon:i.weapon, impacts:0, effective:0, units:new Set(), kills:new Set()}; byWeapon.set(i.weapon,w); }
    w.impacts++; if (i.effective) w.effective++; if (!u.tracked) w.unknown=(w.unknown||0)+1;
    w.units.add(u.unit); if (u.destroyed || u.sinking) w.kills.add(u.unit);
  }

  const tracked = units.filter(u=>u.tracked);
  const totImp = tracked.reduce((s,u)=>s+u.impacts.length,0);   // only units whose damage IS logged
  const totEff = tracked.reduce((s,u)=>s+u.effective,0);
  const totUnknown = units.reduce((s,u)=>s+u.unknown,0);
  const allImp = units.reduce((s,u)=>s+u.impacts.length,0);
  const causes = new Map();
  for (const u of units) if (u.destroyed || u.sinking){
    const c = u.cause || 'enemy action';
    causes.set(c, (causes.get(c)||0)+1);
  }
  a._effects = {units, tracked, byWeapon:[...byWeapon.values()], totImp, totEff,
    wasted: totImp-totEff, totUnknown, allImp, causes};
  return a._effects;
}

function aarLossesView(a){
  const e = aarEffects(a);
  if (!e.units.length) return `<div class="card"><h3>Losses &amp; effects</h3>`
    + `<p class="small">No impacts, damage records or losses in this log.</p></div>`;

  let html = '';

  if (e.causes.size){
    const rows=[...e.causes.entries()].sort((x,y)=>y[1]-x[1]);
    const tot=rows.reduce((s,r)=>s+r[1],0), max=rows[0][1];
    const combat=e.causes.get('enemy action')||0;
    html += `<div class="card"><h3>Losses by cause</h3>`
      + `<p class="small">${fmt.n(tot)} unit${tot===1?'':'s'} lost. `
      + (tot-combat ? `<b>${fmt.n(tot-combat)} (${fmt.n(100*(tot-combat)/tot,0)}%) were not to enemy fire.</b>` : `All to enemy fire.`)
      + `</p>`;
    for (const [c,n] of rows)
      html += `<div class="aarbar"><span class="aarbl ${c==='enemy action'?'':'miss'}">${esc(c)}</span>`
        + `<span class="aarbt"><i style="width:${(n/max*100).toFixed(1)}%"></i></span><span class="aarbn">${fmt.n(n)}</span></div>`;
    html += `</div>`;
  }

  if (e.allImp){
    const pct = e.totImp ? 100*e.wasted/e.totImp : 0;
    const hit = e.units.filter(u=>u.impacts.length).sort((x,y)=>y.impacts.length-x.impacts.length);
    html += `<div class="card"><h3>Ordnance effect and overkill</h3>`;
    if (!e.totImp){
      html += `<div class="aarwarn"><b>Effect cannot be measured in this log.</b> It contains `
        + `${fmt.n(e.allImp)} impact${e.allImp===1?'':'s'} but no damage records for any of the units struck, `
        + `so there is no way to tell a round that did nothing from a round whose effect simply was not written down. `
        + `Turn on <b>Weapon Damage</b> and <b>Unit Damage</b> in CMO's Message Log options and the measure becomes available.</div>`;
    } else {
      html += `<p class="small">An impact counts as <b>effective</b> when a damage record for that unit appears within ${AAR_EFFECT_WIN}s of it. `
        + `The engine stops recording damage once a unit is dead or sinking, so impacts with no damage beside them are rounds that changed nothing. `
        + `Only units whose damage is actually logged are counted${e.totUnknown?`; ${fmt.n(e.totUnknown)} further impact${e.totUnknown===1?'':'s'} struck units with no damage record at all and are shown as <i>effect unknown</i>`:''}.</p>`
        + `<div class="aarkpis">`
        + `<div class="aarkpi"><div class="aarkv">${fmt.n(e.totImp)}</div><div class="aarkl">measurable impacts</div></div>`
        + `<div class="aarkpi"><div class="aarkv">${fmt.n(e.totEff)}</div><div class="aarkl">did damage</div></div>`
        + `<div class="aarkpi"><div class="aarkv aarbadn">${fmt.n(e.wasted)}</div><div class="aarkl">changed nothing</div>`
        + `<div class="aarks">${fmt.n(pct,0)}% of measurable impacts</div></div>`
        + (e.totUnknown?`<div class="aarkpi"><div class="aarkv">${fmt.n(e.totUnknown)}</div><div class="aarkl">effect unknown</div><div class="aarks">unit never logged damage</div></div>`:'')
        + `</div>`;
    }
    html += ``
      + `<div class="aarftw"><table class="list aarwt"><thead><tr><th>Unit</th><th class="num">impacts</th>`
      + `<th class="num">effective</th><th class="num">wasted</th><th class="num">total DP</th><th>outcome</th></tr></thead><tbody>`;
    for (const u of hit.slice(0,60)){
      const id='ae'+u.unit.replace(/[^a-z0-9]/gi,'');
      const w=new Map(); for(const i of u.impacts) w.set(i.weapon,(w.get(i.weapon)||0)+1);
      html += `<tr class="aarwrow" onclick="aarTog('${id}')"><td><span class="aarchev" id="${id}c">&#9656;</span> ${esc(u.unit)}</td>`
        + `<td class="num">${u.impacts.length}</td><td class="num">${u.effective}</td>`
        + `<td class="num">${u.tracked?(u.wasted?`<span class="aarbadn">${u.wasted}</span>`:'0'):'<span class="dim">?</span>'}</td>`
        + `<td class="num">${u.dp?fmt.n(u.dp,1):'&mdash;'}</td>`
        + `<td>${esc(u.outcome)}${u.cause&&u.cause!=='enemy action'?` <span class="aarflag warn">${esc(u.cause)}</span>`:''}</td></tr>`
        + `<tr class="aarsub" id="${id}" hidden><td colspan="6"><table class="aarsubt"><tbody>`
        + [...w.entries()].sort((x,y)=>y[1]-x[1]).map(([wn,c])=>{
            const wr=aarWeapon(wn);
            return `<tr><td>${wr?`<a href="#/weapon/${wr.ID}">${esc(wn)}</a>`:esc(wn)}</td><td class="num">${c} impact${c===1?'':'s'}</td></tr>`;
          }).join('')
        + `</tbody></table></td></tr>`;
    }
    if (hit.length>60) html += `<tr><td colspan="6" class="dim">+${fmt.n(hit.length-60)} more units</td></tr>`;
    html += `</tbody></table></div></div>`;

    const ws = e.byWeapon.slice().sort((x,y)=>y.impacts-x.impacts);
    html += `<div class="card"><h3>Weapon effect</h3>`
      + `<p class="small">The same measure from the firing end: of the rounds that struck, how many actually did something, and how many units they finished.</p>`
      + `<div class="aarftw"><table class="list"><thead><tr><th>Weapon</th><th class="num">impacts</th>`
      + `<th class="num">effective</th><th class="num">wasted</th><th class="num">unknown</th>`
      + `<th class="num">units hit</th><th class="num">units lost</th></tr></thead><tbody>`;
    for (const w of ws.slice(0,40)){
      const wr=aarWeapon(w.weapon);
      html += `<tr><td>${wr?`<a href="#/weapon/${wr.ID}">${esc(w.weapon)}</a>`:esc(w.weapon)}</td>`
        + `<td class="num">${w.impacts}</td><td class="num">${w.effective}</td>`
        + `<td class="num">${(w.impacts-(w.unknown||0)-w.effective)?`<span class="aarbadn">${w.impacts-(w.unknown||0)-w.effective}</span>`:'0'}</td>`
        + `<td class="num dim">${w.unknown||0}</td>`
        + `<td class="num">${w.units.size}</td><td class="num">${w.kills.size}</td></tr>`;
    }
    html += `</tbody></table></div></div>`;
  }
  return html;
}

function aarExportEffectsCSV(){
  const a=D.aar; if(!a) return;
  const e=aarEffects(a);
  const rows=e.units.map(u=>({
    unit:u.unit, impacts:u.impacts.length, damage_logged:u.tracked?1:0,
    effective:u.tracked?u.effective:'', wasted:u.tracked?u.wasted:'',
    total_dp:u.dp||'', damage_events:u.dpEvents, component_events:u.comps,
    outcome:u.outcome, cause:u.cause||'',
    weapons:[...new Set(u.impacts.map(i=>i.weapon))].join('; '),
  }));
  aarDownload(aarStem()+'_effects.csv',
    aarCSV(rows,['unit','impacts','damage_logged','effective','wasted','total_dp','damage_events','component_events','outcome','cause','weapons']),
    'text/csv');
}
