           commcap:{},commlat:{},commqual:{},commtype:{}};
  const bump=(o,k)=>{ if(k==null||k===''||k===0) return; o[k]=(o[k]||0)+1; };
  for (const [,s] of D.sensor){ for (const c of s.caps) bump(u.cap,c); for (const c of s.codes) bump(u.scode,c); bump(u.stype,s.Type); }
  for (const [,w] of D.weapon){ for (const c of w.codes) bump(u.wcode,c); for (const t of w.targets) bump(u.wtarget,t); bump(u.wtype,w.Type); for (const g of weaponGuidanceTags(w)) bump(u.guid,g);
    for (const cid of (w.comms||[])){ const c=D.comm.get(cid); if(c) bump(u.commtype,c.Type); } }
  // platform attributes / feature codes / comms
  const codeCat={Aircraft:'acode',Ship:'shcode',Submarine:'sucode',GroundUnit:'gcode'};
  for (const k of KINDS){ const cc=codeCat[k.key]; const m=D.platforms[k.key]; if(!m) continue;
    for (const [,p] of m){
      if (cc) for (const c of (p.codes||[])) bump(u[cc],c);
      bump(u.ergo,p.Ergonomics); bump(u.auto,p.AutonomousControlLevel);
      if (k.key==='Aircraft'){ bump(u.vis,p.Visibility); [p.AircraftEngineArmor,p.AircraftFuselageArmor,p.AircraftCockpitArmor].forEach(a=>bump(u.armor,a)); }
      else if (k.key==='Ship'){ [p.ArmorBelt,p.ArmorBulkheads,p.ArmorDeck,p.ArmorBridge,p.ArmorCIC,p.ArmorEngineering,p.ArmorRudder].forEach(a=>bump(u.armor,a)); }
      else bump(u.armor,p.ArmorGeneral);
      for (const cid of (p.comms||[])){ const c=D.comm.get(cid); if(c){ bump(u.commtype,c.Type); } }
    }
  }
  GUSE=u; return u;
}
const GCATS=[
  {key:'guid',   label:'Weapon guidance methods', route:'weapon', param:'g',   ids:()=>Object.keys(GUIDANCE).map(k=>({id:k,label:GUIDANCE[k]}))},
  {key:'cap',    label:'Sensor capabilities — what a sensor searches for or measures', route:'sensor', param:'cap', enum:'SensorCapability'},
  {key:'scode',  label:'Sensor features & modes', route:'sensor', param:'code', enum:'SensorCode'},
  {key:'wcode',  label:'Weapon features & guidance codes', route:'weapon', param:'feat', enum:'WeaponCode'},
  {key:'wtarget',label:'Weapon target classes', route:'weapon', param:'tg',  enum:'WeaponTarget'},
  {key:'stype',  label:'Sensor types', route:'sensor', param:'t', enum:'SensorType'},
  {key:'wtype',  label:'Weapon types', route:'weapon', param:'t', enum:'WeaponType'},
  // ---- platform attributes ----
  {key:'ergo',   label:'Ergonomics — crew-station OODA modifiers', enum:'Ergonomics', noUse:true,
    note:'A single rating that speeds up or slows down a platform’s decision loop. Negative percentages are bonuses (reacts faster); positive are penalties. Targeting is the most affected axis.'},
  {key:'auto',   label:'Autonomy — autonomous control level (unmanned platforms)', enum:'AircraftAutonomousControlLevel', noUse:true,
    note:'How independently a drone/USV/UUV operates, and — the part that decides scenarios — what it does when it loses its control signal. A jammed low-autonomy drone becomes a liability; a high-autonomy one keeps prosecuting the mission. The ladder is shared across aircraft, ships and subs (signal-loss wording differs slightly by domain).'},
  {key:'armor',  label:'Armor — protection class (RHA equivalent)', enum:'ArmorType', noUse:true,
    note:'Protection expressed as rolled-homogeneous-armor equivalent — what calibre of gunfire or fragmentation the unit shrugs off. A weapon’s penetration is checked against this; below the threshold it does little. Reactive/DU upgrades appear separately as ground-unit feature codes.'},
  {key:'vis',    label:'Cockpit visibility — front / side / rear (aircraft)', enum:'AircraftCockpitVisibility', noUse:true,
    note:'How well the crew can see out (A best → C worst per direction). Better visibility helps a crew spot and keep tally in a within-visual-range fight; a "sunk cockpit" bomber or airliner is easy to sneak up on.'},
  // ---- comms ----
  {key:'commqual',label:'Comm quality — what a link can convey', enum:'CommQuality', noUse:true,
    note:'Quality and latency together decide whether a network can support cooperative engagement — you need near-instant, AAW-or-better quality (CEC) to shoot on another unit’s track.'},
  {key:'commlat', label:'Comm latency — how fast a link moves', enum:'CommLatency', noUse:true},
  {key:'commcap', label:'Comm capability — link properties', enum:'CommCapability', noUse:true,
    note:'Properties a comm link can carry: directionality, robustness (LPI/LPD, jam-resistant, secure), radio band (the very-low bands reach submerged subs), satellite BLOS, and underwater acoustic.'},
  {key:'commtype',label:'Comm type — links, SATCOM & weapon datalinks', enum:'CommType',
    note:'The catalog of links: tactical datalinks (Link 4/11/16/22, CEC), SATCOM families, and the large block of per-weapon guidance datalinks (AEGIS, Patriot, AIM-120, Aster, TacTom, …). The individual link name is shown on each platform and weapon card; this section is the family reference.'},
  // ---- platform feature codes ----
  {key:'acode',  label:'Aircraft feature codes', enum:'AircraftCode', noUse:true,
    note:'Flight aids (fly-by-wire, terrain following, Auto-GCAS), night/targeting kit, air-to-air refueling, fuselage-structure class (sets g-limits), and signature suppression — RCSS (radar) and IRSS (infrared).'},
  {key:'shcode', label:'Ship feature codes', enum:'ShipCode', noUse:true,
    note:'Quieting (Prairie Masker, advanced quieting), seakeeping, construction-standard damage-point penalties (fragile hulls take less punishment), minesweeper hull types, and the underway-replenishment / refuel rig set (which side, how many stations, in vs out).'},
  {key:'sucode', label:'Submarine feature codes', enum:'SubmarineCode', noUse:true,
    note:'Mostly quieting and survivability: pump-jet propulsor, no-launch-transient, natural-circulation reactor, hull type and shock resistance, snorkel, Li-ion batteries.'},
  {key:'gcode',  label:'Ground-unit feature codes', enum:'GroundUnitCode', noUse:true,
    note:'Mobility (wheeled / half-track / tracked / amphibious), carriage (troop-carrying, open-topped), and armor upgrades (reactive, mesh skirting, depleted-uranium generations).'},
];
const GCAT_BY_KEY = Object.fromEntries(GCATS.map(c=>[c.key,c]));
function gEnumList(name){ const e=D.enums[name]||{}; const num=Object.keys(e).every(k=>/^-?\d+$/.test(k));
  return Object.keys(e).map(id=>({id:num?+id:id,label:e[id]})).filter(x=>x.label&&x.label!=='None'&&x.label!=='Not Applicable (N/A)'&&x.label!=='Undefined').sort((a,b)=>num?a.id-b.id:0); }
function gTerms(cat){ return cat.ids? cat.ids() : gEnumList(cat.enum); }
function glabel(cat,id){ if(cat==='guid') return GUIDANCE[id]||id; return E(ENUMOF[cat]||'',id); }
function gentry(cat,id){ return GLOSSARY[cat+':'+id]||null; }
function gtip(cat,id){ const e=gentry(cat,id); if(!e) return 'No write-up yet — click for the glossary entry'; let t=e.means||glabel(cat,id); if(t.length>170) t=t.slice(0,167)+'…'; return t; }
/* linked, tooltip-bearing chip for use on detail pages */
function gchip(cat,id,opts){ opts=opts||{}; const lbl=glabel(cat,id); if(lbl==null||lbl==='') return ''; return `<a class="chip gl${opts.on?' on':''}" href="#/glossary?sel=${cat}:${id}" data-tip="${esc(gtip(cat,id))}">${esc(opts.label||lbl)}</a>`; }
function gchips(cat,ids,opts){ return (ids||[]).map(id=>gchip(cat,id,opts)).join(''); }

function gtagHtml(e){ return e&&e.tag? `<span class="gtag ${e.tag}">${e.tag}</span>` : ''; }
function gTermBlock(cat, t, q){
  const e=gentry(cat.key,t.id);
  const n=(guse()[cat.key]||{})[t.id]||0;
  // filter
  if (q){ const hay=(t.label+' '+(e?[e.means,e.requires,e.ingame,e.src].filter(Boolean).join(' '):'')).toLowerCase(); if(!hay.includes(q)) return ''; }
  let usedLink;
  if (cat.noUse){ usedLink = n? `<span class="small" style="color:var(--text-3)">${fmt.n(n)} use${n===1?'':'s'}</span>` : `<span class="small" style="color:var(--text-3)">reference</span>`; }
  else usedLink = n? `<a class="small" href="#/${cat.route}?${cat.param}=${encodeURIComponent(t.id)}" data-tip="Show the ${n} item(s) with this">${fmt.n(n)} use${n===1?'':'s'} ›</a>` : '<span class="small" style="color:var(--text-3)">unused</span>';
  let body;
  if (e){
    body = `<div style="font-size:13px;line-height:1.5;margin-top:3px">${esc(e.means)}${e.requires?` <b>Requires:</b> ${esc(e.requires)}`:''}${e.ingame?` <b>In game:</b> ${esc(e.ingame)}`:''}</div>
      <div class="small" style="margin-top:4px;color:var(--text-3)">${gtagHtml(e)} ${esc(e.src||'')}</div>`;
  } else {
    body = `<div class="small" style="margin-top:3px;color:var(--text-3)">Description coming soon — the label is the database’s own; any bracketed note is the game’s shorthand.</div>`;
  }
  return `<div class="gterm card" id="g-${cat.key}-${t.id}" style="padding:9px 12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <div style="font-weight:600;font-size:13.5px">${esc(t.label)}</div>${usedLink}
    </div>${body}</div>`;
}
function viewGlossary(params){
  const q=(params.q||'').trim().toLowerCase();
  const sel=params.sel||'';
  const authored=Object.keys(GLOSSARY).length;
  // jump bar
  const jump=GCATS.map(c=>`<a class="chip" href="#g-cat-${c.key}">${esc(c.label.split(' — ')[0])}</a>`).join('');
  let html=`<div class="crumbs"><a href="#/">Overview</a> › Reference</div>
  <h2 class="title">Feature & guidance reference</h2>
  <div class="meta">What every sensor capability, feature code and weapon-guidance method means and does in game. Hover a chip anywhere in the dashboard for the short version, or click it to land here. Guidance methods are written up from the game manual (page-cited, ${'OBSERVED/INFERRED'}-tagged); the rest is being filled in.</div>
  <form onsubmit="setParam('q',this.gq.value.trim());return false" class="toolbar" style="margin-top:6px">
    <input name="gq" placeholder="Search features — e.g. LPI, illumination, laser, wake" value="${esc(params.q||'')}" style="min-width:340px;padding:7px 10px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)">
    <button class="cmpbtn" type="submit" style="padding:6px 12px">Search</button>${q?`<a class="cmpbtn" href="#/glossary" style="padding:6px 12px">clear</a>`:''}
  </form>
  <div class="chips" style="margin:8px 0 4px">${jump}</div>`;
  let shown=0;
  for (const cat of GCATS){
    const terms=gTerms(cat);
    const blocks=terms.map(t=>gTermBlock(cat,t,q)).filter(Boolean);
    if (!blocks.length) continue;
    shown+=blocks.length;
    const authoredN=terms.filter(t=>gentry(cat.key,t.id)).length;
    html+=`<h3 class="title" id="g-cat-${cat.key}" style="font-size:15px;margin:18px 0 6px;scroll-margin-top:12px">${esc(cat.label)}<span class="hint" style="font-weight:400;color:var(--text-3);font-size:12px"> · ${terms.length} terms${authoredN?`, ${authoredN} described`:''}</span></h3>`;
    if (cat.note && !q) html+=`<div class="small" style="color:var(--text-2);margin:0 0 8px;max-width:900px;line-height:1.5">${esc(cat.note)}</div>`;
    html+=`<div class="glist" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px">${blocks.join('')}</div>`;
  }
  if (!shown) html+=`<div class="card"><span class="small">No features match “${esc(params.q||'')}”.</span></div>`;
  // highlight + scroll to a selected term (scheduled now; runs after innerHTML is set)
  if (sel){ const anchor='g-'+sel.replace(':','-');
    setTimeout(()=>{ const el=document.getElementById(anchor); if(el){ el.scrollIntoView({block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } },30);
  }
  return html;
}
</script>
<script>
/* ============================================================
   WHAT'S NEW — database-to-database changelog
   Renders D.changelog (built by `build_dashboard.py --vs PREV.db3`).
   The delta carries only IDs; names of changed components are resolved here
   against the main embedded database, and every entry deep-links to its detail page.
   ============================================================ */

const CL_ROUTES = [
  {r:'aircraft',  label:'Aircraft',      detail:'aircraft'},
  {r:'ship',      label:'Ships',         detail:'ship'},
  {r:'sub',       label:'Submarines',    detail:'sub'},
  {r:'facility',  label:'Facilities',    detail:'facility'},
  {r:'ground',    label:'Ground units',  detail:'ground'},
  {r:'sensor',    label:'Sensors',       detail:'sensor'},
  {r:'weapon',    label:'Weapons',       detail:'weapon'},
];
const CL_LABEL = Object.fromEntries(CL_ROUTES.map(x=>[x.r,x.label]));

// enum-backed fields, so raw IDs resolve to labels
const CL_ENUMF = {
  aircraft:{Category:'AircraftCategory', Type:'AircraftType'},
  ship:{Category:'ShipCategory', Type:'ShipType'},
  sub:{Category:'SubmarineCategory', Type:'SubmarineType'},
  facility:{Category:'FacilityCategory', Type:'FacilityType'},
  ground:{Category:'GroundUnitCategory'},
  sensor:{Type:'SensorType', Role:'SensorRole', Generation:'SensorGeneration'},
  weapon:{Type:'WeaponType', Generation:'WeaponGeneration'},
};

// fields surfaced prominently; everything else that changed is a "minor data revision"
const CL_NOTABLE = {
  aircraft:new Set(['Name','Category','Type','YearCommissioned','YearDecommissioned','Hypothetical','Agility','Crew','DamagePoints','Cost','Comments']),
  ship:new Set(['Name','Category','Type','YearCommissioned','YearDecommissioned','Hypothetical','Crew','DamagePoints','Cost','Comments']),
  sub:new Set(['Name','Category','Type','YearCommissioned','YearDecommissioned','Hypothetical','MaxDepth','Crew','DamagePoints','Cost','Comments']),
  facility:new Set(['Name','Category','Type','YearCommissioned','YearDecommissioned','Hypothetical','DamagePoints','Cost','Comments']),
  ground:new Set(['Name','Category','YearCommissioned','YearDecommissioned','Hypothetical','DamagePoints','Cost','Comments']),
  sensor:new Set(['Name','Type','Role','Generation','RangeMax','AltitudeMax','MaxContactsAir','ResolutionHeight','Hypothetical','Comments']),
  weapon:new Set(['Name','Type','Generation','AirRangeMax','SurfaceRangeMax','LandRangeMax','SubsurfaceRangeMax','AirPoK','SurfacePoK','LandPoK','SubsurfacePoK','CEP','MaxFlightTime','Weight','Cost','Comments','Hypothetical']),
};

const CL_FIELD_LABEL = {
  YearCommissioned:'Year commissioned', YearDecommissioned:'Year decommissioned',
  DamagePoints:'Damage points', MaxDepth:'Max depth', MaxContactsAir:'Max air contacts',
  ResolutionHeight:'Height resolution', RangeMax:'Max range', AltitudeMax:'Max altitude',
  AirRangeMax:'Air range (max)', SurfaceRangeMax:'Surface range (max)',
  LandRangeMax:'Land range (max)', SubsurfaceRangeMax:'Subsurface range (max)',
  AirPoK:'Air PoK', SurfacePoK:'Surface PoK', LandPoK:'Land PoK', SubsurfacePoK:'Subsurface PoK',
  MaxFlightTime:'Max flight time',
};
function clFieldLabel(f){
  if (CL_FIELD_LABEL[f]) return CL_FIELD_LABEL[f];
  return f.replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase());
}
function clFmtVal(route, field, v){
  if (v==null || v==='') return '—';
  const em = CL_ENUMF[route]||{};
  if (em[field]) return esc(E(em[field], v));
  if (field==='Hypothetical' || field==='Deprecated') return v ? 'yes' : 'no';
  if (typeof v === 'string') return esc(v);
  if (/(RangeMax|RangeMin)$/.test(field) || /^Torpedo?Range/.test(field)) return fmt.nm(v);
  if (/PoK$/.test(field)) return fmt.pct(v);
  if (/(Weight|_Mass|^Mass$)/.test(field)) return fmt.kg(v);
  if (/^Cost$/.test(field)) return fmt.n(v);
  if (/^Year/.test(field)) return v ? String(v) : '—';
  if (/(Depth$|Altitude|MastHeight)/.test(field)) return fmt.mShort(v);
  return esc(fmt.n(v, 2));
}
function clFieldRow(route, f){
  return `<div class="clf"><span class="clk">${esc(clFieldLabel(f[0]))}</span>`
       + `<span class="clv old">${clFmtVal(route,f[0],f[1])}</span>`
       + `<span class="clar">→</span>`
       + `<span class="clv new">${clFmtVal(route,f[0],f[2])}</span></div>`;
}

// resolve a component id to a display chip/link by its type
function clComp(t, id){
  const link=(route,txt)=>`<a href="#/${route}/${id}">${esc(txt)}</a>`;
  let m;
  if (t==='mount'){ m=D.mount.get(id); return m? link('mount', m.Name) : '#'+id; }
  if (t==='sensor'){ m=D.sensor.get(id); return m? link('sensor', m.Name) : '#'+id; }
  if (t==='loadout'){ m=D.loadout.get(id); return m? link('loadout', m.Name) : 'Loadout #'+id; }
  if (t==='magazine'){ m=D.magazine.get(id); return m? esc(m.Name) : 'Magazine #'+id; }
  if (t==='warhead'){ m=D.warhead.get(id); return m? esc(m.Name||('Warhead #'+id)) : 'Warhead #'+id; }
  if (t==='cap' || t==='scode' || t==='wcode' || t==='wtarget'){ const c=gchip(t,id); return c || esc(String(id)); }
  return esc(String(id));
}
const CL_COMP_LABEL = {mounts:'Mounts', sensors:'Sensors', loadouts:'Loadouts', magazines:'Magazines',
  codes:'Features', targets:'Target classes', warheads:'Warheads', caps:'Capabilities'};
function clCompBlock(c){
  const one=(arr,cls,sign)=> arr.map(([id,n])=>`<span class="clc ${cls}">${sign}${clComp(c.t,id)}${n>1?' ×'+n:''}</span>`).join('');
  const parts=[];
  if (c.add && c.add.length) parts.push(one(c.add,'add','+'));
  if (c.rem && c.rem.length) parts.push(one(c.rem,'rem','−'));
  return `<div class="clcomp"><span class="clk">${esc(CL_COMP_LABEL[c.k]||c.k)}</span><span class="clcs">${parts.join('')}</span></div>`;
}

function clParts(routeKey, rec){
  const notableSet = CL_NOTABLE[routeKey] || new Set();
  const notable=[], minor=[];
  for (const f of (rec.f||[])) (notableSet.has(f[0]) ? notable : minor).push(f);
  const comps = rec.c || [];
  return {notable, minor, comps, significant: notable.length>0 || comps.length>0};
}

function clItemLink(route, id, name){ return `<a class="clname" href="#/${route}/${id}">${esc(name)}</a>`; }

function clChangedCard(routeKey, detail, rec){
  const p = clParts(routeKey, rec);
  let body = '';
  for (const f of p.notable) body += clFieldRow(routeKey, f);
  for (const c of p.comps) body += clCompBlock(c);
  if (p.minor.length){
    const names = p.minor.map(f=>esc(clFieldLabel(f[0]))).join(', ');
    body += `<div class="clminor">${p.minor.length} minor data field${p.minor.length===1?'':'s'}: ${names}</div>`;
  }
  const tag = rec.restored ? `<span class="clbadge restored">un-deprecated</span>` : '';
  return `<div class="clcard">${clItemLink(detail, rec.id, rec.n)}${tag}${body}</div>`;
}

function viewChangelog(params){
  const cl = D.changelog;
  if (!cl) return `<div class="card"><h3>What’s new</h3><p>This dashboard was built without a comparison database, so there’s no changelog. Rebuild with <code>build_dashboard.py --vs &lt;previous&gt;.db3</code> (or <code>--vs auto</code>) to add one.</p></div>`;
  const meta = cl.meta||{};
  const q = (params.q||'').trim().toLowerCase();
  const showMinor = params.minor==='1';
  const matchQ = name => !q || String(name).toLowerCase().includes(q);

  // totals
  let tAdd=0,tDep=0,tRem=0,tSig=0,tMinor=0;
  for (const {r} of CL_ROUTES){ const e=cl.entities[r]; if(!e) continue;
    tAdd+=e.added.length; tDep+=e.deprecated.length; tRem+=e.removed.length;
    for (const rec of e.changed){ if (clParts(r,rec).significant) tSig++; else tMinor++; } }

  let html = `<div class="cl">`;
  html += `<div class="clhead"><h2>What’s new</h2>`
        + `<div class="clsub">Database changes from <b>${esc(meta.from||'?')}</b> to <b>${esc(meta.to||'?')}</b></div>`
        + `<div class="clstats">`
        + `<span class="clstat add"><b>${fmt.n(tAdd)}</b> added</span>`
        + `<span class="clstat chg"><b>${fmt.n(tSig)}</b> changed</span>`
        + (tDep?`<span class="clstat dep"><b>${fmt.n(tDep)}</b> deprecated</span>`:'')
        + (tRem?`<span class="clstat rem"><b>${fmt.n(tRem)}</b> removed</span>`:'')
        + `<span class="clstat minor">${fmt.n(tMinor)} minor-only</span>`
        + `</div></div>`;

  html += `<div class="clctl">`
        + `<input placeholder="Filter by name…" value="${esc(params.q||'')}" oninput="setParam('q',this.value)">`
        + `<label class="clchk"><input type="checkbox" ${showMinor?'checked':''} onchange="setParam('minor',this.checked?'1':'')"> show entries with only minor data revisions</label>`
        + `</div>`;

  html += `<p class="clnote">Additions and changes are keyed on each entity’s stable database ID. “Removed” means an ID is gone entirely (rare — the game normally retires an entity by marking it <i>deprecated</i>, which keeps old scenarios working). Click any name to open its detail page.</p>`;

  let any=false;
  for (const {r, detail} of CL_ROUTES){
    const e = cl.entities[r]; if (!e) continue;
    const added = e.added.filter(x=>matchQ(x[1]));
    const deprecated = e.deprecated.filter(x=>matchQ(x[1]));
    const removed = e.removed.filter(x=>matchQ(x[1]));
    const changedSig = [], changedMin = [];
    for (const rec of e.changed){ if(!matchQ(rec.n)) continue; (clParts(r,rec).significant?changedSig:changedMin).push(rec); }
    const changedShown = showMinor ? changedSig.concat(changedMin) : changedSig;
    const total = added.length + deprecated.length + removed.length + changedShown.length;
    if (!total) continue;
    any=true;

    const summ = [];
    if (added.length) summ.push(`${added.length} added`);
    if (changedSig.length) summ.push(`${changedSig.length} changed`);
    if (deprecated.length) summ.push(`${deprecated.length} deprecated`);
    if (removed.length) summ.push(`${removed.length} removed`);
    const hiddenMin = changedMin.length && !showMinor ? ` <span class="clhid">(+${changedMin.length} minor-only)</span>` : '';

    html += `<details class="clsec" open><summary><span class="cltitle">${esc(CL_LABEL[r])}</span><span class="clsumm">${summ.join(' · ')}${hiddenMin}</span></summary>`;

    const chipList = (arr, cls) => `<div class="clchips">` + arr.map(([id,n])=>`<a class="clpill ${cls}" href="#/${detail}/${id}">${esc(n)}</a>`).join('') + `</div>`;
    if (added.length){ html += `<div class="clgrp"><h4 class="add">Added <span class="cln">${added.length}</span></h4>${chipList(added,'add')}</div>`; }
    if (deprecated.length){ html += `<div class="clgrp"><h4 class="dep">Newly deprecated <span class="cln">${deprecated.length}</span></h4>${chipList(deprecated,'dep')}</div>`; }
    if (removed.length){ html += `<div class="clgrp"><h4 class="rem">Removed <span class="cln">${removed.length}</span></h4>${chipList(removed,'rem')}</div>`; }
    if (changedShown.length){
      html += `<div class="clgrp"><h4 class="chg">Changed <span class="cln">${changedShown.length}</span></h4><div class="clcards">`;
      for (const rec of changedShown) html += clChangedCard(r, detail, rec);
      html += `</div></div>`;
    }
    html += `</details>`;
  }
  if (!any) html += `<div class="card"><p>No entries match “${esc(params.q||'')}”.</p></div>`;
  html += `</div>`;
  return html;
}
</script>
<script>
/* ============================================================
   SCENARIO ORBAT  (Phase A)
   Ingest a Lua-exported scenario snapshot (paste or file) and render a side-grouped
   order of battle: Side → Group → category → unit, collapsed by default.
   Runtime only — nothing is baked into the dashboard; persisted per-viewer in localStorage.
   ============================================================ */

const SCEN_KEY = 'cmo_scenario';
const MAINT_LOADOUT = 4;  // dbid 4 = "(Maintenance [Unavailable])"

const SCEN_TYPE_ROUTE = {Aircraft:'aircraft', Ship:'ship', Submarine:'sub', Facility:'facility', GroundUnit:'ground', Ground:'ground', Satellite:'satellite'};
const SCEN_TYPE_KIND  = {Aircraft:'Aircraft', Ship:'Ship', Submarine:'Submarine', Facility:'Facility', GroundUnit:'GroundUnit', Ground:'GroundUnit', Satellite:'Satellite'};

/* category buckets within a group; Installations (airfield components, bunkers) collapse by default */
const SCEN_CATS = [
  {k:'air',      label:'Aircraft',      open:true},
  {k:'ad',       label:'Air defense',   open:true},
  {k:'ship',     label:'Ships',         open:true},
  {k:'sub',      label:'Submarines',    open:true},
  {k:'ground',   label:'Ground units',  open:true},
  {k:'facility', label:'Installations', open:false},
];
const SCEN_AD_RE = /\bSAM\b|\bSA-\d|\bAAA\b|air ?defen|Gauntlet|Gainful|Grumble|Gargoyle|Gadfly|Grizzly|Gaskin|Goa|Guideline|Flap Lid|Tombstone|Clam Shell|Straight Flush|Chop Rest|Square Tie|search radar|\bEW radar|MANPADS/i;
function scenCat(u){
  const t = u.type;
  if (t==='Aircraft') return 'air';
  if (t==='Submarine') return 'sub';
  if (t==='Ship') return 'ship';
  if (SCEN_AD_RE.test(u.name||'')) return 'ad';
  if (t==='GroundUnit'||t==='Ground') return 'ground';
  return 'facility';
}

/* the export's group can be a clean name, or (older export) the whole serialized object */
function scenGroupName(g){
  if (g == null || g === '') return null;
  const s = String(g);
  if (/^group\s*\{/.test(s)){ const m = /name\s*=\s*'([^']*)'/.exec(s); return m ? m[1] : null; }
  return s;
}

function parseOrbat(text){
  let raw;
  try { raw = JSON.parse(text); }
  catch(e){ throw new Error('Not valid JSON — paste everything between the <<<ORBAT_JSON>>> markers (and only that).'); }
  const arr = Array.isArray(raw) ? raw : raw.units;
  if (!Array.isArray(arr)) throw new Error('No "units" array found in the pasted data.');
  const units = [];
  for (const u of arr){
    if (!u || u.type === 'Group' || u.dbid === 0) continue;   // skip group-container pseudo-units
    units.push({
      guid: u.guid, name: u.name || '(unnamed)', dbid: u.dbid,
      type: u.type || '', side: u.side || 'Unknown',
      group: scenGroupName(u.group), base: u.base || null,
      status: u.status || null, mission: u.mission_state || null,
      fuelstate: u.fuelstate || null, weaponstate: u.weaponstate || null,
      loadout_dbid: u.loadout_dbid, loadout_name: u.loadout_name || null,
      proficiency: u.proficiency || null, lat: u.lat, lon: u.lon,
      inv: Array.isArray(u.inv) ? u.inv : [],   // [[weaponDBID, qty], ...] from mounts + magazines
    });
  }
  if (!units.length) throw new Error('Parsed OK but found no units.');
  return { meta: (raw.meta||{}), units };
}

function ingestScenario(text, source){
  const scen = parseOrbat(text);
  scen.source = source || 'paste'; scen.ingested = new Date().toISOString();
  D.scenario = scen;
  try { localStorage.setItem(SCEN_KEY, JSON.stringify(scen)); } catch(e){ /* quota/private mode: memory only */ }
  location.hash = '#/scenario'; render();
}
function clearScenario(){ D.scenario = null; try { localStorage.removeItem(SCEN_KEY); } catch(e){} render(); }
function loadScenarioFromStore(){ try { const s = localStorage.getItem(SCEN_KEY); if (s) D.scenario = JSON.parse(s); } catch(e){ D.scenario = null; } }
function ingestFromBox(){
  const t = (document.getElementById('scenpaste')||{}).value || '';
  try { ingestScenario(t, 'paste'); }
  catch(e){ const el=document.getElementById('scenerr'); if(el){ el.textContent = e.message; el.hidden=false; } }
}
function ingestFromFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { ingestScenario(String(r.result), 'file'); }
    catch(e){ const el=document.getElementById('scenerr'); if(el){ el.textContent=e.message; el.hidden=false; } } };
  r.readAsText(f);
}
function copyScenLua(){
  try { navigator.clipboard.writeText(SCEN_LUA); const b=document.getElementById('scenluacopy'); if(b){ const t=b.textContent; b.textContent='Copied ✓'; setTimeout(()=>b.textContent=t,1500);} }
  catch(e){ /* clipboard blocked; the script is visible to select manually */ }
}

/* ---- build the tree: side → group → category → units ---- */
const SCEN_IND = 'Independent / unassigned';
function scenarioTree(scen){
  const byGuid = new Map(scen.units.map(u=>[u.guid,u]));
  const hostName = u => (u.base && byGuid.has(u.base)) ? byGuid.get(u.base).name : null;
  // a unit's group from its own group name, else inherited from its host (base), else Independent
  const bucketBase = (u, seen) => {
    if (u.group) return u.group;
    if (u.base && byGuid.has(u.base) && !(seen&&seen.has(u.base))){ const s=seen||new Set(); s.add(u.guid); return bucketBase(byGuid.get(u.base), s); }
    return SCEN_IND;
  };
  // Pass 1: base/group bucket for every unit; index each real group's LOCATION so we can rescue
  // co-located orphans (e.g. aircraft parked at a multi-facility airbase whose base doesn't resolve).
  const locKey = u => (u.lat!=null && u.lon!=null) ? (Math.round(u.lat*100)/100)+','+(Math.round(u.lon*100)/100) : null;
  const locToGroup = new Map();   // side|locKey -> group name (real groups only)
  for (const u of scen.units){
    u._host = hostName(u);
    u._grp = bucketBase(u);
    if (u._grp !== SCEN_IND){ const k=locKey(u); if (k){ const kk=u.side+'|'+k; if(!locToGroup.has(kk)) locToGroup.set(kk, u._grp); } }
  }
  // Pass 2: rescue Independent units that sit at the same spot as a real group (same side)
  for (const u of scen.units){
    if (u._grp === SCEN_IND){ const k=locKey(u); if (k){ const g=locToGroup.get(u.side+'|'+k); if (g) u._grp=g; } }
  }
  const muteRe = /civilian|nature|neutral|downed pilot/i;
  const sides = new Map();
  for (const u of scen.units){
    let side = sides.get(u.side);
    if (!side){ side = {name:u.side, muted:muteRe.test(u.side), total:0, airborne:[], groups:new Map()}; sides.set(u.side, side); }
    side.total++;
    if (scenStatusKind(u)==='airborne'){ side.airborne.push(u); continue; }   // airborne pulled into the side-level Airborne section
    let g = side.groups.get(u._grp); if(!g){ g={name:u._grp, total:0, cats:new Map()}; side.groups.set(u._grp,g); }
    g.total++;
    const c = scenCat(u);
    let arr = g.cats.get(c); if(!arr){ arr=[]; g.cats.set(c,arr); } arr.push(u);
  }
  return { sides };
}

/* ---- render helpers ---- */
function scenStatusKind(u){
  if (+u.loadout_dbid === MAINT_LOADOUT) return 'maint';
  const c = (u.status||'').toLowerCase();
  if (c.includes('airborne')||c.includes('taking off')) return 'airborne';
  if (c.includes('underway')) return 'underway';
  if (c.includes('destroy')||c.includes('sunk')||c.includes('dead')) return 'dead';
  if (c.includes('parked')||c.includes('ready')||c.includes('docked')||c.includes('mooring')) return 'ready';
  return 'other';
}
/* resolve a unit's TYPE name from the catalog by dbid (falls back to a callsign-stripped label) */
function scenTypeName(u){
  const kind = SCEN_TYPE_KIND[u.type];
  const rec = kind && D.platforms[kind] && D.platforms[kind].get(+u.dbid);
  if (rec && rec.Name) return rec.Name;
  return (u.name||'').replace(/\s*#\s*\d+\s*$/,'').trim() || ('type #'+u.dbid);
}
function scenTypeKnown(u){ const k=SCEN_TYPE_KIND[u.type]; return k && D.platforms[k] && D.platforms[k].has(+u.dbid); }
/* readiness roll-up chips for a set of units */
function scenRollChips(units){
  const c={airborne:0,underway:0,ready:0,maint:0,dead:0,other:0};
  for (const u of units) c[scenStatusKind(u)]++;
  const chip=(n,cls,lbl)=> n?`<span class="scchip ${cls}">${n} ${lbl}</span>`:'';
  return chip(c.airborne,'airborne','airborne')+chip(c.underway,'underway','underway')
       + chip(c.ready,'ready','ready')+chip(c.maint,'maint','maint')+chip(c.dead,'dead','lost');
       /* 'other' (null-status installations) intentionally not charted — not informative */
}
/* aggregate a unit list into type groups (by dbid), largest first */
function scenAggByType(units){
  const m=new Map();
  for (const u of units){ const key = u.dbid!=null?('d'+u.dbid):('n'+scenTypeName(u));
    let g=m.get(key); if(!g){ g={dbid:u.dbid, type:u.type, name:scenTypeName(u), units:[]}; m.set(key,g); } g.units.push(u); }
  return [...m.values()].sort((a,b)=> b.units.length-a.units.length || a.name.localeCompare(b.name));
}
function scenLoadoutLabel(dbid, name){
  if (dbid==null) return '<span class="scload">—</span>';
  if (+dbid===MAINT_LOADOUT) return '<span class="scmaint">⚙ maintenance</span>';
  const txt=esc(name||('loadout '+dbid)), known=D.loadout&&D.loadout.has(+dbid);
  return known ? `<a class="scload" href="#/loadout/${dbid}">${txt}</a>` : `<span class="scload">${txt}</span>`;
}
function scenHostTag(units){
  const hosts=[...new Set(units.map(u=>u._host).filter(Boolean))];
  if (!hosts.length) return '';
  return hosts.length===1 ? `<span class="schosttag">on ${esc(hosts[0])}</span>` : `<span class="schosttag">${hosts.length} bases/hosts</span>`;
}
function scenTailList(units, showFlight){
  const names=units.map(u=>{
    let n=esc(u.name);
    if (showFlight && u._grp && !/^Independent/.test(u._grp)) n+=` <span class="scflighttag">${esc(u._grp)}</span>`;
    return n;
  });
  const cap=40, extra=names.length-cap;
  return names.slice(0,cap).join(', ') + (extra>0?`, <span class="scmore">+${extra} more</span>`:'');
}
/* one row: a single unique unit (count 1) shown by its own name */
function scenSingleRow(u){
  const route=SCEN_TYPE_ROUTE[u.type];
  const nameHtml = scenTypeKnown(u) ? `<a href="#/${route}/${u.dbid}">${esc(u.name)}</a>` : `<span>${esc(u.name)}</span>`;
  const cls = scenTypeName(u)!==u.name ? `<span class="scclass">${esc(scenTypeName(u))}</span>` : '';
  const host = u._host ? `<span class="schosttag">on ${esc(u._host)}</span>` : '';
  const detail=[u.status?esc(u.status):null, (u.mission&&u.mission!=='Unassigned')?'mission: '+esc(u.mission):null,
    (u.proficiency&&u.proficiency!=='Regular')?esc(u.proficiency):null].filter(Boolean).join(' · ');
  return `<div class="scrow"><span class="scmain"><span class="scdot ${scenStatusKind(u)}"></span>${nameHtml} ${cls}${host}</span>`
    + `<span class="scright">${scenLoadoutLabel(u.loadout_dbid,u.loadout_name)}</span>`
    + (detail?`<span class="scdetail">${detail}</span>`:'')+`</div>`;
}
/* aggregated type block: "N× TypeName" → expand → loadout breakdown → tails */
function scenTypeBlock(g, showFlight){
  const route=SCEN_TYPE_ROUTE[g.type];
  const nameHtml = scenTypeKnown(g.units[0]) ? `<a href="#/${route}/${g.dbid}">${esc(g.name)}</a>` : `<span>${esc(g.name)}</span>`;
  // loadout breakdown
  const lo=new Map();
  for (const u of g.units){ const k=u.loadout_dbid==null?'none':('L'+u.loadout_dbid);
    let a=lo.get(k); if(!a){ a={dbid:u.loadout_dbid, name:u.loadout_name, units:[]}; lo.set(k,a);} a.units.push(u); }
  const loLines=[...lo.values()].sort((a,b)=>b.units.length-a.units.length).map(l=>
    `<div class="sclo"><span class="sclon">${l.units.length}×</span> ${scenLoadoutLabel(l.dbid,l.name)}`
    + `<div class="sctails">${scenTailList(l.units, showFlight)}</div></div>`).join('');
  const host = showFlight ? scenHostTag(g.units).replace('on ','from ') : scenHostTag(g.units);
  return `<details class="sctype"><summary>`
    + `<span class="sctcount">${g.units.length}×</span> <b>${nameHtml}</b>`
    + `<span class="scmeta">${esc(g.type)}${g.dbid?` · #${g.dbid}`:''}</span>${host}`
    + `<span class="scrollup">${scenRollChips(g.units)}</span></summary>${loLines}</details>`;
}
/* render a category's units: aggregate types (count>1) as blocks, uniques as single rows */
function scenCatBody(units, showFlight){
  const types=scenAggByType(units);
  return types.map(g=> g.units.length>1 ? scenTypeBlock(g, showFlight) : scenSingleRow(g.units[0])).join('');
}
/* Ordnance section: aggregate a group's magazine/mount inventory by weapon type,
   with a per-unit breakdown of how many each hull carries (user spec). */
function scenGroupUnits(g){ const a=[]; for (const arr of g.cats.values()) a.push(...arr); return a; }
function scenOrdnance(g){
  const m = new Map();   // weaponDBID -> {dbid, total, byUnit:[{name,qty}]}
  for (const u of scenGroupUnits(g)){
    for (const pair of (u.inv||[])){
      const dbid = pair[0], qty = +pair[1]||0; if (dbid==null || !qty) continue;
      let e = m.get(dbid); if(!e){ e={dbid, total:0, byUnit:[]}; m.set(dbid,e); }
      e.total += qty; e.byUnit.push({name:u.name, qty});
    }
  }
  if (!m.size) return '';
  const inv = [...m.values()].sort((a,b)=> b.total-a.total);
  const rows = inv.map(e=>{
    const w = D.weapon.get(+e.dbid);
    const nm = w ? w.Name : ('weapon #'+e.dbid);
    const link = w ? `<a href="#/weapon/${e.dbid}">${esc(nm)}</a>` : `<span>${esc(nm)}</span>`;
    e.byUnit.sort((a,b)=> b.qty-a.qty);
    const per = e.byUnit.map(x=>`<span class="scinvunit">${esc(x.name)} <b>${fmt.n(x.qty)}</b></span>`).join('');
    return `<details class="sctype"><summary><span class="sctcount">${fmt.n(e.total)}×</span> <b>${link}</b>`
      + `<span class="scmeta">${e.byUnit.length} unit${e.byUnit.length===1?'':'s'}</span></summary><div class="scinvper">${per}</div></details>`;
  }).join('');
  return `<details class="sccat"><summary><span class="sccatname">Ordnance / inventory</span><span class="sccatn">${inv.length}</span></summary><div class="sccatbody">${rows}</div></details>`;
}
/* per-side force summary: type totals by category (each chip linked to its catalog card) + readiness */
function scenSideSummary(side){
  const all=[]; for (const g of side.groups.values()) for (const arr of g.cats.values()) all.push(...arr); all.push(...(side.airborne||[]));
  const byCat=new Map();
  for (const u of all){ const c=scenCat(u); let a=byCat.get(c); if(!a){a=[];byCat.set(c,a);} a.push(u); }
  let rows='';
  for (const cat of SCEN_CATS){ const arr=byCat.get(cat.k); if(!arr||!arr.length) continue;
    const chips=scenAggByType(arr).map(t=>{
      const route=SCEN_TYPE_ROUTE[t.type], label=`${t.units.length}× ${esc(t.name)}`;
      return scenTypeKnown(t.units[0]) ? `<a class="scsumchip" href="#/${route}/${t.dbid}">${label}</a>` : `<span class="scsumchip">${label}</span>`;
    }).join('');
    rows+=`<div class="scsumrow"><span class="scsumcat">${esc(cat.label)}</span><span class="scsumchips">${chips}</span></div>`;
  }
  return `<details class="scsummary"><summary><span class="scsumtitle">Force summary</span><span class="scrollup">${scenRollChips(all)}</span></summary>${rows}</details>`;
}

function viewScenario(params){
  const scen = D.scenario;
  if (!scen) return scenIngestPanel();
  const q = (params.q||'').trim().toLowerCase();
  const tree = scenarioTree(scen);
  const matchU = u => !q || (u.name+' '+u.type+' '+scenTypeName(u)+' '+(u.loadout_name||'')+' '+(u._host||'')).toLowerCase().includes(q);
  const title = esc(scen.meta.scenario || 'Ingested scenario');
  const when = scen.ingested ? new Date(scen.ingested).toLocaleString() : '';

  let html = `<div class="scen">`;
  html += `<div class="schead"><h2>Scenario ORBAT</h2>`
    + `<div class="scsub">${title} — ${fmt.n(scen.units.length)} units${when?` · snapshot ingested ${esc(when)}`:''}</div>`
    + `<div class="scnote">Snapshot as of export. Units are grouped by side → task group → type; a row like “12× F/A-18E” expands to its loadouts and tail numbers. Click a type for its catalog page or a loadout for that exact fit.</div>`
    + `<div class="scctl"><input placeholder="Filter by type / name / loadout…" value="${esc(params.q||'')}" oninput="setParam('q',this.value)">`
    + `<button onclick="clearScenario()">Clear</button>`
    + `<button onclick="location.hash='#/scenario/ingest'">Re-ingest</button></div></div>`;

  const sides = [...tree.sides.values()].sort((a,b)=> (a.muted-b.muted) || (b.total-a.total));
  for (const side of sides){
    const groups = [...side.groups.values()].map(g=>{
      const cats = SCEN_CATS.map(cat=>({cat, arr:(g.cats.get(cat.k)||[]).filter(matchU)})).filter(x=>x.arr.length);
      return {g, cats, vis:cats.reduce((n,x)=>n+x.arr.length,0)};
    }).filter(x=>x.vis).sort((a,b)=>{
      const ai=a.g.name.startsWith('Independent'), bi=b.g.name.startsWith('Independent');
      return (ai-bi) || a.g.name.localeCompare(b.g.name);
    });
    const airborne = (side.airborne||[]).filter(matchU);
    const shown = groups.reduce((n,x)=>n+x.vis,0) + airborne.length;
    if (q && !shown) continue;
    html += `<details class="scside${side.muted?' muted':''}"${q?' open':''}><summary>`
      + `<span class="scsidename">${esc(side.name)}</span><span class="scsiden">${fmt.n(side.total)} units</span></summary>`;
    if (!q) html += scenSideSummary(side);
    if (airborne.length){
      html += `<details class="scgrp scairborne" open><summary><span class="scgrpname">✈ Airborne</span><span class="scgrpn">${airborne.length}</span></summary>`
        + `<div class="scgrpbody">` + scenCatBody(airborne, true) + `</div></details>`;
    }
    for (const {g, cats, vis} of groups){
      html += `<details class="scgrp" open><summary><span class="scgrpname">${esc(g.name)}</span><span class="scgrpn">${vis}</span></summary><div class="scgrpbody">`;
      for (const {cat, arr} of cats){
        const open = (cat.open || q) ? ' open' : '';
        html += `<details class="sccat"${open}><summary><span class="sccatname">${cat.label}</span><span class="sccatn">${arr.length}</span></summary>`
          + `<div class="sccatbody">` + scenCatBody(arr) + `</div></details>`;
      }
      if (!q) html += scenOrdnance(g);
      html += `</div></details>`;
    }
    html += `</details>`;
  }
  html += `</div>`;
  return html;
}

function scenIngestPanel(){
  const lua = (typeof SCEN_LUA==='string') ? SCEN_LUA : '';
  return `<div class="scen"><div class="schead"><h2>Scenario ORBAT</h2>`
    + `<div class="scnote">Load a scenario snapshot to see its order of battle here — every unit, grouped by side and task group, linked to its catalog page.</div></div>`
    + `<div class="card"><h3>Ingest a scenario</h3>`
    + `<ol class="scsteps"><li>In CMO, open <b>Editor ▸ Lua Script Console</b>, paste the export script below (use <b>Copy script</b>), and run it.</li>`
    + `<li>Copy everything the console prints between <code>&lt;&lt;&lt;ORBAT_JSON&gt;&gt;&gt;</code> and <code>&lt;&lt;&lt;END_ORBAT_JSON&gt;&gt;&gt;</code>.</li>`
    + `<li>Paste it below and press <b>Load</b> — or choose a saved <code>.json</code> file.</li></ol>`
    + `<details class="scluawrap"><summary>CMO export script (Lua) <button id="scenluacopy" class="scluacopy" onclick="event.preventDefault();copyScenLua()">Copy script</button></summary>`
    + `<pre class="scluapre">${esc(lua)}</pre></details>`
    + `<textarea id="scenpaste" class="scenta" placeholder="Paste the ORBAT JSON here…"></textarea>`
    + `<div class="scctl"><button class="cmpbtn" onclick="ingestFromBox()">Load</button>`
    + `<label class="scfile">or load a file<input type="file" accept=".json,.txt" onchange="ingestFromFile(this)" hidden></label></div>`
    + `<div id="scenerr" class="scerr" hidden></div></div></div>`;
}

/* the export script, shown/copyable on the ingest page (String.raw keeps Lua backslashes intact) */
const SCEN_LUA = String.raw`--[[ CMO Scenario ORBAT export — run in Editor > Lua Script Console with a scenario open.
     Auto-enumerates all sides, walks every unit, prints ORBAT JSON between markers.
     io.* is sandboxed in CMO, so copy everything between <<<ORBAT_JSON>>> and <<<END_ORBAT_JSON>>>
     and paste it into the dashboard's Ingest box. Every read is pcall-guarded. --]]

local function raw(fn) local ok,v = pcall(fn); if ok then return v end; return nil end
local function S(fn) local v=raw(fn); if v==nil then return "nil" end local ok,s=pcall(function() return tostring(v) end); return ok and s or "?" end
local function jS(fn)
  local v = raw(fn); if v==nil then return "null" end
  local ok,s = pcall(function() return tostring(v) end); if not ok then return "null" end
  s = s:gsub('\\','\\\\'):gsub('"','\\"'):gsub('[\n\r\t]',' '); return '"'..s..'"'
end
local function jN(fn)
  local v = raw(fn); if type(v)=="number" then return tostring(v) end; return "null"
end

-- Inventory: weapons in a unit's mounts + magazines, summed by weapon dbid.
-- Field names vary by build, so we try several and the probe below dumps the real structure.
local function collectWpns(container, acc)
  -- Documented CMO wrappers: mounts hold .mount_weapons, magazines hold .mag_weapons,
  -- each a table of WeaponLoaded { wpn_dbid, wpn_current, wpn_maxcap, ... }.
  for _,key in ipairs({'mount_weapons','mag_weapons'}) do
    local l = raw(function() return container[key] end)
    if type(l)=='table' or type(l)=='userdata' then
      pcall(function() for _,w in pairs(l) do
        local dbid = raw(function() return w.wpn_dbid end)
        local cur  = raw(function() return w.wpn_current end)
        if type(dbid)=='number' and type(cur)=='number' and cur>0 then acc[dbid] = (acc[dbid] or 0) + cur end
      end end)
    end
  end
end
local function invOf(u)
  local acc = {}
  pcall(function() for _,m in pairs(u.mounts) do collectWpns(m, acc) end end)
  pcall(function() for _,g in pairs(u.magazines) do collectWpns(g, acc) end end)
  local p = {}
  for dbid,qty in pairs(acc) do p[#p+1] = '['..tostring(dbid)..','..tostring(qty)..']' end
  return '['..table.concat(p, ',')..']'
end
-- one-time deep structure dump so we can confirm/repair the inventory field names
local invProbed = false
local function invProbe(u)
  if invProbed then return end
  local nm = raw(function() return #u.mounts end) or 0
  local ng = raw(function() return #u.magazines end) or 0
  if nm==0 and ng==0 then return end
  invProbed = true
  print("---- INVENTORY STRUCTURE PROBE: "..S(function() return u.name end).."  (mounts="..nm..", mags="..ng..") ----")
  local function dump(obj, label)
    if obj==nil then return end
    print(label.." keys:")
    pcall(function() for k,v in pairs(obj) do
      print("  "..tostring(k).." = "..tostring(v))
      if type(v)=='table' or type(v)=='userdata' then
        local first = raw(function() return v[1] end)
        if first~=nil then pcall(function() for k2,v2 in pairs(first) do print("      ["..tostring(k).."][1] "..tostring(k2).." = "..tostring(v2)) end end) end
      end
    end end)
  end
  if nm>0 then dump(raw(function() return u.mounts[1] end), "mount[1]") end
  if ng>0 then dump(raw(function() return u.magazines[1] end), "magazine[1]") end
  print("---- END INVENTORY PROBE ----")
end

local parts, first = {}, true
local function emit(s) parts[#parts+1] = s end
emit('{"meta":{"exported":'..jS(function() return os.date("!%Y-%m-%dT%H:%M:%SZ") end)..'},"units":[')

local total = 0
for _, sObj in pairs(raw(function() return VP_GetSides() end) or {}) do
  local sname = raw(function() return sObj.name end) or tostring(sObj)
  local n = 0
  local side = raw(function() return VP_GetSide({ side = sname }) end)
  local units = side and raw(function() return side.units end)
  if units then
    for _, stub in ipairs(units) do
      local u = raw(function() return ScenEdit_GetUnit({ guid = stub.guid }) end)
      if u then
        invProbe(u)
        if not first then emit(",") end; first = false
        emit('{'
          ..'"guid":'..jS(function() return u.guid end)
          ..',"name":'..jS(function() return u.name end)
          ..',"dbid":'..jN(function() return u.dbid end)
          ..',"type":'..jS(function() return u.type end)
          ..',"side":'..jS(function() return sname end)
          ..',"group":'..jS(function() return u.group.name end)
          ..',"base":'..jS(function() return u.base.guid end)
          ..',"status":'..jS(function() return u.condition end)
          ..',"mission_state":'..jS(function() return u.unitstate end)
          ..',"fuelstate":'..jS(function() return u.fuelstate end)
          ..',"weaponstate":'..jS(function() return u.weaponstate end)
          ..',"loadout_dbid":'..jN(function() return u.loadout.dbid end)
          ..',"loadout_name":'..jS(function() return u.loadout.name end)
          ..',"proficiency":'..jS(function() return u.proficiency end)
          ..',"lat":'..jN(function() return u.latitude end)
          ..',"lon":'..jN(function() return u.longitude end)
          ..',"inv":'..invOf(u)
          ..'}')
        n = n + 1; total = total + 1
      end
    end
  end
  print(string.format("side %-16s : %d units", sname, n))
end
emit(']}')
print("TOTAL units exported: "..total)
print("<<<ORBAT_JSON>>>")
print(table.concat(parts))
print("<<<END_ORBAT_JSON>>>")`;

<script>
/* ============================================================
   AAR — MESSAGE LOG READER  (Phase 1)
   Ingest one CMO message log (AALog.txt), parse it into typed records, and render an
   overview. Grammar per LOG_GRAMMAR.md v0.2 (100% coverage over a 5-log / 4,731-record
   corpus). One log at a time: a new ingest REPLACES the previous one. Export is how you
   keep a log — exported JSON is re-importable.
   Runtime only — nothing is baked into the dashboard; persisted per-viewer in localStorage.
   ============================================================ */

const AAR_KEY  = 'cmo_aar';
const AAR_FMT  = 'cmo-aar/1';
const AAR_FLOOR = 5;      // engine clamps final PH at 5% (LOG_GRAMMAR F8)

const AAR_SIDE = /^\[([^\]]+)\] ?([\s\S]*)$/;

/* ---------- timestamp formats ----------
   CMO writes the log in the machine's regional format, so the leading stamp differs between
   installs. The format is detected ONCE from the whole file rather than guessed per line:
   a per-line "try them all" scheme silently mis-dates ambiguous stamps. */
const AAR_MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const AAR_TS_FORMATS = [
  { key:'MDY12',  label:'M/D/YYYY h:mm:ss AM',
    re:/^(\d{1,2})\/(\d{1,2})\/(\d{4}) (\d{1,2}):(\d{2}):(\d{2}) ([AP])M - ([\s\S]*)$/,
    build:m=>{ let h=+m[4]%12; if(m[7]==='P') h+=12; return {t:Date.UTC(+m[3],+m[1]-1,+m[2],h,+m[5],+m[6]), rest:m[8]}; } },
  { key:'DMY12',  label:'D/M/YYYY h:mm:ss AM',
    re:/^(\d{1,2})\/(\d{1,2})\/(\d{4}) (\d{1,2}):(\d{2}):(\d{2}) ([AP])M - ([\s\S]*)$/,
    build:m=>{ let h=+m[4]%12; if(m[7]==='P') h+=12; return {t:Date.UTC(+m[3],+m[2]-1,+m[1],h,+m[5],+m[6]), rest:m[8]}; } },
  { key:'MDY24',  label:'M/D/YYYY HH:mm:ss',
    re:/^(\d{1,2})\/(\d{1,2})\/(\d{4}) (\d{1,2}):(\d{2}):(\d{2}) - ([\s\S]*)$/,
    build:m=>({t:Date.UTC(+m[3],+m[1]-1,+m[2],+m[4],+m[5],+m[6]), rest:m[7]}) },
  { key:'DMY24',  label:'D/M/YYYY HH:mm:ss',
    re:/^(\d{1,2})\/(\d{1,2})\/(\d{4}) (\d{1,2}):(\d{2}):(\d{2}) - ([\s\S]*)$/,
    build:m=>({t:Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]), rest:m[7]}) },
  { key:'DMMMY',  label:'DD-MMM-YY HH:mm:ss',
    re:/^(\d{1,2})-([A-Za-z]{3})-(\d{2}) (\d{1,2}):(\d{2}):(\d{2}) - ([\s\S]*)$/,
    build:m=>{ const mo=AAR_MONTHS[m[2].toLowerCase()]; if(mo==null) return null;
      const yy=+m[3], y = yy<50 ? 2000+yy : 1900+yy;
      return {t:Date.UTC(y,mo,+m[1],+m[4],+m[5],+m[6]), rest:m[7]}; } },
  { key:'DMMMY4', label:'DD-MMM-YYYY HH:mm:ss',
    re:/^(\d{1,2})-([A-Za-z]{3})-(\d{4}) (\d{1,2}):(\d{2}):(\d{2}) - ([\s\S]*)$/,
    build:m=>{ const mo=AAR_MONTHS[m[2].toLowerCase()]; if(mo==null) return null;
      return {t:Date.UTC(+m[3],mo,+m[1],+m[4],+m[5],+m[6]), rest:m[7]}; } },
  { key:'ISO',    label:'YYYY-MM-DD HH:mm:ss',
    re:/^(\d{4})-(\d{2})-(\d{2}) (\d{1,2}):(\d{2}):(\d{2}) - ([\s\S]*)$/,
    build:m=>({t:Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]), rest:m[7]}) },
];
const AAR_ANYTS = /^(?:\d{1,2}[\/-][A-Za-z0-9]{1,4}[\/-]\d{2,4}|\d{4}-\d{2}-\d{2}) \d{1,2}:\d{2}:\d{2}(?: [AP]M)? - /;

/* Decide the format from the file, and for slash dates decide M/D vs D/M by evidence:
   a value above 12 in either position settles it. If nothing settles it (a single-day log),
   fall back to M/D and say so. */
function aarDetectFormat(lines){
  const counts = new Map(); let a=0, b=0;
  const slash = /^(\d{1,2})\/(\d{1,2})\/\d{4} /;
  let sampled=0;
  for (const line of lines){
    if (!AAR_ANYTS.test(line)) continue;
    sampled++;
    for (const f of AAR_TS_FORMATS){
      if (f.key==='DMY12' || f.key==='DMY24') continue;         // resolved by evidence below
      if (f.re.test(line)){ counts.set(f.key,(counts.get(f.key)||0)+1); break; }
    }
    const sm = slash.exec(line);
    if (sm){ if (+sm[1]>12) b++; if (+sm[2]>12) a++; }
    if (sampled>20000) break;
  }
  let best=null, n=-1;
  for (const [k,v] of counts) if (v>n){ n=v; best=k; }
  if (!best) return {fmt:null, ambiguous:false, sampled};
  let ambiguous=false;
  if (best==='MDY12' || best==='MDY24'){
    if (b>a) best = best==='MDY12' ? 'DMY12' : 'DMY24';         // day-first proven
    else if (a===0 && b===0) ambiguous=true;                    // nothing above 12 anywhere
  }
  return {fmt:AAR_TS_FORMATS.find(f=>f.key===best), ambiguous, sampled};
}

/* Ordered record grammar — FIRST MATCH WINS, so order is load-bearing.
   Mirrors log_grammar_probe.py exactly; the two are cross-checked. */
const AAR_PATTERNS = [
  ['ENG_MISSILE',       /^(?<w>.+?) #(?<sn>\d+) (?<res>HIT|MISS): Weapon: .+? is attacking (?<tgt>.+?) with a base PH of (?<bph>[\d.]+)%\.(?<mods>[\s\S]*?)Final PH: (?<fph>[\d.]+)% *Result: (?<roll>\d+) - (?<r2>HIT|MISS)(?<tail>[^\n]*)/],
  ['ENG_GUN',           /^(?<gun>.+?) (?<res>HIT|MISS): Gun \(.+?\) is attacking (?<tgt>.+?) with a base-Ph of (?<bph>[\d.]+)%\.(?<mods>[\s\S]*?)Final Ph: (?<fph>[\d.]+)% *Result: (?<roll>\d+) - (?<r2>HIT|MISS)(?<tail>[^\n]*)/],
  ['FIRE_POH',          /^(?<plat>.+?) attacks with weapon: (?<w>.+?)\. Nominal PoH: (?<nom>[\d.]+)%\.(?<mods>[\s\S]*?)Final PoH at fire\/launch point: (?<fin>[\d.]+)%/],
  ['FIRE_CEP',          /^(?<plat>.+?) attacks with weapon: (?<w>.+?)\. Nominal CEP: (?<nom>[\d.]+)(?<u>m|ft|nm)\.(?<mods>[\s\S]*?)Final CEP at fire\/launch point: (?<fin>[\d.]+)(?<u2>m|ft|nm)/],
  ['SOFTKILL',          /^(?<kind>Decoy|Defensive jammer|Offensive jammer) \((?<sys>.+?); Tech: (?<tech>.+?)\) (?:from|on) (?<plat>.+?) is attempting to (?<verb>seduce|spoof|jam) sensor: (?<sensor>.+?) \(Tech: (?<stech>.+?)\)\((?:Guiding weapon|Of): (?<wpn>.+?)\)\. Final probability: (?<p>[\d.]+)%\. Result: (?<roll>\d+) - (?<r>SUCCESS|FAILURE)/],
  ['FUEL_LOSS',         /^(?<unit>.+?) has run out of fuel and crashed!/],
  ['ABANDONED',         /^(?<unit>.+?) has no functioning engines and is being abandoned/],
  ['CREW_INCAP',        /^Cockpit & crew incapacitated - aircraft is out of control!/],
  ['COMPONENT_HIT',     /^(?<comp>[A-Z][\w &]*?) hit - penetration (?<pct>[\d.]+)%/],
  ['DMG_COMP_DEGRADE',  /^(?<unit>.+?) damage report: (?<comp>.+?) has (?:been (?:lightly|moderately|heavily) damaged|suffered additional (?:light |moderate |heavy )?damage)/],
  ['TERM_NOSENSOR',     /^(?<w>.+?) #(?<sn>\d+) (?<res>MISS): Weapon: .+? has no functioning sensors/],
  ['GROUP_DISSOLVE',    /^(?<g>.+?) has no units left; dissolving/],
  ['FLIGHT_ASSEMBLED',  /^Flight (?<f>.+?) has finished assembling/],
  ['HOSTED',            /^(?<unit>.+?) was hosted in (?<where>[\s\S]+)$/],
  ['PATHEVAL',          /^(?:The unit )?(?<u>.+?) (?:will wait until path evaluation|path evaluation terminated)/],
  ['TERM',              /^(?<w>.+?) (?:#(?<sn>\d+) )?(?<res>HIT|MISS): (?<detail>(?!Weapon:|Gun \()[\s\S]*)$/],
  ['DMG_DP',            /^(?<unit>.+?) has suffered (?<type>weapon|blast|underground shock|fragmentation|fire|flooding) damage: (?<dp>[\d.]+) DPs/],
  ['DMG_COMPONENT',     /^(?<unit>.+?) damage report: (?<comp>.+?) has been destroyed[!.]/],
  ['SINKING',           /^(?<unit>.+?) is sinking!!!/],
  ['BDA_REPORT',        /^(?<by>.+?) reports BDA status change on contact: (?<c>[\s\S]+)$/],
  ['DMG_STATE',         /^(?<unit>.+?) has (?:a )?(?:severe |major |moderate |light |minor )?(?<state>flooding|fire|structural damage)/],
  ['FIRE_OUT',          /^(?<unit>.+?) has extinguished all fires/],
  ['CONTROLS_LOST',     /^(?<unit>.+?) has its flight controls knocked out/],
  ['CABIN_HIT',         /^(?<unit>.+?) suffered penetration on pressurized cabin/],
  ['REPAIR_DONE',       /^(?<unit>.+?)(?:: structural integrity fully restored!| damage report: *(?<c2>.*?) has been fully repaired\.)/],
  ['REPAIRING',         /^(?<unit>.+?) damage report: *(?<comp>.*?) is being repaired \((?<lvl>[^)]+)\)/],
  ['FIRE_WARN',         /^WARNING: (?<unit>.+?) is risking uncontrollable fires!/],
  ['REPAIR',            /^(?<unit>.+?): structural damage being repaired, now at (?<pct>[\d.]+)%/],
  ['DESTROYED',         /^(?<unit>.+?) has been destroyed!/],
  ['PENETRATION',       /^(?<pct>\d+)% penetration achieved/],
  ['NEARMISS',          /^Weapon: (?<w>.+?) #(?<sn>\d+) missed (?<tgt>.+?) by (?<d>[\d.]+)(?<u>ft|m|nm)/],
  ['CEP_UPDATE',        /^Weapon: (?<w>.+?) #(?<sn>\d+) has a (?<rate>\d+)% rate on recent GNSS updates - CEP adjusted to: (?<cep>[\d.]+)/],
  ['SEEKER_DETECT',     /^(?:.+?Seeker|Multiple sensors) on (?<w>.+?) detected new potential target (?<tgt>[\s\S]+)$/],
  ['LOCKON',            /^(?<w>.+?) has locked on to (?<tgt>[\s\S]+)$/],
  ['IMPACT',            /^Weapon: (?<w>.+?) has impacted (?<tgt>[\s\S]+)$/],
  ['WPN_NOUPDATE',      /^Weapon: (?<w>.+?) is not receiving firm target updates from parent unit/],
  ['WPN_NOREFLECT',     /^Weapon: (?<w>.+?) can no longer see reflected energy from target/],
  ['WPN_LOGIC',         /^Weapon: (?<w>.+?) (?:is running blind|overshot|has no eligible|has only one|has been redirected)/],
  ['GODSEYE',           /^GOD'S EYE (?<state>ENABLED|DISABLED)\./],
  ['AIRFIELD_SPOT_NEW', /^New aircraft spotted on (?<loc>.+?) \((?<cap>[^)]+)\) by (?<by>.+?) \(Sensor: (?<sensor>.+?)\)\./],
  ['AIRFIELD_SPOT_ID',  /^Aircraft previously spotted on (?<loc>.+?) \((?<cap>[^)]+)\) has been (?:identified|type-classified) as: (?<cls>.+?) \(recon by: (?<by>.+?) - Sensor: (?<sensor>.+?)\)\./],
  ['DOCTRINE',          /^The Unit (?<u>.+?) cannot fire against (?<tgt>.+?) with weapon (?<w>.+?)(?:\. REASON: (?<reason>[\s\S]*))?$/],
  ['CONTACT_NEW',       /^(?:NEW DELAYED CONTACT|New contact!)/],
  ['CONTACT_PROBABLE',  /^New probable (?<what>\w+) contact!/],
  ['CONTACT_ID',        /^Contact:? *(?<c>[\s\S]*?) has been (?:type-classified|classified|positively identified) as: (?<cls>[\s\S]+)$/],
  ['CONTACT_RENAME',    /^Contact:? (?<c>.+?) is now known as: (?<n>[\s\S]+)$/],
  ['CONTACT_HOSTILE',   /^Contact:? (?<c>.+?) was observed attacking a friendly unit/],
  ['CONTACT_MANUAL',    /^Contact:? (?<c>.+?) has been manually marked as hostile!/],
  ['CONTACT_ATTRIB',    /^Contact:? (?<c>.+?) is the most likely firing unit of(?<of>[\s\S]*?) and is now considered as hostile!/],
  ['CONTACT_UPDATE',    /^Updating data for contact: (?<c>.+?), based on new information by: (?<by>[\s\S]+)$/],
  ['CONTACT_LOST_PRIV', /^(?<holder>.+?): Private contact ?(?<c>[\s\S]*?) has been lost\./],
  ['CONTACT_LOST',      /^(?:(?<holder>\S+) ?:)?Contact:? ?(?<c>[\s\S]*?) has been lost\./],
  ['COMMS',             /(?:rejoined the communications network|has lost communications)/],
  ['SIDE_SWITCH',       /^Switched side to: (?<side>[\s\S]+)$/],
  ['POSTURE',           /^Side '(?<a>.+?)' is now considered (?<p>\w+) to (?<b>[\s\S]+)$/],
  ['EVENT',             /^Event: '(?<ev>.+?)' has been fired\./],
  // NOT a catch-all. It previously matched any "word: value" line and silently absorbed
