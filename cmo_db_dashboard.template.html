<script>
/* ============================================================
   THREAT RING BUILDER — air-defense coverage for a platform
   ============================================================ */
function threatPick(){ const inp=document.getElementById('threat_sel'); if(!inp) return; const hit=buildDetMap().get(inp.value.trim()); if(hit) setParam('u', hit.route+':'+hit.id); }
function threatHasRadarSam(u){
  if(!(u._wfams&&u._wfams.has('aam'))) return false;
  for(const o of sensorInstancesAll(u)) for(const [sid,s] of expandSensorGroup(o.s)) if(s.fam==='radar'&&s.RangeMax>0&&(s.caps.includes(1001)||/Air Search|Target Indicator|Fire.?Control|FCR/i.test(E('SensorRole',s.Role)))) return true;
  return false;
}
function threatDefault(){
  const ok=u=>!u.Deprecated&&!u.Hypothetical;
  const wanted=[/Pantsir|SA-22/i,/Tor[ -]|SA-15/i,/S-400|SA-21/i,/Patriot/i,/Tunguska|SA-19/i,/DDG 51|Arleigh Burke/i];
  for(const re of wanted){ for(const K of ['GroundUnit','Ship','Facility']){ const u=[...D.platforms[K].values()].find(x=>re.test(x.Name)&&ok(x)&&threatHasRadarSam(x)); if(u) return u; } }
  for(const K of ['GroundUnit','Ship','Facility']){ const u=[...D.platforms[K].values()].find(x=>ok(x)&&threatHasRadarSam(x)); if(u) return u; }
  for(const K of ['GroundUnit','Facility','Ship']){ const u=[...D.platforms[K].values()].find(x=>ok(x)&&x._wfams&&x._wfams.has('aam')); if(u) return u; }
  return [...D.platforms.GroundUnit.values()][0];
}
function threatData(u){
  const sensors=[]; const seen=new Set();
  for(const o of sensorInstancesAll(u)) for(const [sid,s] of expandSensorGroup(o.s)){ if(seen.has(sid))continue; seen.add(sid); if(s.fam==='radar'&&s.RangeMax>0) sensors.push(s); }
  const search=sensors.filter(s=>s.caps.includes(1001)||/Air Search/i.test(E('SensorRole',s.Role)));
  const fc=sensors.filter(s=>s.MaxContactsIlluminate>0||/Target Indicator|Fire.?Control|FCR|Illuminat|Continuous Tracking/i.test(E('SensorRole',s.Role)));
  const pickMax=arr=>arr.slice().sort((a,b)=>b.RangeMax-a.RangeMax)[0];
  const sams=unitWeapons(u).map(o=>o.w).filter(w=>w.AirRangeMax>0&&(w.targets.includes(1001)||w.targets.includes(1002)||w.targets.includes(1003)));
  sams.sort((a,b)=>b.AirRangeMax-a.AirRangeMax);
  return {searchR:pickMax(search), fcR:pickMax(fc), sam:sams[0], sams, radars:sensors};
}
function viewThreat(params){
  const parse=v=>{ if(!v)return null; const [r,id]=v.split(':'); const k=KIND_BY_ROUTE[r]; return k&&getUnit(k.key,+id); };
  const u=parse(params.u)||threatDefault();
  const k=KIND_BY_KEY[u.kind];
  const d=threatData(u);
  // target profile (RCS scaling of the radar rings)
  const target=parse(params.t2);
  const refDb=params.ref!=null?+params.ref:0, ref=Math.pow(10,refDb/10);
  const rcsScale = s => { if(!s) return null; if(!target) return s.RangeMax; const r=detectRadar(s,target,ref); return r? r.vals[0] : s.RangeMax; };  // head-on (front) detection
  const searchDet=rcsScale(d.searchR), fcDet=rcsScale(d.fcR);
  const samAlt=d.sam?(d.sam.TargetAltitudeMax_ASL||d.sam.TargetAltitudeMax):0;
  const effEngage = d.sam ? Math.min(d.sam.AirRangeMax, (fcDet||searchDet||d.sam.AirRangeMax)) : 0;
  // rings
  const items=[];
  if(d.searchR) items.push({label:(target?'Detects '+target.Name:'Search radar')+' — '+d.searchR.Name, range:searchDet, color:'var(--s1)', mask:0xFFFF, sub:target?'detection vs target':'detection'});
  if(d.sam) items.push({label:'SAM max range — '+d.sam.Name, range:d.sam.AirRangeMax, color:'var(--s2)', mask:0xFFFF, sub:'R-max'});
  if(d.fcR) items.push({label:'Engagement radar — '+d.fcR.Name, range:fcDet, color:'var(--s4)', mask:0xFFFF, sub:'guidance'});
  if(d.sam&&d.sam.AirRangeMin>0) items.push({label:'SAM min range (dead zone)', range:d.sam.AirRangeMin, color:'var(--text-3)', mask:0xFFFF, sub:'inner limit'});
  const legend=`<div class="legend">${items.map(i=>`<span><span class="sw" style="background:${i.color}"></span>${esc(i.sub)} · ${fmt.nm(i.range)}</span>`).join('')}</div>`;
  const st=[['Search radar',d.searchR?(target?fmt.n(searchDet)+' nm vs '+target.Name.split(' ')[0]:fmt.n(d.searchR.RangeMax)+' nm'):'none'],['Engagement radar',d.fcR?fmt.n(fcDet)+' nm':'none'],['SAM R-max',d.sam?fmt.n(d.sam.AirRangeMax)+' nm':'none'],['Effective engage',d.sam?fmt.n(effEngage,1)+' nm':'—'],['SAM ceiling',samAlt?fmt.mShort(samAlt):'—'],['Air-capable weapons',d.sams.length]];
  const samList=d.sams.slice(0,12).map(w=>`<a class="chip" href="#/weapon/${w.ID}" title="max target speed ${w.TargetSpeedMax||'?'} kt · ceiling ${fmt.mShort(w.TargetAltitudeMax_ASL||w.TargetAltitudeMax||0)}">${esc(w.Name)} · ${fmt.n(w.AirRangeMax)} nm</a>`).join('');
  const radarList=d.radars.slice().sort((a,b)=>b.RangeMax-a.RangeMax).slice(0,12).map(s=>`<a class="chip" href="#/sensor/${s.ID}">${esc(s.Name)} · ${fmt.n(s.RangeMax)} nm</a>`).join('');
  const refOpts=[['0.01 m²',-20],['0.1 m²',-10],['1 m² · default',0],['3.2 m²',5],['5 m²',7]];
  return `<div class="crumbs"><a href="#/">Overview</a> › Systems › Threat rings</div>
  <h2 class="title">Threat rings</h2><div class="meta">Concentric air-defense envelope — search-radar detection, SAM R-max, engagement-radar reach and the inner dead zone. Pick a target to shrink the radar rings to what it can actually see against that RCS.</div>
  ${detDatalist()}
  <div class="toolbar">
    <label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small">Air-defense platform</span><input id="threat_sel" list="detlist" value="${esc(u.Name+' ('+k.route+' #'+u.ID+')')}" style="min-width:300px;padding:7px 10px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)" onchange="threatPick()"></label>
    <label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small">Target aircraft (optional — RCS scaling)</span><input id="threat_tgt" list="detlist" value="${esc(target?target.Name+' ('+KIND_BY_KEY[target.kind].route+' #'+target.ID+')':'')}" placeholder="none — nominal rings" style="min-width:280px;padding:7px 10px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)" onchange="threatTgtPick()"></label>
    ${target?`<label class="chk" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="small" title="The target size the radar's rated range assumes. Lower it if you think the quoted range is against a small target; raise it for a big one. It shifts the absolute detection ring but never the ranking between targets.">Radar rated against ⓘ</span><select onchange="setParam('ref',this.value)" style="padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)">${refOpts.map(([l,v])=>`<option value="${v}"${refDb===v?' selected':''}>${l}</option>`).join('')}</select></label>`:''}
  </div>
  ${target?`<div class="note" style="margin:-2px 0 10px;max-width:1100px"><b>Radar rated against</b> = the target size the radar's published max range is assumed to hit. The engine doesn't expose it, so it's a calibration knob (default 1 m²). The detection ring is that range rescaled to <b>${esc(target.Name)}</b>'s own front-aspect RCS by the radar equation (R = R<sub>max</sub>·(σ_target/σ_rated)<sup>¼</sup>) — a small RCS shrinks the ring, a large one grows it up to the rated max. Changing this slides every detection ring together; it never changes which target is seen first.</div>`:''}
  <div class="hero"><div>
    <h2 style="font-size:17px;margin:0 0 2px"><a href="#/${k.route}/${u.ID}">${esc(u.Name)}</a>${target?` <span class="small" style="font-weight:400">vs ${esc(target.Name)}</span>`:''}</h2>
    <div class="meta">${esc([E(u.kind==='Facility'?'FacilityType':u.kind==='GroundUnit'?'GroundUnitCategory':u.kind+'Type', u.kind==='GroundUnit'?u.Category:u.Type)].filter(x=>x&&x!=='None').join(''))} · ${esc(E('OperatorCountry',u.OperatorCountry))} · ${fmt.yr(u)}</div>
    ${statTiles(st)}</div>
    <img src="${imgPath(u.kind,u.ID)}" alt="" onerror="this.style.display='none'" loading="lazy"></div>
  <div class="grid c2">
    <div class="card"><h3>Coverage rings<span class="hint">log radial scale · head-on</span></h3>${legend}${items.filter(i=>i.range>0).length?coverageRings(items.filter(i=>i.range>0),{size:420}):'<span class="small">No ranged radar or SAM on this platform.</span>'}</div>
    <div class="card"><h3>Composition</h3>
      ${samList?`<div style="font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Surface-to-air weapons</div><div class="chips tight" style="margin-bottom:12px">${samList}</div>`:'<span class="small">No air-capable weapons — this is a sensor/EW or non-SAM platform.</span>'}
      ${radarList?`<div style="font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Radars</div><div class="chips tight">${radarList}</div>`:''}
      ${d.sam?`<p class="note" style="margin-top:10px">${target?`Against <b>${esc(target.Name)}</b> the tracking radar reaches ~<b>${fmt.n(fcDet||searchDet,1)} nm</b>, so the effective engagement ring is <b>${fmt.n(effEngage,1)} nm</b> — the smaller of what it can track and how far the missile flies (R-max <b>${fmt.n(d.sam.AirRangeMax)} nm</b>). A low-RCS target can be inside missile range yet still untrackable.`:`Engagement window: <b>${fmt.n(d.sam.AirRangeMin||0,1)}</b>–<b>${fmt.n(d.sam.AirRangeMax)} nm</b>, ceiling <b>${fmt.mShort(samAlt)}</b>. Pick a target to scale the radar rings to its RCS.`}</p>`:''}
    </div>
  </div>
  <p class="note" style="max-width:1100px">Rings are the database's nominal maxima; the detection ring is scaled to the chosen target's front-aspect RCS via the radar equation (calibration reference above; see Detection matchup for the method). Real reach also depends on terrain and radar-horizon masking, jamming, and the engine's detailed radar model — treat these as clean-air planning envelopes.</p>`;
}
function threatTgtPick(){ const inp=document.getElementById('threat_tgt'); if(!inp) return; const v=inp.value.trim(); if(!v){ setParam('t2',''); return; } const hit=buildDetMap().get(v); if(hit) setParam('t2', hit.route+':'+hit.id); }
</script>
<script>
/* ============================================================
   FEATURE / CAPABILITY / GUIDANCE GLOSSARY
   - Terms are enumerated from the database (100% coverage, auto-updates per DB).
   - Authored explanations live in GLOSSARY, keyed "<cat>:<id>". They are our own
     commentary, paraphrased from the CMO manual (page-cited) — never verbatim — and
     epistemically tagged OBSERVED / INFERRED / SPECULATIVE.
   ============================================================ */
const ENUMOF = {cap:'SensorCapability', scode:'SensorCode', wcode:'WeaponCode', wtarget:'WeaponTarget', stype:'SensorType', wtype:'WeaponType', sgen:'SensorGeneration', role:'SensorRole',
  armor:'ArmorType', ergo:'Ergonomics', auto:'AircraftAutonomousControlLevel', vis:'AircraftCockpitVisibility',
  acode:'AircraftCode', shcode:'ShipCode', sucode:'SubmarineCode', gcode:'GroundUnitCode',
  commcap:'CommCapability', commlat:'CommLatency', commqual:'CommQuality', commtype:'CommType'};

const GLOSSARY = {
  /* ---- Weapon guidance methods (keys = weaponGuidanceTags / GUIDANCE) ---- */
  'guid:unguided':{means:'No guidance — the weapon follows a ballistic path after release or launch.',requires:'Nothing; accuracy comes from the delivery platform’s aim and ballistics.',ingame:'Dumb bombs, rockets and gun rounds. Hit chance depends on range, delivery profile and the platform’s fire-control quality.',tag:'OBSERVED',src:'Manual p.287'},
  'guid:ins':{means:'Inertial guidance: the weapon flies to a pre-set coordinate using only its own internal navigation, with no outside input after launch.',requires:'Target coordinates at launch.',ingame:'Fire-and-forget against fixed points. Accuracy ranges from crude (early ballistic missiles) to very precise; it cannot chase a moving target unless paired with a terminal seeker.',tag:'OBSERVED',src:'Manual p.288'},
  'guid:gnss':{means:'Inertial navigation corrected by satellite positioning (GPS/GLONASS/BeiDou) for tight accuracy against fixed coordinates; often a backup or aid to another mode.',requires:'Target coordinates at launch (and, realistically, satellite availability).',ingame:'Precise strike on fixed or surveyed locations. Example: the AGM-88E AARGM falls back to GPS + active radar if the target radar it was homing on shuts down.',tag:'OBSERVED',src:'Manual p.291; INFERRED that CMO does not model GPS jamming degradation unless a scenario sets it'},
  'guid:eo':{means:'Electro-optical guidance: the weapon homes on a visual image of the target.',requires:'Enough daylight/clarity for the seeker to see the target, and a lock (some are lock-on-before-launch).',ingame:'Ranges from crude early trackers (GBU-8 HOBOS) to imaging seekers that can even act as makeshift sensors in their own right.',tag:'OBSERVED',src:'Manual p.288'},
  'guid:ir':{means:'Infrared guidance: the weapon homes on the target’s heat signature.',requires:'Sufficient IR contrast; older seekers are aspect-limited.',ingame:'Three classes — stern-chase (must sit directly behind, e.g. AIM-9B), rear-aspect (behind but more flexible, e.g. AIM-9H), and all-aspect (any angle, off-boresight with a helmet sight, e.g. AIM-9L+).',tag:'OBSERVED',src:'Manual p.288, 294'},
  'guid:arh':{means:'Active radar homing: the missile’s own radar finds and tracks the target, going autonomous once the seeker locks.',requires:'Nothing from the shooter after the seeker is active; it can be datalinked or CEC-cued mid-course.',ingame:'Launch-and-leave — the shooter can turn cold or engage other targets. Modern datalinked active-radar missiles can be launched from long range.',tag:'OBSERVED',src:'Manual p.294'},
  'guid:sarh':{means:'Semi-active radar homing: the missile rides radar energy reflected off a target that a radar is actively “painting.” It carries no radar of its own.',requires:'The shooter (or a supporting platform) to keep its fire-control radar locked on the target for the whole flight.',ingame:'Break the lock — the shooter turns away, or the target masks behind terrain — and the missile loses control. Early SARH also ties up the shooter’s radar so it can’t search or engage anything else while guiding.',tag:'OBSERVED',src:'Manual p.288, 294'},
  'guid:tvm':{means:'Track-via-missile: the missile relays its seeker returns to a ground/ship radar that computes the intercept and commands the missile — a SARH variant used by systems such as Patriot.',requires:'The guidance radar to keep tracking both the target and the missile.',ingame:'Ties the engagement to the controlling radar much like SARH; losing that track breaks guidance.',tag:'INFERRED',src:'Standard TVM behavior; not detailed by name in the manual'},
  'guid:arm':{means:'Anti-radiation (passive) homing: the weapon homes passively on a radar’s own emissions.',requires:'The target radar to be emitting.',ingame:'A SEAD weapon — an emitter that shuts down denies a basic ARM its source. Advanced ARMs (e.g. AARGM) fall back to GPS/INS and active radar to keep going.',tag:'OBSERVED',src:'Manual p.291'},
  'guid:laser':{means:'Semi-active laser (laser-guided): the weapon homes on laser energy reflected from a target being lased by a designator.',requires:'Something to paint the target — the launching aircraft, a buddy platform, or a ground designator — with line of sight to the target through weapon impact.',ingame:'The classic laser-guided bomb; lose the designation and it misses. Loadouts needing an external lasing platform are flagged in the database (RequiresBuddyIllumination).',tag:'OBSERVED',src:'Manual p.288'},
  'guid:sonar':{means:'Torpedo terminal homing: traditional active/passive sonar guidance, or wake-homing that follows a ship’s wake.',requires:'For wire-guided runs, the guidance wire must stay intact — hard turns or speed over ~10 kt snaps it, after which the torpedo goes autonomous on its terminal seeker.',ingame:'Sonar homing is considerably easier to decoy than wake-homing.',tag:'OBSERVED',src:'Manual p.291'},
  'guid:tercom':{means:'Terrain contour matching: a cruise missile compares the ground profile it overflies against stored maps to fix its position en route.',requires:'Pre-loaded terrain/route data; works over land with usable relief.',ingame:'Flagged as the TERCOM weapon code; supports precise low-level cruise navigation to a fixed target.',tag:'INFERRED',src:'Standard TERCOM; not detailed by name in the manual'},

  /* ---- Sensor capabilities (what a sensor searches for / measures) ---- */
  'cap:1001':{means:'Air search: the sensor detects airborne targets — aircraft, helicopters and missiles.',ingame:'Contributes to the air picture; most fire-control and air-search radars carry it.',tag:'OBSERVED',src:'Manual §9.1.1 (p.281)'},
  'cap:1002':{means:'Surface search: detects ships and boats on the sea surface.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:1003':{means:'Submarine search: detects submerged submarines (sonar, MAD).',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:1004':{means:'Land search – fixed facility: detects fixed ground installations (buildings, SAM sites, radars).',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:1005':{means:'Land search – mobile unit: detects moving or relocatable ground units (vehicles, mobile launchers).',ingame:'Usually needs a moving-target capability to pull these out of ground clutter.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:1006':{means:'Periscope search: picks out submarine periscopes and masts — very small returns against sea clutter.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:1007':{means:'C-RAM: detects incoming rockets, artillery and mortar rounds.',ingame:'Cues very-short-range defences against ballistic sub-munitions.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:1011':{means:'Space search (ABM): detects targets at ballistic-missile / space altitudes.',ingame:'Needed to see and cue against ballistic-missile threats.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:1021':{means:'Mine & obstacle search: detects sea mines and underwater obstacles.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:1022':{means:'Torpedo warning: detects incoming torpedoes.',ingame:'Triggers evasion and countermeasures.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:1023':{means:'Missile approach warning: detects incoming missiles (MAWS).',ingame:'Cues last-ditch defensive maneuver and countermeasures.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:2001':{means:'Range information: the sensor can measure a contact’s range, not just its bearing.',ingame:'Sensors that measure more of range/altitude/speed/heading build a fuller, more actionable track; a bearing-only sensor can’t form a firing solution by itself.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:2002':{means:'Altitude information: the sensor can measure a contact’s altitude (a 3D sensor).',ingame:'Needed for a complete air track and for altitude-dependent engagements.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:2003':{means:'Speed information: the sensor can measure a contact’s speed.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:2004':{means:'Heading information: the sensor can measure a contact’s course/heading.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:4001':{means:'Navigation only: a radar limited to navigation — it does not detect or track combat targets.',ingame:'Purely a flying aid; contributes nothing to the tactical picture.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:4002':{means:'Ground mapping only: produces a ground map for navigation/bombing but does not track combat targets.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:4003':{means:'Terrain avoidance / following only: supports low-level flight, not target detection.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:4004':{means:'Weather only: a weather radar; no combat detection role.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:4005':{means:'Weather and navigation only: combined weather/nav radar; no combat detection role.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'cap:9001':{means:'Over-the-horizon backscatter (OTH-B): bounces HF energy off the ionosphere to see far beyond the horizon.',ingame:'Enormous detection range but imprecise — an early-warning cue, not a fire-control track.',tag:'OBSERVED',src:'Manual §9.1.1 / OTH discussion'},
  'cap:9002':{means:'Over-the-horizon surface wave (OTH-SW): follows the sea surface to detect low targets beyond the horizon.',ingame:'Long-range early warning with limited precision.',tag:'INFERRED',src:'Standard OTH-SW; not detailed by name in the manual'},
  'cap:10001':{means:'Time-Difference-of-Arrival (TDOA): passively fixes an emitter’s position from timing differences across receivers.',ingame:'How networked ESM turns bearings into a position fix.',tag:'INFERRED',src:'Standard TDOA; manual notes ESM triangulation p.284'},
  'cap:10002':{means:'Direction finding (DF): passively measures the bearing to an emitter.',ingame:'A single DF sensor gives a bearing line; multiple/ networked ESM triangulate to a fix.',tag:'OBSERVED',src:'Manual p.284'},

  /* ---- Sensor features & modes ---- */
  'scode:1001':{means:'Identification Friend or Foe (IFF): interrogates transponders to sort friendly contacts from unknown/hostile.',ingame:'Helps resolve a contact’s side quickly so you can decide to engage.',tag:'OBSERVED',src:'Manual p.283–284'},
  'scode:1002':{means:'Classification / Brilliant Weapon: the sensor can classify a contact’s type or class; on a weapon seeker it enables autonomous target acquisition.',ingame:'Turns a raw contact into a typed track; “brilliant” weapons can pick their own target.',tag:'OBSERVED',src:'Manual p.283'},
  'scode:1003':{means:'NCTR – Jet Engine Modulation: identifies an aircraft type from the radar return off its spinning engine blades.',ingame:'IDs enemy aircraft flying head-on without cooperative IFF (e.g. F-15C/APG-70).',tag:'OBSERVED',src:'Manual p.283'},
  'scode:1004':{means:'NCTR – Narrow-Beam Interleaved Search & Track (NBILST): an advanced NCTR that positively identifies aerial targets from any angle.',ingame:'Any-aspect positive ID (e.g. F-22/APG-77) — no need to be head-on.',tag:'OBSERVED',src:'Manual p.283'},
  'scode:1011':{means:'Continuous tracking capability: the sensor can hold a dedicated, continuous track on a target rather than only intermittent search hits.',ingame:'Required to keep a firm track that can support an engagement.',tag:'OBSERVED',src:'Manual p.282'},
  'scode:1012':{means:'Continuous tracking (target-tracking radar): a dedicated tracking radar variant of the above.',tag:'OBSERVED',src:'Manual p.282'},
  'scode:1021':{means:'Continuous tracking (visual): an optical sensor able to hold a continuous track on a target.',tag:'INFERRED',src:'Optical tracking; manual optical section p.284'},
  'scode:1031':{means:'Periscope search – basic: early ability to detect periscopes/masts against sea clutter.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'scode:1032':{means:'Periscope/surface search – fine range resolution + rapid scan (1980+): better clutter rejection and revisit for spotting small masts.',tag:'INFERRED',src:'Era-gated capability flag; manual sensor section'},
  'scode:1033':{means:'Periscope/surface search – advanced processing (2000+): modern processing further improves small-contact detection.',tag:'INFERRED',src:'Era-gated capability flag'},
  'scode:2001':{means:'Track-while-scan (TWS): the radar tracks multiple targets while still scanning, instead of committing to a single painted target.',ingame:'Without TWS a radar “can either guide missiles to its painted target or search for contacts, but not both.” TWS lets it do both and cue active-radar missiles on several targets.',tag:'OBSERVED',src:'Manual p.282'},
  'scode:2002':{means:'Moving Target Indicator (MTI): filters out stationary ground clutter to reveal moving targets.',ingame:'Lets a radar pull moving vehicles/aircraft out of the ground return.',tag:'OBSERVED',src:'Manual p.282–283'},
  'scode:2011':{means:'Low Probability of Intercept (LPI): the radar shapes its waveform/emissions to be hard for an enemy ESM/RWR to detect.',ingame:'Harder for passive receivers to notice the emitter and get a bearing — you can search while staying quieter.',tag:'INFERRED',src:'LPI standard; manual emission-management discussion pp.282–284'},
  'scode:2701':{means:'Night-capable optics (LLTV / NVG / CCD / searchlight): the electro-optical sensor can see in low light or darkness.',ingame:'Extends passive visual ID/tracking into night conditions.',tag:'OBSERVED',src:'Manual optical section p.284'},
  'scode:3001':{means:'Pulse-only radar: a basic radar with no doppler processing.',ingame:'Cannot reliably look down against ground clutter, but is immune to doppler-notching evasion (there is no velocity gate to hide in).',tag:'OBSERVED',src:'Manual p.283, 417'},
  'scode:3002':{means:'Pulse-Doppler, full look-down/shoot-down (LDSD): uses doppler to separate moving targets from ground clutter.',ingame:'Can detect and engage low-flying or terrain-following targets from above.',tag:'OBSERVED',src:'Manual p.282–283'},
  'scode:3003':{means:'Pulse-Doppler, limited LDSD: partial look-down/shoot-down capability against clutter.',tag:'INFERRED',src:'Graded LDSD flag; manual p.283'},
  'scode:3011':{means:'Passive Electronically Scanned Array (PESA): a phased array that steers its beam electronically from a single feed.',ingame:'Fast beam steering and (per the model) assumed frequency-agile, so jam- and notch-resistant.',tag:'OBSERVED',src:'Manual p.417'},
  'scode:3012':{means:'Active Electronically Scanned Array (AESA): a phased array of many transmit/receive modules steering the beam electronically.',ingame:'Frequency-agile (jam-resistant), makes doppler-notching “pointless,” and holds very precise tracks that are hard to break — but its strongest detection is in the center lobe, so edges are weaker.',tag:'OBSERVED',src:'Manual p.283, 417'},
  'scode:3013':{means:'Can classify ground targets (SAR): synthetic-aperture radar images the ground finely enough to classify what it sees.',ingame:'Turns a ground return into an identifiable target.',tag:'OBSERVED',src:'Manual sensor section'},
  'scode:4001':{means:'Continuous-wave illumination: the radar paints a target with a continuous beam to guide a semi-active (SARH) missile.',requires:'A continuous line of sight on the target — while illuminating, the radar cannot engage others.',ingame:'Ties up the illuminating radar for the whole SARH engagement.',tag:'OBSERVED',src:'Manual p.282'},
  'scode:4002':{means:'Interrupted continuous-wave illumination: time-shares the illuminating beam so one radar can support more than one SARH engagement.',ingame:'Eases the “one target at a time” limit of pure CW illumination.',tag:'INFERRED',src:'ICWI standard; manual illumination discussion p.282'},
  'scode:4003':{means:'Weapon fire-control radar (no CW illumination): provides the fire-control track without needing continuous-wave illumination — e.g. for active-radar or track-via-missile weapons.',ingame:'Supports engagements without tying the radar to a single painted target.',tag:'INFERRED',src:'Derived from CW/illumination model p.282'},
  'scode:5001':{means:'Frequency agile: the radar hops operating frequency.',ingame:'More resistant to noise jamming and significantly less affected by doppler-notching. All PESA/AESA radars are assumed frequency-agile.',tag:'OBSERVED',src:'Manual p.282, 417'},
  'scode:5002':{means:'Cognitive EW: adaptive, software-defined EW that senses the threat environment and changes technique on the fly.',ingame:'Represents modern reactive jamming/ECCM; strongest against fixed, known techniques.',tag:'SPECULATIVE',src:'Modern capability; not detailed in the manual'},
  'scode:6001':{means:'Generates AAW fire-control data: the sensor produces a track good enough to direct anti-air weapons.',ingame:'Marks a radar that can actually cue a SAM/AAW engagement, not just search.',tag:'INFERRED',src:'Fire-control role; manual p.282'},
  'scode:9101':{means:'Shallow-water capable (partial): the sonar still functions, with reduced performance, in littoral/shallow water.',ingame:'Less degraded than a blue-water-only sonar in the shallows.',tag:'INFERRED',src:'Littoral sonar limits discussed p.300'},
  'scode:9102':{means:'Shallow-water capable (full): the sonar is designed for effective shallow-water/littoral operation.',ingame:'Retains classification/detection where deep-water sonars struggle.',tag:'INFERRED',src:'Littoral sonar limits discussed p.300'},

  /* ---- Weapon features & guidance/employment codes ---- */
  'wcode:1001':{means:'Illuminate at launch: the launching platform must illuminate (paint) the target at the moment of launch.',requires:'Fire-control illumination at release (SARH).',tag:'OBSERVED',src:'Manual p.288'},
  'wcode:1002':{means:'Terminal illumination: the target must be illuminated during the missile’s terminal/homing phase.',requires:'The guiding radar to keep painting the target into impact (SARH).',tag:'OBSERVED',src:'Manual p.282, 288'},
  'wcode:1003':{means:'Supports buddy illumination: a platform other than the launcher can lase/illuminate the target.',ingame:'“Buddy lasing” — one unit designates while another launches or drops from farther away.',tag:'OBSERVED',src:'Manual p.289'},
  'wcode:1101':{means:'Home On Jam (HOJ): if a target jams the seeker, the missile homes on the jamming source itself.',ingame:'Turns enemy self-protection jamming into a beacon to home on.',tag:'INFERRED',src:'Standard HOJ; not named in the manual'},
  'wcode:2001':{means:'Anti-air stern chase: can only engage an air target from directly behind (earliest IR).',tag:'OBSERVED',src:'Manual p.288'},
  'wcode:2002':{means:'Anti-air rear-aspect: engages from behind, more flexibly than a stern-chase weapon.',tag:'OBSERVED',src:'Manual p.288'},
  'wcode:2003':{means:'Anti-air all-aspect: can engage an air target from any angle, not just from behind.',tag:'OBSERVED',src:'Manual p.288, 294'},
  'wcode:2004':{means:'Anti-air dogfight (high off-boresight): can be launched at large angles off the nose, cued by a helmet-mounted sight.',tag:'OBSERVED',src:'Manual p.294'},
  'wcode:2005':{means:'No diving-target modifier: the usual accuracy penalty against steeply diving targets does not apply to this weapon.',tag:'INFERRED',src:'Modeling flag; not detailed in the manual'},
  'wcode:2006':{means:'Capable vs sea-skimmer: can engage very low, sea-skimming targets such as anti-ship missiles.',ingame:'Needed to intercept pop-up, wave-top threats that other weapons miss.',tag:'OBSERVED',src:'Manual p.316'},
  'wcode:2007':{means:'ARH AAW – no HQ track required: an active-radar air-to-air missile that can be launched without a high-quality track from the shooter.',ingame:'The seeker finds the target itself — supports snap/BOL shots.',tag:'INFERRED',src:'Active-radar model p.289, 294'},
  'wcode:2009':{means:'C-RAM capable: can intercept rockets, artillery and mortar rounds.',tag:'OBSERVED',src:'Manual §9.1.1'},
  'wcode:2010':{means:'Lock-on-after-launch (LOAL), CEC-capable: fired without a precise lock, and guidable via Cooperative Engagement by a platform other than the launcher.',ingame:'A third party can hand off/guide the shot; the shooter can stay silent or turn away.',tag:'OBSERVED',src:'Manual p.58, 294, 383'},
  'wcode:2011':{means:'Flight profile – terrain following: flies low, hugging the terrain, to penetrate under radar coverage.',tag:'OBSERVED',src:'Manual p.42, 190'},
  'wcode:2012':{means:'Lock-on-after-launch (LOAL): fired without a precise lock; the seeker acquires the target after launch.',requires:'A target point/area; tight cross-range but relaxed downrange tolerance.',tag:'OBSERVED',src:'Manual p.58'},
  'wcode:2025':{means:'Launcher occupied during guidance: the launcher/illuminator is tied up guiding this weapon and cannot act elsewhere until it completes.',ingame:'Like classic SARH — one such engagement at a time.',tag:'OBSERVED',src:'Manual p.282'},
  'wcode:3001':{means:'ARM target memory: the anti-radiation missile remembers a radar’s last known position and continues to it if the emitter shuts down.',ingame:'Switching the radar off no longer fully defeats the shot.',tag:'OBSERVED',src:'Manual p.291'},
  'wcode:3003':{means:'Loiter capability: can orbit/wait over an area for a target before attacking.',tag:'INFERRED',src:'Loitering-munition behavior'},
  'wcode:3004':{means:'Loiter capability (parachute): loiters under a parachute, e.g. a sensor-fuzed submunition.',tag:'INFERRED',src:'Submunition behavior'},
  'wcode:4001':{means:'Search pattern: runs a programmed search pattern to find its target (e.g. a torpedo or loitering weapon).',tag:'INFERRED',src:'Weapon behavior flag'},
  'wcode:4002':{means:'Drive-through logic: presses on through the target area under a defined logic if it does not immediately acquire.',tag:'INFERRED',src:'Weapon behavior flag'},
  'wcode:4003':{means:'Bearing-only launch (BOL): fire a guided weapon without designating a target — designate a point/bearing where the seeker activates to hunt.',ingame:'Lets you shoot at a suspected location and let the seeker sort it out.',tag:'OBSERVED',src:'Manual p.75'},
  'wcode:4008':{means:'Depressed ballistic trajectory: a flattened, lower ballistic arc (Iskander, ATACMS) — faster to target and harder to intercept than a lofted arc.',tag:'INFERRED',src:'Trajectory flag; ballistic modeling p.287'},
  'wcode:4010':{means:'Ballistic trajectory: flies a ballistic arc (ballistic missiles, GMLRS).',tag:'OBSERVED',src:'Manual p.287'},
  'wcode:4012':{means:'Multi-stage missile: has multiple propulsion stages (e.g. a booster plus a sustainer/second stage).',tag:'INFERRED',src:'Propulsion flag'},
  'wcode:6001':{means:'Pod – terrain avoidance (land 300 ft / sea 200 ft): a targeting/navigation pod that enables terrain-avoidance flight down to the listed floor.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:6002':{means:'Pod – terrain following (land 200 ft / sea 100 ft): a pod that enables lower terrain-following flight.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:6009':{means:'Pod – day-only navigation: a navigation pod usable only in daylight.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:6010':{means:'Pod – day-only navigation/attack: a nav-and-attack pod, daylight only.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:6011':{means:'Pod – night navigation: a night-capable navigation pod.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:6012':{means:'Pod – night navigation/attack: a night nav-and-attack pod (incl. bomb/rocket delivery).',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:6021':{means:'Pod – reconnaissance, day only.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:6022':{means:'Pod – reconnaissance, night capable.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:6101':{means:'Weapon – INS navigation: navigates by inertial guidance alone (see the INS guidance method).',tag:'OBSERVED',src:'Manual p.288'},
  'wcode:6102':{means:'Weapon – INS with GNSS navigation: inertial navigation aided by satellite positioning (see INS + GNSS).',tag:'OBSERVED',src:'Manual p.291'},
  'wcode:6103':{means:'Weapon – TERCOM navigation: terrain-contour-matching cruise navigation to a fixed target.',tag:'INFERRED',src:'Standard TERCOM; not named in the manual'},
  'wcode:6111':{means:'Weapon – pre-briefed target only: can strike only a target/coordinates set before launch; no in-flight retargeting.',tag:'INFERRED',src:'Employment flag'},
  'wcode:6112':{means:'Weapon – can target specific subsystems: can aim at a chosen subsystem/aimpoint of a target rather than the whole unit.',tag:'INFERRED',src:'Employment flag'},
  'wcode:6121':{means:'Terminal maneuver – pop-up: climbs then dives onto the target in the terminal phase (top-down attack; helps defeat point defences).',tag:'INFERRED',src:'Terminal-maneuver flag'},
  'wcode:6122':{means:'Terminal maneuver – zig-zag: weaves in the terminal phase to complicate interception.',tag:'INFERRED',src:'Terminal-maneuver flag'},
  'wcode:6123':{means:'Terminal maneuver – random (advanced): unpredictable terminal jinking to defeat defences.',tag:'INFERRED',src:'Terminal-maneuver flag'},
  'wcode:6129':{means:'Re-attack capability: if it misses or fails to acquire, it can come around for another pass.',tag:'INFERRED',src:'Employment flag'},
  'wcode:6130':{means:'Weapon altitude control possible: its cruise altitude can be set by the player.',tag:'INFERRED',src:'Employment flag'},
  'wcode:6131':{means:'Attitude control – aerodynamic only: steers with aerodynamic surfaces alone (limited where the air is too thin).',tag:'INFERRED',src:'Control flag'},
  'wcode:6132':{means:'Attitude control – non-aerodynamic only: steers with thrust-vectoring/reaction control only (for exo-atmospheric flight).',tag:'INFERRED',src:'Control flag'},
  'wcode:6133':{means:'Attitude control – combined: uses both aerodynamic surfaces and reaction/thrust-vector control.',tag:'INFERRED',src:'Control flag'},
  'wcode:6140':{means:'Uses GPS: can take navigation fixes from the US GPS constellation.',tag:'INFERRED',src:'Navigation flag'},
  'wcode:6141':{means:'Uses GLONASS: can take navigation fixes from the Russian GLONASS constellation.',tag:'INFERRED',src:'Navigation flag'},
  'wcode:6142':{means:'Uses BeiDou/COMPASS: can take navigation fixes from the Chinese BeiDou constellation.',tag:'INFERRED',src:'Navigation flag'},
  'wcode:6143':{means:'Uses NavIC/IRNSS: can take navigation fixes from the Indian NavIC constellation.',tag:'INFERRED',src:'Navigation flag'},
  'wcode:6201':{means:'Weapon – has imaging seeker: carries an imaging (EO/IIR) seeker that can also help confirm the target’s identity.',tag:'INFERRED',src:'Seeker flag'},
  'wcode:6301':{means:'Mine – contact fuze: detonates on direct physical contact.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:6311':{means:'Mine – magnetic fuze, simple magnetic: triggers on a ship’s magnetic signature (basic).',tag:'INFERRED',src:'Mine fuze flag'},
  'wcode:6312':{means:'Mine – magnetic fuze, total-field magnetometer: an advanced magnetic trigger, harder to sweep.',tag:'INFERRED',src:'Mine fuze flag'},
  'wcode:6321':{means:'Mine – passive acoustic fuze, broad-band (simple): triggers on a passing ship’s radiated noise.',tag:'INFERRED',src:'Mine fuze flag'},
  'wcode:6322':{means:'Mine – passive acoustic fuze, narrow-band (advanced): a selective acoustic trigger, harder to spoof.',tag:'INFERRED',src:'Mine fuze flag'},
  'wcode:6331':{means:'Mine – pressure fuze: triggers on the pressure signature of a passing ship (very hard to sweep).',tag:'INFERRED',src:'Mine fuze flag'},
  'wcode:6341':{means:'Mine – seismic fuze: triggers on ground/seismic vibration.',tag:'INFERRED',src:'Mine fuze flag'},
  'wcode:6401':{means:'Mine – delay counter: lets a set number of ships pass before it will fire.',tag:'INFERRED',src:'Mine logic flag'},
  'wcode:6402':{means:'Mine – arming delay: waits a set time after being laid before it arms.',tag:'INFERRED',src:'Mine logic flag'},
  'wcode:6501':{means:'Mine – target discrimination / identification: distinguishes target types to fire selectively.',tag:'INFERRED',src:'Mine logic flag'},
  'wcode:6511':{means:'Mine – remote controlled: can be armed, disarmed or fired by remote command.',tag:'INFERRED',src:'Mine logic flag'},
  'wcode:7001':{means:'Warhead – single re-entry vehicle (RV): one re-entry body.',tag:'INFERRED',src:'Warhead-bus flag'},
  'wcode:7002':{means:'Warhead – multiple re-entry vehicles (MRV): several RVs that strike the same general area.',tag:'INFERRED',src:'Warhead-bus flag'},
  'wcode:7003':{means:'Warhead – multiple independent RVs (MIRV): several RVs each aimed at a separate target.',tag:'INFERRED',src:'Warhead-bus flag'},
  'wcode:7101':{means:'Fuze – impact: detonates on hitting the target.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:7102':{means:'Fuze – barometric/altimeter: detonates at a set altitude (airburst).',tag:'INFERRED',src:'Fuze flag'},
  'wcode:7103':{means:'Fuze – proximity: detonates when close to the target.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:7104':{means:'Fuze – top-down proximity: fires downward onto a target from above (e.g. NLAW, TOW Aero) to hit thin top armour.',tag:'OBSERVED',src:'Manual (label)'},
  'wcode:7110':{means:'Fuze – combination: more than one fuzing mode (e.g. impact plus proximity).',tag:'INFERRED',src:'Fuze flag'},
  'wcode:7111':{means:'Fuze – shock-factor (under-keel) optimized: detonates below a ship’s keel to maximise the whipping/shock effect.',tag:'INFERRED',src:'Fuze flag'},
  'wcode:8001':{means:'Capable vs mobile land unit: can engage moving ground targets.',tag:'INFERRED',src:'Employment flag'},
  'wcode:8002':{means:'Is a retarded munition: a high-drag bomb that slows sharply after release so the aircraft can escape a low-level toss.',tag:'OBSERVED',src:'Retarded-bomb behavior'},
  'wcode:8010':{means:'Boosted penetrator: rocket-boosted to increase impact velocity and penetration.',tag:'INFERRED',src:'Warhead flag'},
  'wcode:9001':{means:'Torpedo – straight-running: runs on a straight course with no homing.',tag:'OBSERVED',src:'Manual p.291'},
  'wcode:9002':{means:'Torpedo – wake homing: follows the target ship’s wake to the hull; considerably harder to decoy than sonar homing.',tag:'OBSERVED',src:'Manual p.291'},
