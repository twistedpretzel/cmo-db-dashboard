<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMO Database Dashboard</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e1dc; --border-2:#cfcdc6;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#8a8880;
  --accent:#2a78d6; --accent-soft:#e3eefb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#008300; --warn:#eda100; --bad:#e34948;
  --grid:#e8e7e2; --axis:#cfcdc6;
  --radius:8px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141413; --surface:#1e1e1c; --surface-2:#262624; --border:#33332f; --border-2:#45443f;
  --text:#f2f1ec; --text-2:#c3c2b7; --text-3:#8a8880;
  --accent:#3987e5; --accent-soft:#1d2a3d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2e9e2e; --s7:#9085e9; --s8:#e66767;
  --good:#2e9e2e; --warn:#c98500; --bad:#e66767;
  --grid:#2b2b28; --axis:#45443f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
#nav{background:var(--surface);border-right:1px solid var(--border);padding:14px 12px;position:sticky;top:0;height:100vh;overflow:auto}
#nav h1{font-size:15px;margin:0 0 2px;letter-spacing:.2px}
#nav .sub{font-size:11.5px;color:var(--text-3);margin-bottom:14px;font-family:var(--mono)}
#nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);margin:14px 0 4px 8px}
#nav a.item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;color:var(--text);font-size:13.5px}
#nav a.item:hover{background:var(--surface-2);text-decoration:none}
#nav a.item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
#nav a.item .n{font-size:11px;color:var(--text-3);font-family:var(--mono)}
#nav .foot{margin-top:18px;font-size:11.5px;color:var(--text-3)}
#nav .foot button{background:none;border:1px solid var(--border-2);border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--text-2)}
#main{padding:18px 26px 60px;min-width:0}
#loading{padding:60px;text-align:center;color:var(--text-2)}
.crumbs{font-size:12.5px;color:var(--text-3);margin-bottom:8px}
.crumbs a{color:var(--text-2)}
h2.title{font-size:22px;margin:0 0 2px;line-height:1.2}
.meta{color:var(--text-2);font-size:13px;margin-bottom:12px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);margin-left:6px;vertical-align:middle}
.badge.warn{background:#fff4d6;color:#7a5200;border-color:#f0d68a}
:root[data-theme="dark"] .badge.warn{background:#3a2e10;color:#f0c060;border-color:#5a4a1a}
.badge.dep{background:#fde5e5;color:#8a1f1f;border-color:#f2b8b8}
:root[data-theme="dark"] .badge.dep{background:#3a1a1a;color:#f08080;border-color:#5a2a2a}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 12px}
.toolbar input[type=search]{flex:1 1 260px;min-width:200px;padding:7px 10px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface)}
.toolbar select{padding:6px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);max-width:260px}
.toolbar label.chk{font-size:12.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:4px}
.toolbar .count{font-size:12.5px;color:var(--text-3);margin-left:auto;font-family:var(--mono)}
table.list{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table.list th,table.list td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
table.list th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);background:var(--surface-2);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0}
table.list th.sorted{color:var(--accent)}
table.list tr:hover td{background:var(--surface-2)}
table.list td.num{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
table.list td.dim{color:var(--text-3)}
.pager{display:flex;gap:6px;align-items:center;margin:10px 0;font-size:12.5px;color:var(--text-2)}
.pager button{border:1px solid var(--border-2);background:var(--surface);border-radius:6px;padding:3px 10px}
.pager button:disabled{opacity:.4;cursor:default}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.grid .full{grid-column:1/-1}
table.list td .chip{margin:1px 2px 1px 0}
table.list td .legend{flex-wrap:nowrap;white-space:nowrap;margin:0}
.chips.tight .chip{font-size:11.5px;padding:1px 6px}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .hint{font-weight:400;text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--text-3);margin-left:auto}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:13px}
.kv .k{color:var(--text-2)}
.kv .v{font-family:var(--mono);font-size:12.5px}
.kv .v.txt{font-family:var(--font);font-size:13px}
.stat-row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;min-width:110px}
.stat .l{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:18px;font-weight:600;font-family:var(--mono);margin-top:2px}
.stat .u{font-size:11px;color:var(--text-3);font-family:var(--font);font-weight:400;margin-left:3px}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;margin-bottom:8px}
.hero img{max-width:320px;max-height:200px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2);margin:6px 0 2px}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.comp-list{display:flex;flex-direction:column;gap:6px}
.comp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.comp:hover{background:var(--surface-2)}
.comp .nm{font-weight:600;font-size:13px}
.comp .sub{font-size:12px;color:var(--text-3)}
.comp .cnt{font-family:var(--mono);font-size:12px;color:var(--text-2);white-space:nowrap}
svg text{font-family:var(--font);fill:var(--text-2);font-size:11px}
svg .axis{stroke:var(--axis);stroke-width:1}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .lbl{fill:var(--text-3);font-size:10.5px}
svg .lbl-strong{fill:var(--text);font-size:11.5px;font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;z-index:50;max-width:340px;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:pre-line;display:none}
.section-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:12px 0 14px;flex-wrap:wrap}
.section-tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:7px 12px;color:var(--text-2);font-size:13px}
.section-tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.cmpbtn{border:1px solid var(--border-2);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:12.5px;color:var(--text-2)}
.cmpbtn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
#tray{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:40;min-width:260px;max-width:380px;font-size:12.5px}
#tray .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
#tray .row .sw{width:9px;height:9px;border-radius:2px;flex:none}
#tray .row .x{cursor:pointer;color:var(--text-3)}
#tray .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tray .actions{display:flex;gap:6px;margin-top:6px}
#tray .actions button{flex:1;border:1px solid var(--border-2);border-radius:6px;background:var(--surface-2);padding:5px}
#tray .actions button.primary{background:var(--accent);color:#fff;border-color:transparent}
.cmp-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:13px}
.cmp-table th,.cmp-table td{padding:6px 9px;border-bottom:1px solid var(--border);vertical-align:top}
.cmp-table th{text-align:left;background:var(--surface-2);font-size:12px}
.cmp-table th.col{border-top:3px solid var(--c)}
.cmp-table td.k{color:var(--text-2);white-space:nowrap;width:1%}
.cmp-table td.v{font-family:var(--mono);font-size:12.5px}
.cmp-table td.best{font-weight:700;color:var(--text)}
.cmp-table .bar{height:4px;border-radius:2px;background:var(--c);margin-top:3px;opacity:.7}
.cmp-table tr.sec td{background:var(--surface-2);color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:4px 9px}
.small{font-size:12px;color:var(--text-3)}
.note{font-size:12px;color:var(--text-3);margin-top:6px}
.wrap{overflow-x:auto}
details.raw summary{cursor:pointer;color:var(--text-3);font-size:12px}
details.raw pre{font-size:11px;background:var(--surface-2);padding:8px;border-radius:6px;overflow:auto;max-height:300px}
.home-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.home-cards a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;color:var(--text)}
.home-cards a:hover{border-color:var(--accent);text-decoration:none}
.home-cards .big{font-size:26px;font-weight:700;font-family:var(--mono)}
.home-cards .l{color:var(--text-3);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
@media (max-width:900px){#app{grid-template-columns:1fr}#nav{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main id="main"><div id="loading">Decompressing database…</div></main>
</div>
<div class="tip" id="tip"></div>
<script>
const DB_BLOB = "/*__DB_BLOB__*/";
</script>
<script>
/* ============================================================
   DATA LAYER
   ============================================================ */
'use strict';
const D = {};          // decoded database
const IDX = {};        // indexes
const KINDS = [
  {key:'Aircraft',  label:'Aircraft',     img:'Aircraft',   route:'aircraft'},
  {key:'Ship',      label:'Ships',        img:'Ship',       route:'ship'},
  {key:'Submarine', label:'Submarines',   img:'Submarine',  route:'sub'},
  {key:'Facility',  label:'Facilities',   img:'Facility',   route:'facility'},
  {key:'GroundUnit',label:'Ground Units', img:'GroundUnit', route:'ground'},
];
const KIND_BY_ROUTE = Object.fromEntries(KINDS.map(k=>[k.route,k]));
const KIND_BY_KEY = Object.fromEntries(KINDS.map(k=>[k.key,k]));
const ARCS = ['SB1','SB2','SMF1','SMF2','SMA1','SMA2','SS1','SS2','PB1','PB2','PMF1','PMF2','PMA1','PMA2','PS1','PS2'];
// Each named arc is a 22.5° slice. Sector order (bearing 0→360): SB(0-45) SMF(45-90) SMA(90-135) SS(135-180) PS(180-225) PMA(225-270) PMF(270-315) PB(315-360);
// "1" = first (lower-bearing) half of the sector, "2" = second half. Inferred from the symmetry of DB entries (e.g. AN/APG-77 = SB1,SB2,SMF1 + PMF2,PB1,PB2 = ±67.5°).
const ARC_START = {SB1:0,SB2:22.5,SMF1:45,SMF2:67.5,SMA1:90,SMA2:112.5,SS1:135,SS2:157.5,PS1:180,PS2:202.5,PMA1:225,PMA2:247.5,PMF1:270,PMF2:292.5,PB1:315,PB2:337.5};

function b64ToBytes(b64){
  const bin = atob(b64); const len = bin.length; const out = new Uint8Array(len);
  for (let i=0;i<len;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function inflate(bytes){
  if (typeof DecompressionStream === 'undefined') throw new Error('This browser lacks DecompressionStream (needs Chrome/Edge 80+, Firefox 113+, Safari 16.4+).');
  const ds = new DecompressionStream('deflate');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}
function tableToMap(t){
  const m = new Map(); if (!t) return m;
  const c = t.c, ci = c.indexOf('ID');
  for (const r of t.r){ const o = {}; for (let i=0;i<c.length;i++) o[c[i]] = r[i]; m.set(r[ci], o); }
  return m;
}
const E = (tbl, id) => { const t = D.enums[tbl]; if (!t) return String(id); const v = t[id]; return v == null ? (id ? String(id) : '') : v; };
const isNone = v => v == null || v === 0 || v === 1001 || v === '';

async function loadDB(){
  const bytes = b64ToBytes(DB_BLOB);
  const text = await inflate(bytes);
  const raw = JSON.parse(text);
  D.raw = raw; D.enums = raw.enums; D.meta = raw.meta;
  D.sensor = tableToMap(raw.sensor); D.weapon = tableToMap(raw.weapon); D.warhead = tableToMap(raw.warhead);
  D.mount = tableToMap(raw.mount); D.magazine = tableToMap(raw.magazine); D.loadout = tableToMap(raw.loadout);
  D.propulsion = tableToMap(raw.propulsion); D.comm = tableToMap(raw.comm);
  D.weaponRecord = raw.weaponRecord; D.fuel = raw.fuel; D.acfacility = raw.acfacility; D.propPerf = raw.propPerf;
  // attach sensor extras
  for (const [id,s] of D.sensor){
    s.caps = raw.sensorCaps[id]||[]; s.codes = raw.sensorCodes[id]||[]; s.freqST = raw.sensorFreqST[id]||[]; s.freqIL = raw.sensorFreqIL[id]||[]; s.group = raw.sensorGroups[id]||[];
    s.fam = sensorFamily(s);
  }
  for (const [id,w] of D.weapon){
    w.targets = raw.weaponTargets[id]||[]; w.codes = raw.weaponCodes[id]||[]; w.warheads = raw.weaponWarheads[id]||[];
    w.sensors = raw.weaponSensors[id]||[]; w.prop = raw.weaponProp[id]||[]; w.fuel = raw.weaponFuel[id]||[]; w.sig = raw.weaponSig[id]||{}; w.wra = raw.weaponWRA[id]||[];
    w.fam = weaponFamily(w);
  }
  for (const [id,m] of D.mount){ m.weapons = raw.mountWeapons[id]||[]; m.magWeapons = raw.mountMagWeapons[id]||[]; m.sensors = raw.mountSensors[id]||[]; m.directors = raw.mountDirectors[id]||[]; }
  for (const [id,m] of D.magazine){ m.weapons = raw.magazineWeapons[id]||[]; }
  for (const [id,l] of D.loadout){ l.weapons = raw.loadoutWeapons[id]||[]; }
  // platforms
  D.platforms = {};
  for (const k of KINDS){
    const p = raw[k.key]; const m = tableToMap(p.main);
    for (const [id,u] of m){
      u.kind = k.key;
      u.sensors = p.sensors[id]||[]; u.mounts = p.mounts[id]||[]; u.magazines = p.magazines[id]||[]; u.loadouts = p.loadouts[id]||[];
      u.prop = p.prop[id]||[]; u.fuel = p.fuel[id]||[]; u.codes = p.codes[id]||[]; u.comms = p.comms[id]||[]; u.acfac = p.acfac[id]||[]; u.dock = p.dock[id]||[]; u.sig = p.sig[id]||{};
    }
    D.platforms[k.key] = m;
  }
  buildIndexes();
}

/* ---------- classification ---------- */
function sensorFamily(s){
  const t = s.Type;
  if (t===2001||t===2002||t===2005||t===2006) return 'radar';
  if (t===2003) return 'visual';
  if (t===2004) return 'ir';
  if (t===3001||t===3004) return 'esm';
  if (t===3002||t===3003||t===7001) return 'ecm';
  if (t>=4001&&t<4200) return 'laser';
  if (t>=5001&&t<5900) return 'sonar';
  if (t===5901) return 'sonar';
  if (t>=6001&&t<7000) return 'mcm';
  if (t===9001) return 'group';
  return 'other';
}
const FAMILY = {
  radar:{label:'Radar', color:'var(--s1)'}, esm:{label:'ESM / RWR', color:'var(--s2)'}, sonar:{label:'Sonar', color:'var(--s3)'},
  visual:{label:'Visual / EO', color:'var(--s4)'}, ir:{label:'Infrared', color:'var(--s5)'}, laser:{label:'Laser', color:'var(--s6)'},
  ecm:{label:'ECM / Jammer', color:'var(--s7)'}, mcm:{label:'Mine countermeasures', color:'var(--s8)'}, group:{label:'Sensor group', color:'var(--text-3)'}, other:{label:'Other', color:'var(--text-3)'}
};
function weaponFamily(w){
  const t = w.Type;
  if (t===2001||t===2012||t===8001||t===8002||t===8003||t===5001){
    // guided: split by dominant domain
    if (w.AirRangeMax>0 && !(w.LandRangeMax>0) && !(w.SurfaceRangeMax>0)) return 'aam';
    if (w.AirRangeMax>0 && (w.SurfaceRangeMax>0||w.LandRangeMax>0)) return (w.AirRangeMax>=Math.max(w.SurfaceRangeMax,w.LandRangeMax)) ? 'aam' : 'asm';
    if (w.SubsurfaceRangeMax>0 && !(w.SurfaceRangeMax>0) && !(w.LandRangeMax>0)) return 'asw';
    return 'asm';
  }
  if (t===2003) return 'bomb';
  if (t===2002) return 'rocket';
  if (t===2004||t===2013) return 'gun';
  if (t===2005||t===2006||t===2007) return 'decoy';
  if (t===4001||t===4012) return 'torpedo';
  if (t===4002) return 'dc';
  if (t===4003) return 'sonobuoy';
  if (t>=4004&&t<=4011) return 'mine';
  if (t===3001) return 'pod';
  if (t===3002||t===3003||t===3004) return 'tank';
  if (t===2009||t===2014) return 'dispenser';
  if (t>=6001&&t<=6003) return 'dew';
  if (t>=9001) return 'cargo';
  if (t>=4101&&t<=4106) return 'carried';
  return 'other';
}
const WFAM = {
  aam:{label:'Air-to-air / SAM', color:'var(--s1)'}, asm:{label:'Anti-surface / land attack', color:'var(--s2)'}, asw:{label:'ASW missile', color:'var(--s3)'},
  bomb:{label:'Bomb', color:'var(--s4)'}, rocket:{label:'Rocket', color:'var(--s2)'}, gun:{label:'Gun / small arms', color:'var(--s7)'}, decoy:{label:'Decoy', color:'var(--s5)'},
  torpedo:{label:'Torpedo', color:'var(--s3)'}, dc:{label:'Depth charge', color:'var(--s3)'}, sonobuoy:{label:'Sonobuoy', color:'var(--s3)'}, mine:{label:'Mine', color:'var(--s8)'},
  pod:{label:'Sensor pod', color:'var(--s6)'}, tank:{label:'Tank / buddy store', color:'var(--text-3)'}, dispenser:{label:'Dispenser / UAV', color:'var(--s4)'}, dew:{label:'Directed energy', color:'var(--s8)'},
  cargo:{label:'Cargo / troops', color:'var(--text-3)'}, carried:{label:'Carried vehicle', color:'var(--text-3)'}, other:{label:'Other', color:'var(--text-3)'}
};
const DOMAINS = [
  {k:'Air', label:'Air', color:'var(--s1)', max:'AirRangeMax', min:'AirRangeMin', pok:'AirPoK'},
  {k:'Surface', label:'Surface', color:'var(--s2)', max:'SurfaceRangeMax', min:'SurfaceRangeMin', pok:'SurfacePoK'},
  {k:'Land', label:'Land', color:'var(--s4)', max:'LandRangeMax', min:'LandRangeMin', pok:'LandPoK'},
  {k:'Sub', label:'Subsurface', color:'var(--s3)', max:'SubsurfaceRangeMax', min:'SubsurfaceRangeMin', pok:'SubsurfacePoK'},
];

/* ---------- reverse indexes ---------- */
function buildIndexes(){
  const push = (m,k,v)=>{ let a=m.get(k); if(!a){a=[];m.set(k,a);} a.push(v); };
  IDX.sensorCarriers = new Map();   // sensorId -> [{kind,id}] (platforms)
  IDX.sensorWeapons = new Map();    // sensorId -> [weaponId]

function weaponCarriers(wid){

}

  mShort(v){ if (v==null) return '—'; return Math.abs(v)>=1000? fmt.n(v/1000,1)+' km' : fmt.n(v)+' m'; },
  kt(v){ if (!v) return '—'; return fmt.n(v)+' kt'; },

function arcsFromMask(mask){ const a=[]; for(let i=0;i<16;i++) if(mask&(1<<i)) a.push(ARCS[i]); return a; }

function imgPath(kind,id){ const folder = (D.meta.name||'').toUpperCase().startsWith('CWDB')?'CWDB':'DB3000'; return 'Images/'+folder+'/'+KIND_BY_KEY[kind].img+'_'+id+'.webp'; }

<script>
/* ============================================================

const SVG = (w,h,inner,extra='') => `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block;overflow:visible" ${extra}>${inner}</svg>`;
const tipAttr = t => t? ` data-tip="${esc(t)}"` : '';
function niceTicks(max, n=5){
  if (!(max>0)) return [0];
  const raw = max/n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw/p; const step = (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;
  const t=[]; for(let v=0; v<=max+1e-9; v+=step) t.push(+v.toFixed(6)); return t;
}
function polarPath(cx,cy,r,a0,a1){ // bearings in degrees, 0 = up, clockwise
  const p = a=>[cx+r*Math.sin(a*Math.PI/180), cy-r*Math.cos(a*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1); const large = (a1-a0)>180?1:0;
  return `M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;
}

  const order = ARCS.map((a,i)=>({i, s:ARC_START[a]})).sort((a,b)=>a.s-b.s);
  const runs=[]; let cur=null;
  for (const o of order){ if (on(o.i)){ if (cur && cur[1]===o.s) cur[1]=o.s+22.5; else { cur=[o.s,o.s+22.5]; runs.push(cur);} } }

  return runs;
}
/* small 16-slice arc rosette */
function arcRose(mask, size=56, color='var(--accent)', title=''){
  const c=size/2, r=size/2-2, out=[];
  for (let i=0;i<16;i++){ const a0=ARC_START[ARCS[i]]; const on = mask&(1<<i);
    out.push(`<path d="${polarPath(c,c,r,a0,a0+22.5)}" fill="${on?color:'var(--surface-2)'}" fill-opacity="${on?0.85:1}" stroke="var(--surface)" stroke-width="1"/>`);

  out.push(`<path d="M${c},${c-r*0.22} L${c-r*0.12},${c+r*0.1} L${c+r*0.12},${c+r*0.1} Z" fill="var(--text-3)"/>`);

/* polar coverage diagram, log radial scale. items: {label, range, mask, color, sub} */
function coverageRings(items, opts={}){
  const size = opts.size||380, cx=size/2, cy=size/2, R=size/2-28;
  const valid = items.filter(i=>i.range>0);

  const maxR = Math.max(...valid.map(i=>i.range), opts.minMax||1);
  const sc = v => R*Math.log10(1+v)/Math.log10(1+maxR);

  const rings=[0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000].filter(v=>v<=maxR*1.05);
  const shown = rings.length>7 ? rings.filter((v,i)=>[1,10,100,1000].includes(v)||v===rings[rings.length-1]) : rings;
  for (const v of shown){ const r=sc(v); out.push(`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" class="grid"/><text x="${cx+3}" y="${(cy-r-2).toFixed(1)}" class="lbl">${v} nm</text>`); }

/* side-view envelope. items: {label,color,r0,r1,a0,a1,dash,fill}. altitudes in m; mode 'alt' (log) or 'depth' (linear, negative) */
function envelopeChart(items, opts={}){
  const W=opts.width||560, H=opts.height||240, L=54, Rm=16, T=14, B=34;
  const valid = items.filter(i=>i.r1>0);
  if (!valid.length) return '<div class="small">No data.</div>';
  const maxR = Math.max(...valid.map(i=>i.r1))*1.04;
  const mode = opts.mode||'alt';
  let ys, yticks, ymin, ymax;
  if (mode==='depth'){
    ymin = Math.min(...valid.map(i=>Math.min(i.a0??0,i.a1??0)), -50)*1.08; ymax=0;
    ys = v => T + (H-T-B)*( (v-ymax)/(ymin-ymax) );

  out.push(`<line x1="${L}" x2="${W-Rm}" y1="${H-B}" y2="${H-B}" class="axis"/><line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" class="axis"/>`);

/* speed vs altitude band step chart. series: {label,color, pts:[{a0,a1,v}]} */
function stepChart(series, opts={}){

/* radar frequency strip. st: band enum ids for search/track, il: for illuminate, lo/hi: exact Hz spans */
const RADAR_BANDS = [['A',30e6,250e6],['B',250e6,500e6],['C',500e6,1e9],['D',1e9,2e9],['E',2e9,3e9],['F',3e9,4e9],['G',4e9,6e9],['H',6e9,8e9],['I',8e9,10e9],['J',10e9,20e9],['K',20e9,40e9],['L',40e9,60e9],['M',60e9,100e9]];
function freqStrip(st, il, spans=[], opts={}){
  const W=opts.width||560, H=64, L=8, Rm=8, top=18, bh=22;
  const f0=Math.log10(30e6), f1=Math.log10(100e9);
  const xs = f => L + (W-L-Rm)*(Math.log10(f)-f0)/(f1-f0);
  const stSet = new Set(st.map(id=>E('SensorFrequency',id).charAt(0))), ilSet = new Set(il.map(id=>E('SensorFrequency',id).charAt(0)));
  const out=[];
  for (const [b,lo,hi] of RADAR_BANDS){
    const x0=xs(lo), x1=xs(hi); const on=stSet.has(b), ill=ilSet.has(b);
    out.push(`<rect x="${x0.toFixed(1)}" y="${top}" width="${(x1-x0-1).toFixed(1)}" height="${bh}" rx="3" fill="${on?'var(--s1)':'var(--surface-2)'}" fill-opacity="${on?0.8:1}"${ill?' stroke="var(--s2)" stroke-width="2"':''}${tipAttr(E('SensorFrequency', st.concat(il).find(id=>E('SensorFrequency',id).charAt(0)===b)) || (b+' band ('+fmt.hz(lo)+' – '+fmt.hz(hi)+')'))}/>`);
    out.push(`<text x="${((x0+x1)/2).toFixed(1)}" y="${top+bh/2+4}" text-anchor="middle" class="lbl" style="fill:${on?'#fff':'var(--text-3)'};font-weight:600">${b}</text>`);
  }
  for (const f of [100e6,1e9,10e9,100e9]) out.push(`<text x="${xs(f).toFixed(1)}" y="${top-6}" text-anchor="middle" class="lbl">${fmt.hz(f)}</text>`);
  for (const sp of spans){ if(!(sp.lo>0&&sp.hi>0)) continue; const x0=xs(sp.lo), x1=xs(sp.hi);
    out.push(`<rect x="${x0.toFixed(1)}" y="${top+bh+5}" width="${Math.max(2,x1-x0).toFixed(1)}" height="6" rx="2" fill="${sp.color||'var(--s1)'}"${tipAttr(`${sp.label}: ${fmt.hz(sp.lo)} – ${fmt.hz(sp.hi)}`)}/>`);
    out.push(`<text x="${x1+4}" y="${top+bh+11}" class="lbl">${esc(sp.label)}</text>`);
  }
  return SVG(W,H,out.join(''));
}
/* simple gauge bar for zoom levels etc */
function gauge(label, value, max, color='var(--s4)', text=''){
  const pct = Math.max(0,Math.min(1,(value||0)/max));
  return `<div style="margin:4px 0"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-2)"><span>${esc(label)}</span><span style="font-family:var(--mono)">${esc(text||fmt.n(value,1))}</span></div>
  <div style="height:6px;background:var(--surface-2);border-radius:3px;margin-top:3px"><div style="width:${(pct*100).toFixed(1)}%;height:6px;border-radius:3px;background:${color}"></div></div></div>`;
}
/* signature aspect diagram: values front/side/rear/top; higher = more detectable */
function sigAspect(vals, color, unit, maxAbs){
  const [f,s,r,t] = vals; const size=92, c=size/2, R=size/2-10;
  const sc = v => v==null? 0 : R*Math.max(0.06, Math.min(1, (maxAbs? (v- (unit==='dBsm'?-60:0))/(maxAbs-(unit==='dBsm'?-60:0)) : 0)));
  const pts = [[0,f],[90,s],[180,r],[270,s]].map(([a,v])=>{ const rr=sc(v); return [c+rr*Math.sin(a*Math.PI/180), c-rr*Math.cos(a*Math.PI/180)]; });
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+' Z';
  const out=[`<circle cx="${c}" cy="${c}" r="${R}" fill="none" class="grid"/><circle cx="${c}" cy="${c}" r="${R/2}" fill="none" class="grid"/>`,
    `<path d="${d}" fill="${color}" fill-opacity="0.2" stroke="${color}" stroke-width="1.5"/>`,
    `<text x="${c}" y="9" text-anchor="middle" class="lbl">F</text><text x="${size-4}" y="${c+4}" text-anchor="end" class="lbl">S</text><text x="${c}" y="${size-2}" text-anchor="middle" class="lbl">R</text>`];
  return SVG(size,size,out.join(''));
}
/* scatter plot. pts:{x,y,label,color,href}. opts.xlabel/ylabel/xlog/ylog */
function scatterChart(pts, opts={}){
  const W=opts.width||720, H=opts.height||440, L=60, R=16, T=14, B=44;
  const good=pts.filter(p=>p.x!=null&&p.y!=null&&isFinite(p.x)&&isFinite(p.y)&&(!opts.xlog||p.x>0)&&(!opts.ylog||p.y>0));
  if(good.length<1) return '<div class="small">No points with both values.</div>';
  const xs0=good.map(p=>p.x), ys0=good.map(p=>p.y);
  let xmin=Math.min(...xs0),xmax=Math.max(...xs0),ymin=Math.min(...ys0),ymax=Math.max(...ys0);
  if(!opts.xlog){ const pad=(xmax-xmin)*0.04||1; xmin-=pad; xmax+=pad; } if(!opts.ylog){ const pad=(ymax-ymin)*0.04||1; ymin-=pad; ymax+=pad; }
  const lx=v=>opts.xlog?Math.log10(v):v, ly=v=>opts.ylog?Math.log10(v):v;
  const X=v=>L+(W-L-R)*(lx(v)-lx(xmin))/((lx(xmax)-lx(xmin))||1), Y=v=>T+(H-T-B)*(1-(ly(v)-ly(ymin))/((ly(ymax)-ly(ymin))||1));
  const o=[];
  const xt=opts.xlog?logTicks(xmin,xmax):linTicks(xmin,xmax), yt=opts.ylog?logTicks(ymin,ymax):linTicks(ymin,ymax);
  for(const t of yt){ const y=Y(t); o.push(`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="grid"/><text x="${L-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" class="lbl">${opts.yfmt?opts.yfmt(t):fmt.n(t)}</text>`); }
  for(const t of xt){ const x=X(t); o.push(`<line y1="${T}" y2="${H-B}" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" class="grid"/><text x="${x.toFixed(1)}" y="${H-B+14}" text-anchor="middle" class="lbl">${opts.xfmt?opts.xfmt(t):fmt.n(t)}</text>`); }
  o.push(`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" class="axis"/><line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" class="axis"/>`);
  o.push(`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" class="lbl">${esc(opts.xlabel||'')}</text><text transform="translate(13,${(T+H-B)/2}) rotate(-90)" text-anchor="middle" class="lbl">${esc(opts.ylabel||'')}</text>`);
  for(const p of good){ const cx=X(p.x),cy=Y(p.y); o.push(`<a href="${p.href||'#'}"><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="${p.color||'var(--s1)'}" fill-opacity="0.72" stroke="var(--surface)" stroke-width="0.8"${tipAttr(`${p.label}\n${esc(opts.xlabel||'x')}: ${fmt.n(p.x,2)}\n${esc(opts.ylabel||'y')}: ${fmt.n(p.y,2)}`)}/></a>`); }
  return SVG(W,H,o.join(''))+`<div class="small" style="text-align:right;color:var(--text-3)">${good.length} of ${pts.length} plotted (rest missing a value)</div>`;
}
function logTicks(min,max){ const t=[]; for(let e=Math.floor(Math.log10(Math.max(min,1e-9)));e<=Math.ceil(Math.log10(max));e++){ const v=Math.pow(10,e); if(v>=min*0.5&&v<=max*1.5) t.push(v);} return t.length?t:[min,max]; }
function linTicks(min,max,n){ n=n||6; const span=max-min; if(!(span>0)) return [min]; const raw=span/n, p=Math.pow(10,Math.floor(Math.log10(raw))), mm=raw/p, step=(mm<=1?1:mm<=2?2:mm<=2.5?2.5:mm<=5?5:10)*p; const out=[]; for(let v=Math.ceil(min/step)*step; v<=max+1e-9; v+=step) out.push(+v.toFixed(6)); return out.length?out:[min,max]; }
/* vertical grouped bars for a timeline. cats:[label], series:[{label,color,vals:[per cat]}] */
function vbars(cats, series, opts={}){
  const W=opts.width||720, H=opts.height||240, L=44, R=12, T=12, B=40;
  const totals=cats.map((_,i)=>series.reduce((a,s)=>a+(s.vals[i]||0),0));
  const max=Math.max(...totals,1); const bw=(W-L-R)/cats.length;
  const yt=niceTicks(max,4); const Y=v=>T+(H-T-B)*(1-v/max);
  const o=[];
  for(const t of yt){ const y=Y(t); o.push(`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="grid"/><text x="${L-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" class="lbl">${fmt.n(t)}</text>`); }
  o.push(`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" class="axis"/>`);
  cats.forEach((cat,i)=>{ const x0=L+i*bw+bw*0.15, w=bw*0.7; let acc=0;
    for(const s of series){ const v=s.vals[i]||0; if(!v) continue; const y1=Y(acc+v), y0=Y(acc); o.push(`<rect x="${x0.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${(y0-y1).toFixed(1)}" fill="${s.color}"${tipAttr(`${cat} · ${s.label}: ${fmt.n(v)}`)}/>`); acc+=v; }
    o.push(`<text x="${(x0+w/2).toFixed(1)}" y="${H-B+14}" text-anchor="middle" class="lbl">${esc(cat)}</text>`);
    if(totals[i]) o.push(`<text x="${(x0+w/2).toFixed(1)}" y="${(Y(totals[i])-3).toFixed(1)}" text-anchor="middle" class="lbl" style="fill:var(--text-2)">${fmt.n(totals[i])}</text>`);
  });
  return SVG(W,H,o.join(''));
}
</script>
<script>
/* ============================================================

   ============================================================ */
const $ = sel => document.querySelector(sel);
const state = { showDep:false, showHyp:true, page:0, sort:{}, q:'', filters:{} , theme:null };
try { state.showDep = localStorage.getItem('cmo.showDep')==='1'; state.theme = localStorage.getItem('cmo.theme'); } catch(e){}

}
function toggleTheme(){ const cur=document.documentElement.getAttribute('data-theme'); state.theme = cur==='dark'?'light':'dark'; try{localStorage.setItem('cmo.theme',state.theme);}catch(e){} applyTheme(); }

function route(){
  const h = location.hash.replace(/^#\/?/,''); const [path,qs] = h.split('?');

  return {parts, params};
}
function nav(hash){ location.hash = hash; }
function renderNav(){
  const {parts} = route(); const cur = parts[0]||'';
  const item = (r,label,n)=>`<a class="item ${cur===r?'active':''}" href="#/${r}">${label}<span class="n">${n!=null?fmt.n(n):''}</span></a>`;
  let html = `<h1>CMO Database</h1><div class="sub">${esc(D.meta.file||'')}</div>`;
  html += `<form onsubmit="location.hash='#/search?q='+encodeURIComponent(this.gq.value.trim());return false" style="margin:0 0 10px"><input name="gq" placeholder="Search everything…" value="${esc(cur==='search'?(route().params.q||''):'')}" style="width:100%;padding:7px 9px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface-2)"></form>`;
  html += item('', 'Overview');
  html += `<div class="group">Platforms</div>`;
  for (const k of KINDS) html += item(k.route, k.label, D.platforms[k.key].size);
  html += `<div class="group">Components</div>`;
  html += item('sensor','Sensors',D.sensor.size) + item('weapon','Weapons',D.weapon.size);
  html += `<div class="group">Systems</div>` + item('ew','Electronic Warfare', null) + item('detect','Detection matchup', null) + item('threat','Threat rings', null);
  html += `<div class="group">Analysis</div>` + item('explore','Trend explorer', null) + item('tops','Leaderboards', null);
  html += `<div class="group">Tools</div>` + item('compare','Compare', null);
  html += `<div class="foot"><button onclick="toggleTheme()">Toggle theme</button><div style="margin-top:8px">Extracted ${esc(D.meta.extracted||'')}</div></div>`;
  $('#nav').innerHTML = html;
}
window.addEventListener('hashchange', ()=>{ state.page=0; render(); });

function render(){
  renderNav();
  const {parts, params} = route();
  const main = $('#main');
  try {
    if (!parts.length) main.innerHTML = viewHome();
    else if (KIND_BY_ROUTE[parts[0]]){ const k=KIND_BY_ROUTE[parts[0]]; main.innerHTML = parts[1] ? viewUnit(k.key, +parts[1], params) : viewPlatformList(k, params); }
    else if (parts[0]==='sensor') main.innerHTML = parts[1] ? viewSensor(+parts[1]) : viewSensorList(params);
    else if (parts[0]==='weapon') main.innerHTML = parts[1] ? viewWeapon(+parts[1]) : viewWeaponList(params);
    else if (parts[0]==='mount') main.innerHTML = viewMount(+parts[1]);
    else if (parts[0]==='loadout') main.innerHTML = viewLoadout(+parts[1]);
    else if (parts[0]==='search') main.innerHTML = viewSearch(params);
    else if (parts[0]==='explore') main.innerHTML = viewExplore(params);

/* ---------- tooltip ---------- */
(function(){
  const tip = document.getElementById('tip');
  document.addEventListener('mousemove', e=>{
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t){ tip.style.display='none'; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.style.display='block';
    const x = Math.min(e.clientX+14, innerWidth-tip.offsetWidth-8), y = Math.min(e.clientY+14, innerHeight-tip.offsetHeight-8);
    tip.style.left=x+'px'; tip.style.top=y+'px';
  });
})();

/* ---------- home ---------- */
function viewHome(){
  const cards = KINDS.map(k=>`<a href="#/${k.route}"><div class="l">${k.label}</div><div class="big">${fmt.n(D.platforms[k.key].size)}</div></a>`).join('')
    + `<a href="#/sensor"><div class="l">Sensors</div><div class="big">${fmt.n(D.sensor.size)}</div></a><a href="#/weapon"><div class="l">Weapons</div><div class="big">${fmt.n(D.weapon.size)}</div></a>`;
  const famCount = {}; for (const [,s] of D.sensor) famCount[s.fam]=(famCount[s.fam]||0)+1;

  return `<h2 class="title">${esc(D.meta.name||'Database')}</h2><div class="meta">${esc(((D.meta.db||[]).find(d=>d.ID===((D.meta.name||'').toUpperCase().startsWith('CWDB')?1:0))||{}).Description||'')} · ${fmt.n(D.meta.size/1e6,1)} MB source · ${fmt.n(D.mount.size)} mounts · ${fmt.n(D.loadout.size)} loadouts · ${fmt.n(D.warhead.size)} warheads</div>
  <div class="home-cards">${cards}</div>
  <div class="grid c2" style="margin-top:16px">
    <div class="card"><h3>Sensors by family</h3>${hbars(Object.entries(famCount).sort((a,b)=>b[1]-a[1]).map(([f,n])=>({label:FAMILY[f].label, value:n, color:FAMILY[f].color, text:fmt.n(n)})),{width:480})}</div>
    <div class="card"><h3>Weapons by family</h3>${hbars(Object.entries(wfamCount).sort((a,b)=>b[1]-a[1]).map(([f,n])=>({label:WFAM[f].label, value:n, color:WFAM[f].color, text:fmt.n(n)})),{width:480})}</div>
    <div class="card"><h3>How to use</h3><div style="font-size:13px;line-height:1.55">
      <p style="margin:0 0 6px">Browse any list, click an entry for its detail page, then use <b>Add to compare</b> on up to four entries of the same kind. The tray at bottom-right opens the side-by-side view with overlaid envelopes.</p>
      <p style="margin:0 0 6px">Ranges are nautical miles, altitudes metres (feet in parentheses), speeds knots, weights kg — exactly as stored in the database. Sensor and weapon arcs are drawn from the 16 named arc slots; each slot is a 22.5° slice, numbered clockwise within its 45° sector (inferred from entry symmetry, e.g. AN/APG-77 = ±67.5°).</p>

    </div></div>

/* ---------- generic list machinery ---------- */
function listControls(id, params, opts){
  // opts: {placeholder, selects:[{name,label,options:[{v,l}]}], extra}
  const sel = (opts.selects||[]).map(s=>`<select onchange="setParam('${s.name}',this.value)"><option value="">${esc(s.label)}</option>${s.options.map(o=>`<option value="${esc(o.v)}"${String(params[s.name]||'')===String(o.v)?' selected':''}>${esc(o.l)}</option>`).join('')}</select>`).join('');
  return `<div class="toolbar"><form onsubmit="applySearch(this.qbox.value);return false" style="display:contents"><input name="qbox" id="listsearch" type="search" placeholder="${esc(opts.placeholder||'Search name / comments — press Enter')}" value="${esc(params.q||'')}"><button class="cmpbtn" style="padding:6px 12px">Search</button></form>${sel}
  <label class="chk"><input type="checkbox" ${state.showDep?'checked':''} onchange="state.showDep=this.checked;try{localStorage.setItem('cmo.showDep',this.checked?'1':'0')}catch(e){};render()"> show deprecated</label>
  <button class="cmpbtn" style="padding:5px 9px" onclick="resetFilters()">reset</button>
  <button class="cmpbtn" style="padding:5px 9px" onclick="exportCSV()" title="Download the filtered list as CSV">⭳ CSV</button>
  <span class="count" id="listcount"></span></div>`;
}
function applySearch(v){ setParam('q', (v||'').trim()); }
/* CSV export of the current filtered/sorted list */
let LASTLIST=null;
function exportCSV(){
  if(!LASTLIST||!LASTLIST.rows.length){ alert('No list to export from this view.'); return; }
  const {rows,cols,name}=LASTLIST;
  const cell=v=>{ if(v&&typeof v==='object') v=''; v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv=[cols.map(c=>cell(c.label)).join(',')].concat(rows.map(r=>cols.map(c=>cell(c.get(r))).join(','))).join('\n');
  try{ const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=(D.meta.name||'cmo')+'_'+name+'.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); }
  catch(e){ alert('Export failed: '+e.message); }
}
function setParam(k,v){ const {parts,params}=route(); if (v===''||v==null) delete params[k]; else params[k]=v; delete params.p; const qs=new URLSearchParams(params).toString(); location.hash='#/'+parts.join('/')+(qs?'?'+qs:''); }
function sortBy(col){ const {params}=route(); const cur=params.s||''; setParam('s', cur===col? '-'+col : col); }
function matchQ(q, ...fields){ if(!q) return true; const s=q.toLowerCase(); return fields.some(f=>f&&String(f).toLowerCase().includes(s)); }
/* build filter options from a set of id-lists present in the data */
function presentOpts(items, getIds, enumName){ const m=new Map(); for(const it of items){ const ids=getIds(it)||[]; for(const id of ids) m.set(id,(m.get(id)||0)+1); } return [...m.entries()].map(([id,n])=>({v:id,l:E(enumName,id)+' ('+n+')'})).sort((a,b)=>a.l.localeCompare(b.l)); }
function famPresentOpts(items, getSet, lookup){ const s=new Set(); for(const it of items){ const set=getSet(it); if(set) set.forEach(f=>s.add(f)); } return [...s].map(f=>({v:f,l:(lookup[f]?lookup[f].label:f)})).sort((a,b)=>a.l.localeCompare(b.l)); }
const threshOpts=(arr,unit)=>arr.map(v=>({v,l:'≥ '+fmt.n(v)+' '+unit}));
/* weapon guidance classification */
const GUIDANCE={arh:'Active radar (ARH)',sarh:'Semi-active radar (SARH)',tvm:'Track-via-missile',ir:'Infrared / IIR',eo:'Electro-optical',arm:'Anti-radiation (passive)',laser:'Laser-guided',sonar:'Sonar (torpedo)',gnss:'INS + GNSS/GPS',ins:'INS only',tercom:'TERCOM',unguided:'Unguided'};
function weaponGuidanceTags(w){
  const t=new Set();
  for (const [sid] of w.sensors){ const s=D.sensor.get(sid); if(!s) continue;
    if(s.Type===2001) t.add('arh'); else if(s.Type===2002||s.Type===2006) t.add('sarh'); else if(s.Type===2005) t.add('tvm'); else if(s.Type===2004) t.add('ir'); else if(s.Type===2003) t.add('eo'); else if(s.Type===3001) t.add('arm'); else if(s.Type>=4001&&s.Type<4100) t.add('laser'); else if(s.fam==='sonar') t.add('sonar'); }
  const c=w.codes;
  if(c.includes(6102)||c.includes(6140)||c.includes(6141)||c.includes(6142)||c.includes(6143)) t.add('gnss');
  else if(c.includes(6101)) t.add('ins');
  if(c.includes(6103)) t.add('tercom'); if(c.includes(3001)) t.add('arm');
  if(!t.size && w.fam!=='decoy' && w.fam!=='cargo' && w.fam!=='tank' && w.fam!=='pod') t.add('unguided');
  return t;
}
function warheadDP(w){ let s=0; for(const id of w.warheads){ const h=D.warhead.get(id); if(h) s+=h.DamagePoints||0; } return s; }
function renderTable(rows, cols, params, rowHref){
  // cols: {key,label,num,get,sort}
  const sortKey = (params.s||'').replace(/^-/,''), desc=(params.s||'').startsWith('-');
  if (sortKey){ const c=cols.find(c=>c.key===sortKey); if(c){ const g=c.sort||c.get; rows.sort((a,b)=>{ const x=g(a), y=g(b); if (x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return (typeof x==='number'? x-y : String(x).localeCompare(String(y))) * (desc?-1:1); }); } }
  LASTLIST={rows:rows.slice(), cols, name:(route().parts[0]||'db')};
  const page = +(params.p||0), per=200, total=rows.length, slice=rows.slice(page*per,(page+1)*per);
  const th = cols.map(c=>`<th class="${sortKey===c.key?'sorted':''}" onclick="sortBy('${c.key}')">${esc(c.label)}${sortKey===c.key?(desc?' ▼':' ▲'):''}</th>`).join('');
  const tr = slice.map(r=>`<tr>${cols.map(c=>{ const v=c.get(r); const cell = c.html? c.html(r) : esc(v==null?'—':v); return `<td class="${c.num?'num':''}${c.dim?' dim':''}">${c.link? `<a href="${rowHref(r)}">${cell}</a>` : cell}</td>`; }).join('')}</tr>`).join('');
  const pages = Math.ceil(total/per);
  const pager = pages>1? `<div class="pager"><button ${page<=0?'disabled':''} onclick="setPage(${page-1})">‹ prev</button><span>page ${page+1} / ${pages}</span><button ${page>=pages-1?'disabled':''} onclick="setPage(${page+1})">next ›</button></div>`:'';
  setTimeout(()=>{ const c=$('#listcount'); if(c) c.textContent = fmt.n(total)+' entries'; },0);
  return `<div class="wrap"><table class="list"><thead><tr>${th}</tr></thead><tbody>${tr||'<tr><td colspan="'+cols.length+'" class="dim">No matches.</td></tr>'}</tbody></table></div>${pager}`;
}
function setPage(p){ const {parts,params}=route(); params.p=p; location.hash='#/'+parts.join('/')+'?'+new URLSearchParams(params).toString(); }
function resetFilters(){ const {parts}=route(); location.hash='#/'+parts.join('/'); }
function flags(u){ return (u.Deprecated?'<span class="badge dep">deprecated</span>':'')+(u.Hypothetical?'<span class="badge warn">hypothetical</span>':''); }

/* ---------- platform list ---------- */
function viewPlatformList(k, params){
  const all = [...D.platforms[k.key].values()];
  const typeEnum = k.key==='Facility'?'FacilityCategory': k.key==='GroundUnit'?'GroundUnitCategory': k.key+'Type';
  const typeField = (k.key==='Facility'||k.key==='GroundUnit')?'Category':'Type';
  const types = new Map(); for (const u of all) types.set(u[typeField],(types.get(u[typeField])||0)+1);
  const typeOpts = [...types.keys()].map(t=>({v:t,l:E(typeEnum,t)})).sort((a,b)=>a.l.localeCompare(b.l));
  const countryOpts = IDX.countries[k.key].map(c=>({v:c.id,l:c.name+' ('+c.n+')'}));
  const decades=[]; for(let y=1940;y<=2030;y+=10) decades.push({v:y,l:y+'s'});
  const svcMap=new Map(); for(const u of all) if(u.OperatorService) svcMap.set(u.OperatorService,(svcMap.get(u.OperatorService)||0)+1);
  const serviceOpts=[...svcMap.entries()].map(([id,n])=>({v:id,l:E('OperatorService',id)+' ('+n+')'})).sort((a,b)=>a.l.localeCompare(b.l));
  const sensorFamOpts=famPresentOpts(all,u=>u._sfams,FAMILY);
  const carriesOpts=famPresentOpts(all,u=>u._wfams,WFAM);
  let rows = all.filter(u => (state.showDep||!u.Deprecated) && matchQ(params.q,u.Name,u.Comments) && (!params.c || u.OperatorCountry==+params.c) && (!params.t || u[typeField]==+params.t) && (!params.d || (u.YearCommissioned>=+params.d && u.YearCommissioned<+params.d+10)) && (!params.svc || u.OperatorService==+params.svc) && (!params.sf || (u._sfams&&u._sfams.has(params.sf))) && (!params.wf || (u._wfams&&u._wfams.has(params.wf))));
  const cols = [
    {key:'name',label:'Name',get:u=>u.Name,link:true,html:u=>esc(u.Name)+flags(u)},
    {key:'type',label:k.key==='Facility'||k.key==='GroundUnit'?'Category':'Type',get:u=>E(typeEnum,u[typeField]),dim:true},
    {key:'country',label:'Operator',get:u=>E('OperatorCountry',u.OperatorCountry),dim:true},
    {key:'svc',label:'Service',get:u=>E('OperatorService',u.OperatorService),dim:true},
    {key:'year',label:'In service',get:u=>u.YearCommissioned||null,num:true,html:u=>fmt.yr(u)},
    {key:'sens',label:'Sensors',get:u=>u.sensors.length,num:true},
    {key:'mounts',label:'Mounts',get:u=>u.mounts.length,num:true},
    {key:'comments',label:'Comments',get:u=>u.Comments,dim:true},
  ];
  if (k.key==='Aircraft') cols.splice(5,0,{key:'lo',label:'Loadouts',get:u=>u.loadouts.length,num:true});
  if (k.key==='Ship'||k.key==='Submarine') cols.splice(5,0,{key:'disp',label:'Displacement',get:u=>u.DisplacementFull||null,num:true,html:u=>u.DisplacementFull?fmt.n(u.DisplacementFull)+' t':'—'});
  if (!params.s) rows.sort((a,b)=>a.Name.localeCompare(b.Name));
  return `<h2 class="title">${k.label}</h2><div class="meta">${fmt.n(all.length)} entries in ${esc(D.meta.name)}</div>` +
    listControls('plist', params, {selects:[{name:'t',label:'All types',options:typeOpts},{name:'c',label:'All operators',options:countryOpts},{name:'svc',label:'Any service',options:serviceOpts},{name:'d',label:'Any decade',options:decades},{name:'sf',label:'Any sensor',options:sensorFamOpts},{name:'wf',label:'Carries any weapon',options:carriesOpts}]}) +
    renderTable(rows, cols, params, u=>`#/${k.route}/${u.ID}`);
}
/* ---------- sensor list ---------- */
function viewSensorList(params){
  const all=[...D.sensor.values()];
  const famOpts = Object.entries(FAMILY).map(([v,f])=>({v,l:f.label}));
  const types = new Map(); for (const s of all) types.set(s.Type,(types.get(s.Type)||0)+1);
  const typeOpts=[...types.keys()].map(t=>({v:t,l:E('SensorType',t)})).sort((a,b)=>a.l.localeCompare(b.l));
  const roleMap = new Map(); for (const s of all) if(!params.f||s.fam===params.f) roleMap.set(s.Role,(roleMap.get(s.Role)||0)+1);
  const roleOpts=[...roleMap.keys()].map(t=>({v:t,l:E('SensorRole',t)})).sort((a,b)=>a.l.localeCompare(b.l));
  const capOpts=presentOpts(all,s=>s.caps,'SensorCapability');
  const codeOpts=presentOpts(all,s=>s.codes,'SensorCode');
  const bset=new Set(); for(const s of all) for(const f of s.freqST) if(f>=1001&&f<=1013) bset.add(E('SensorFrequency',f).charAt(0));
  const bandOpts=[...bset].sort().map(l=>({v:l,l:l+' band'}));
  let rows = all.filter(s=>(state.showDep||!s.Deprecated) && matchQ(params.q,s.Name,s.Comments) && (!params.f||s.fam===params.f) && (!params.t||s.Type==+params.t) && (!params.r||s.Role==+params.r) && (!params.cap||s.caps.includes(+params.cap)) && (!params.code||s.codes.includes(+params.code)) && (!params.band||s.freqST.some(f=>f>=1001&&f<=1013&&E('SensorFrequency',f).charAt(0)===params.band)) && (!params.rng||s.RangeMax>=+params.rng));
  const cols=[
    {key:'name',label:'Name',get:s=>s.Name,link:true,html:s=>esc(s.Name)+flags(s)},
    {key:'fam',label:'Family',get:s=>FAMILY[s.fam].label,html:s=>`<span class="legend"><span class="sw" style="background:${FAMILY[s.fam].color}"></span>${FAMILY[s.fam].label}</span>`},
    {key:'type',label:'Type',get:s=>E('SensorType',s.Type),dim:true},
    {key:'role',label:'Role',get:s=>E('SensorRole',s.Role),dim:true},
    {key:'gen',label:'Generation',get:s=>E('SensorGeneration',s.Generation),dim:true},
    {key:'range',label:'Range',get:s=>s.RangeMax||null,num:true,html:s=>fmt.nm(s.RangeMax)},
    {key:'alt',label:'Max alt',get:s=>(s.AltitudeMax_ASL||s.AltitudeMax)||null,num:true,html:s=>fmt.mShort(s.AltitudeMax_ASL||s.AltitudeMax||0)},
    {key:'used',label:'Used by',get:s=>(IDX.sensorCarriers.get(s.ID)||[]).length+(IDX.sensorWeapons.get(s.ID)||[]).length,num:true},
    {key:'comments',label:'Comments',get:s=>s.Comments,dim:true},
  ];
  if (!params.s) rows.sort((a,b)=>a.Name.localeCompare(b.Name));
  return `<h2 class="title">Sensors</h2><div class="meta">${fmt.n(all.length)} sensors — radars, ESM, optics, sonars, jammers and seekers</div>`+
    listControls('slist', params, {selects:[{name:'f',label:'All families',options:famOpts},{name:'t',label:'All types',options:typeOpts},{name:'r',label:'All roles',options:roleOpts},{name:'cap',label:'Any capability',options:capOpts},{name:'band',label:'Any band',options:bandOpts},{name:'code',label:'Any feature',options:codeOpts},{name:'rng',label:'Any range',options:threshOpts([50,100,150,200,300],'nm')}]}) +
    renderTable(rows, cols, params, s=>`#/sensor/${s.ID}`);
}
/* ---------- weapon list ---------- */
function weaponMaxRange(w){ return Math.max(w.AirRangeMax||0,w.SurfaceRangeMax||0,w.LandRangeMax||0,w.SubsurfaceRangeMax||0); }
function weaponGuidance(w){
  const g=[]; for (const [sid] of w.sensors){ const s=D.sensor.get(sid); if(s) g.push(E('SensorType',s.Type)); }
  const c = w.codes; if (c.includes(6102)) g.push('INS/GNSS'); else if (c.includes(6101)) g.push('INS'); if (c.includes(6103)) g.push('TERCOM'); if (c.includes(1002)) g.push('Terminal illum.');
  if (c.includes(1101)) g.push('HOJ');
  return [...new Set(g)].join(', ');
}
function viewWeaponList(params){
  const all=[...D.weapon.values()];
  const famOpts = Object.entries(WFAM).map(([v,f])=>({v,l:f.label}));
  const types = new Map(); for (const w of all) types.set(w.Type,(types.get(w.Type)||0)+1);
  const typeOpts=[...types.keys()].map(t=>({v:t,l:E('WeaponType',t)})).sort((a,b)=>a.l.localeCompare(b.l));
  const gset=new Set(); for(const w of all) weaponGuidanceTags(w).forEach(t=>gset.add(t));
  const guidOpts=[...gset].filter(t=>GUIDANCE[t]).map(t=>({v:t,l:GUIDANCE[t]})).sort((a,b)=>a.l.localeCompare(b.l));
  const featOpts=presentOpts(all,w=>w.codes,'WeaponCode');
  const tgtOpts=presentOpts(all,w=>w.targets,'WeaponTarget');
  let rows = all.filter(w=>(state.showDep||!w.Deprecated) && matchQ(params.q,w.Name,w.Comments) && (!params.f||w.fam===params.f) && (!params.t||w.Type==+params.t) && (!params.g||weaponGuidanceTags(w).has(params.g)) && (!params.feat||w.codes.includes(+params.feat)) && (!params.dp||warheadDP(w)>=+params.dp) && (!params.tg||w.targets.includes(+params.tg)) && (!params.rng||weaponMaxRange(w)>=+params.rng));
  const cols=[
    {key:'name',label:'Name',get:w=>w.Name,link:true,html:w=>esc(w.Name)+flags(w)},
    {key:'fam',label:'Family',get:w=>WFAM[w.fam].label,html:w=>`<span class="legend"><span class="sw" style="background:${WFAM[w.fam].color}"></span>${WFAM[w.fam].label}</span>`},
    {key:'type',label:'Type',get:w=>E('WeaponType',w.Type),dim:true},
    {key:'guid',label:'Guidance / seeker',get:w=>weaponGuidance(w),dim:true},
    {key:'range',label:'Max range',get:w=>weaponMaxRange(w)||null,num:true,html:w=>fmt.nm(weaponMaxRange(w))},
    {key:'air',label:'Air',get:w=>w.AirRangeMax||null,num:true,html:w=>w.AirRangeMax?fmt.n(w.AirRangeMax,1):'·'},
    {key:'surf',label:'Surf',get:w=>w.SurfaceRangeMax||null,num:true,html:w=>w.SurfaceRangeMax?fmt.n(w.SurfaceRangeMax,1):'·'},
    {key:'land',label:'Land',get:w=>w.LandRangeMax||null,num:true,html:w=>w.LandRangeMax?fmt.n(w.LandRangeMax,1):'·'},
    {key:'sub',label:'Sub',get:w=>w.SubsurfaceRangeMax||null,num:true,html:w=>w.SubsurfaceRangeMax?fmt.n(w.SubsurfaceRangeMax,1):'·'},
    {key:'dp',label:'Wh DP',get:w=>warheadDP(w)||null,num:true,html:w=>{const d=warheadDP(w); return d?fmt.n(d,1):'·';}},
    {key:'wt',label:'Weight',get:w=>w.Weight||null,num:true,html:w=>fmt.kg(w.Weight)},
    {key:'comments',label:'Comments',get:w=>w.Comments,dim:true},
  ];
  if (!params.s) rows.sort((a,b)=>a.Name.localeCompare(b.Name));
  return `<h2 class="title">Weapons</h2><div class="meta">${fmt.n(all.length)} weapons — ranges in nm per target domain</div>`+
    listControls('wlist', params, {selects:[{name:'f',label:'All families',options:famOpts},{name:'t',label:'All types',options:typeOpts},{name:'g',label:'Any guidance',options:guidOpts},{name:'feat',label:'Any feature',options:featOpts},{name:'tg',label:'Any target',options:tgtOpts},{name:'dp',label:'Any damage',options:threshOpts([5,25,100,300,1000],'DP')},{name:'rng',label:'Any range',options:threshOpts([5,25,100,300],'nm')}]}) +
    renderTable(rows, cols, params, w=>`#/weapon/${w.ID}`);
}
/* ---------- global search ---------- */
function viewSearch(params){
  const q=(params.q||'').trim(); if(!q) return `<h2 class="title">Search</h2><div class="meta">Use the box at the top of the sidebar to search across every platform, sensor and weapon at once.</div>`;
  const ql=q.toLowerCase(); const hit=(n,c)=>(n&&n.toLowerCase().includes(ql))||(c&&c.toLowerCase().includes(ql));
  const groups=[];
  for(const k of KINDS){ const rows=[...D.platforms[k.key].values()].filter(u=>(state.showDep||!u.Deprecated)&&hit(u.Name,u.Comments)); if(rows.length) groups.push({label:k.label,route:k.route,rows,name:u=>u.Name,sub:u=>E('OperatorCountry',u.OperatorCountry)+' · '+fmt.yr(u)}); }
  {const rows=[...D.sensor.values()].filter(s=>(state.showDep||!s.Deprecated)&&hit(s.Name,s.Comments)); if(rows.length) groups.push({label:'Sensors',route:'sensor',rows,name:s=>s.Name,sub:s=>FAMILY[s.fam].label+' · '+E('SensorType',s.Type)});}
  {const rows=[...D.weapon.values()].filter(w=>(state.showDep||!w.Deprecated)&&hit(w.Name,w.Comments)); if(rows.length) groups.push({label:'Weapons',route:'weapon',rows,name:w=>w.Name,sub:w=>WFAM[w.fam].label+' · '+E('WeaponType',w.Type)});}
  const total=groups.reduce((a,g)=>a+g.rows.length,0);
  let html=`<h2 class="title">Search: “${esc(q)}”</h2><div class="meta">${fmt.n(total)} match${total===1?'':'es'} across ${groups.length} categor${groups.length===1?'y':'ies'}</div>`;
  if(!total) return html+'<div class="card"><span class="small">No matches. Try a shorter term, or toggle "show deprecated" in a list.</span></div>';
  html+='<div class="grid c2">';
  for(const g of groups){ g.rows.sort((a,b)=>g.name(a).localeCompare(g.name(b))); const shown=g.rows.slice(0,40);
    html+=`<div class="card"><h3>${g.label}<span class="hint">${g.rows.length} · <a href="#/${g.route}?q=${encodeURIComponent(q)}">open in list ›</a></span></h3><div class="comp-list">${shown.map(r=>`<a class="comp" href="#/${g.route}/${r.ID}" style="grid-template-columns:1fr"><span><div class="nm">${esc(g.name(r))}${flags(r)}</div><div class="sub">${esc(g.sub(r))}</div></span></a>`).join('')}${g.rows.length>40?`<a href="#/${g.route}?q=${encodeURIComponent(q)}" class="small" style="padding:4px 8px">… ${g.rows.length-40} more — open in list ›</a>`:''}</div></div>`; }
  return html+'</div>';
}
</script>
<script>
/* ============================================================
   UNIT DETAIL
   ============================================================ */
function armorTxt(v){ if(!v||v===1001) return 'none'; const e=D.enums.ArmorType&&D.enums.ArmorType[v]; return e? e.replace(/ \(.*\)/,'') : String(v); }
function sensorInstances(u){
  const m = new Map();
  for (const [sid,mask,maskMax,deg,degMax,vdeg,mast] of u.sensors){
    let o=m.get(sid); if(!o){ o={sid, s:D.sensor.get(sid), n:0, mask:0, maskMax:0, deg, degMax, vdeg, mast}; m.set(sid,o); }
    o.n++; o.mask|=mask; o.maskMax|=maskMax;
  }
  return [...m.values()].filter(o=>o.s);
}
function mountInstances(u){
  const m = new Map();
  for (const [mid,mask] of u.mounts){ let o=m.get(mid); if(!o){ o={mid, m:D.mount.get(mid), n:0, mask:0}; m.set(mid,o);} o.n++; o.mask|=mask; }
  return [...m.values()].filter(o=>o.m);
}
/* every sensor a unit actually fields — fitted directly on the hull AND carried on its mounts
   (radars/EO on SAM launcher vehicles, directors, etc.). Merged & deduped by sensor id. */
function sensorInstancesAll(u){
  const m = new Map();
  const push = (sid, mask, extra) => { let o=m.get(sid); if(!o){ o={sid, s:D.sensor.get(sid), n:0, mask:0, maskMax:0, deg:null, degMax:null, vdeg:null, mast:0}; if(extra) Object.assign(o,extra); m.set(sid,o); } o.n++; o.mask|=(mask&0xFFFF); o.maskMax|=(mask&0xFFFF); };
  for (const [sid,mask,maskMax,deg,degMax,vdeg,mast] of u.sensors) push(sid, mask, {deg,degMax,vdeg,mast});
  for (const {m:mt,n} of mountInstances(u)) for (const sid of (mt.sensors||[])) for(let i=0;i<n;i++) push(sid, 0xFFFF, {viaMount:mt.Name});
  return [...m.values()].filter(o=>o.s);
}
function expandSensorGroup(s, acc=new Map(), depth=0){
  if (s.Type===9001 && depth<3){ for (const gid of s.group){ const g=D.sensor.get(gid); if (g) expandSensorGroup(g, acc, depth+1); } }
  else acc.set(s.ID, s);
  return acc;
}
/* all weapons a unit can employ: via mounts, magazines and (aircraft) a loadout */
function unitWeapons(u, loadoutId){
  const out = new Map();
  const add = (wrid, via, qtyOverride) => { const rec=D.weaponRecord[wrid]; if(!rec) return; const w=D.weapon.get(rec[0]); if(!w) return;
    let o=out.get(w.ID); if(!o){ o={w, qty:0, max:0, via:new Set(), rof:rec[3]}; out.set(w.ID,o); }
    o.qty += qtyOverride!=null?qtyOverride:rec[1]; o.max += rec[2]; o.via.add(via); };
  for (const {m,n} of mountInstances(u)){ for (const wr of m.weapons) for(let i=0;i<n;i++) add(wr, 'mount: '+m.Name); for (const wr of m.magWeapons) for(let i=0;i<n;i++) add(wr,'mount magazine: '+m.Name); }
  const seenG=new Map(); for (const gid of u.magazines) seenG.set(gid,(seenG.get(gid)||0)+1);
  for (const [gid,n] of seenG){ const g=D.magazine.get(gid); if(!g) continue; for (const wr of g.weapons) for(let i=0;i<n;i++) add(wr,'magazine: '+g.Name); }
  if (loadoutId){ const l=D.loadout.get(loadoutId); if (l) for (const [wr,opt,int] of l.weapons) add(wr,'loadout: '+l.Name); }
  return [...out.values()];
}
function sensorLine(o){
  const s=o.s, f=FAMILY[s.fam];
  const arcs = o.mask===0xFFFF? '360°' : arcsFromMask(o.mask).length+'/16';
  return `<a class="comp" href="#/sensor/${s.ID}"><span>${arcRose(o.mask,40,f.color)}</span><span><div class="nm"><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${f.color};margin-right:6px"></span>${esc(s.Name)}${o.n>1?` <span class="badge">×${o.n}</span>`:''}</div><div class="sub">${esc(E('SensorRole',s.Role))} · ${esc(E('SensorGeneration',s.Generation))}${o.mast?' · mast '+o.mast+' m':''}${o.viaMount?' · on '+esc(o.viaMount):''}</div></span><span class="cnt">${s.RangeMax?fmt.nm(s.RangeMax):''}<br><span class="small">${arcs}</span></span></a>`;
}
function unitHeader(u, k){
  const typeEnum = k.key==='Facility'?'FacilityType': k.key==='GroundUnit'?null: k.key+'Type';
  const catEnum = k.key==='Aircraft'?'AircraftCategory': k.key==='Ship'?'ShipCategory': k.key==='Submarine'?'SubmarineCategory': k.key==='Facility'?'FacilityCategory':'GroundUnitCategory';
  const bits=[E(catEnum,u.Category), typeEnum?E(typeEnum,u.Type):null].filter(x=>x&&x!=='None');
  return `<div class="crumbs"><a href="#/">Overview</a> › <a href="#/${k.route}">${k.label}</a></div>
  <div class="hero"><div><h2 class="title">${esc(u.Name)}${flags(u)}</h2>
    <div class="meta">${esc(bits.join(' · '))}<br>${esc(E('OperatorCountry',u.OperatorCountry))}${u.OperatorService?' · '+esc(E('OperatorService',u.OperatorService)):''} · ${fmt.yr(u)}${u.Comments&&u.Comments!=='-'?' · '+esc(u.Comments):''} · <span class="small">ID ${u.ID}</span></div>
    ${compareButton(k.route, u.ID, u.Name)}</div>
    <img src="${imgPath(k.key,u.ID)}" alt="" onerror="this.style.display='none'" loading="lazy"></div>`;
}
function statTiles(list){ return `<div class="stat-row">${list.filter(s=>s&&s[1]!=null&&s[1]!=='—'&&s[1]!==0&&s[1]!=='0').map(([l,v,u])=>`<div class="stat"><div class="l">${esc(l)}</div><div class="v">${esc(v)}${u?`<span class="u">${esc(u)}</span>`:''}</div></div>`).join('')}</div>`; }
function kv(pairs){ return `<div class="kv">${pairs.filter(p=>p&&p[1]!=null&&p[1]!==''&&p[1]!=='—').map(([k,v,txt])=>`<span class="k">${esc(k)}</span><span class="v${txt?' txt':''}">${txt?v:esc(v)}</span>`).join('')}</div>`; }
const THROTTLE = {1:'Loiter',2:'Cruise',3:'Full',4:'Flank / AB'};
const THROTTLE_COLOR = {1:'var(--s3)',2:'var(--s1)',3:'var(--s2)',4:'var(--s8)'};
function propulsionCard(propIds, opts={}){
  if (!propIds.length) return '';
  const html=[];
  for (const pid of propIds){
    const p=D.propulsion.get(pid); if(!p) continue;
    const perf=(D.propPerf[pid]||[]);
    const bands = new Map(); for (const [band,thr,spd,a0,a1,c] of perf){ if(!bands.has(thr)) bands.set(thr,[]); bands.get(thr).push({a0,a1,v:spd,c}); }

function fuelText(fuels){ return fuels.map(f=>{ const r=D.fuel[f]; return r? fmt.n(r[1])+' kg '+E('FuelType',r[0]) : ''; }).filter(Boolean).join(', '); }
const SIG_GROUPS = [
  {label:'Radar cross-section (dBsm)', types:[5001,5002], unit:'dBsm', color:'var(--s1)'},
  {label:'Infrared detection / classification range (nm)', types:[4001,4002], unit:'nm', color:'var(--s5)'},
  {label:'Visual detection / classification range (nm)', types:[3001,3002], unit:'nm', color:'var(--s4)'},
  {label:'Passive sonar signature (dB)', types:[1001,1002,1003,1004], unit:'dB', color:'var(--s3)'},
  {label:'Active sonar target strength', types:[2001], unit:'', color:'var(--s3)'},
];
function signatureCard(sig, hasTop=true){
  const types = Object.keys(sig).map(Number); if (!types.length) return '';
  const rows=[];
  for (const g of SIG_GROUPS){
    const present = g.types.filter(t=>sig[t] && sig[t].some(v=>v!==0));
    if (!present.length) continue;
    const maxAbs = Math.max(...present.flatMap(t=>sig[t].map(v=>Math.abs(v))),1);
    rows.push(`<tr class="sec"><td colspan="${hasTop?6:5}">${g.label}</td></tr>`);
    for (const t of present){
      const v=sig[t]; const name=E('SignatureType',t).replace(/^(Radar|Passive Sonar|Active Sonar|Visual|Infrared)[, ]*/,'');
      const cell = x => { if (x==null) return '<td class="v">—</td>'; if (x<=-9999) return '<td class="v dim">n/a</td>'; const pct = g.unit==='dBsm'? Math.max(0,(x+60)/(Math.max(maxAbs,10)+60)) : Math.abs(x)/maxAbs; return `<td class="v">${fmt.n(x,2)}<div class="bar" style="width:${(pct*100).toFixed(0)}%;--c:${g.color}"></div></td>`; };
      rows.push(`<tr><td class="k">${esc(name)}</td>${cell(v[0])}${cell(v[1])}${cell(v[2])}${hasTop?cell(v[3]):''}</tr>`);
    }
  }
  if (!rows.length) return '';
  return `<div class="card"><h3>Signatures<span class="hint">by aspect — larger = easier to detect (RCS in dBsm, ranges in nm, sonar in dB)</span></h3><div class="wrap"><table class="cmp-table"><thead><tr><th></th><th>Front</th><th>Side</th><th>Rear</th>${hasTop?'<th>Top</th>':''}</tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
}

  const caps = s.caps.map(c=>`<span class="chip on">${esc(E('SensorCapability',c))}</span>`).join('');
  const codes = s.codes.map(c=>`<span class="chip">${esc(E('SensorCode',c))}</span>`).join('');
  return (caps||codes)? `<div class="chips" style="margin-top:6px">${caps}${codes}</div>` : '';
}
function bandChips(ids, cls='on'){ return ids.map(f=>`<span class="chip ${cls}">${esc(E('SensorFrequency',f))}</span>`).join(''); }
function sensorEnvelopeCard(s, color){
  if (!(s.RangeMax>0)) return '';
  const a0=(s.AltitudeMin_ASL||s.AltitudeMin)||null, a1=(s.AltitudeMax_ASL||s.AltitudeMax)||null;
  const items=[{label:s.Name,color,r0:s.RangeMin||0,r1:s.RangeMax,a0,a1,tip:`${fmt.n(s.RangeMin||0,1)} – ${fmt.n(s.RangeMax,1)} nm · alt ${sensorAltText(s)}`}];
  return `<div class="card"><h3>Detection envelope<span class="hint">range × altitude (log)</span></h3>${envelopeChart(items,{width:520,height:220})}<div class="note">Min range ${fmt.n(s.RangeMin||0,2)} nm · max ${fmt.n(s.RangeMax,1)} nm · altitude ${sensorAltText(s)}</div></div>`;
}
function radarPanels(s){
  const color=FAMILY.radar.color;
  const spans=[]; if (s.FrequencyLower>0&&s.FrequencyUpper>0) spans.push({label:'search/track',lo:s.FrequencyLower,hi:s.FrequencyUpper,color:'var(--s1)'});
  if (s.FrequencyLowerIlluminate>0&&s.FrequencyUpperIlluminate>0) spans.push({label:'illuminate',lo:s.FrequencyLowerIlluminate,hi:s.FrequencyUpperIlluminate,color:'var(--s2)'});
  const nonRadar = s.freqST.filter(f=>f>=2000);
  let html = sensorEnvelopeCard(s,color);
  html += `<div class="card"><h3>Frequency<span class="hint">NATO bands · blue = search/track, orange outline = illumination</span></h3>${freqStrip(s.freqST,s.freqIL,spans)}${nonRadar.length?`<div class="chips" style="margin-top:6px">${bandChips(nonRadar)}</div>`:''}</div>`;
  const radar = kv([['Peak power',s.RadarPeakPower?fmt.n(s.RadarPeakPower)+' W':null],['PRF',s.RadarPRF?s.RadarPRF+' Hz':null],['Pulse width',s.RadarPulseWidth?s.RadarPulseWidth+' µs':null],['Blind time',s.RadarBlindTime?s.RadarBlindTime+' µs':null],['Beamwidth (H × V)',s.RadarHorizontalBeamwidth?s.RadarHorizontalBeamwidth+'° × '+s.RadarVerticalBeamwidth+'°':null],['System noise',s.RadarSystemNoiseLevel?s.RadarSystemNoiseLevel+' dB':null],['Processing gain/loss',s.RadarProcessingGainLoss?s.RadarProcessingGainLoss+' dB':null],['Min detectable RCS',s.MinimumSignature_Radar&&s.MinimumSignature_Radar>-99?s.MinimumSignature_Radar+' dBsm':null]]);
  const illum = (s.RadarPeakPowerIlluminate||s.MaxContactsIlluminate)? kv([['Illuminate power',s.RadarPeakPowerIlluminate?fmt.n(s.RadarPeakPowerIlluminate)+' W':null],['Illuminate beamwidth',s.RadarHorizontalBeamwidthIlluminate?s.RadarHorizontalBeamwidthIlluminate+'° × '+s.RadarVerticalBeamwidthIlluminate+'°':null],['Illuminate PRF',s.RadarPRFIlluminate?s.RadarPRFIlluminate+' Hz':null],['Simultaneous illuminations',s.MaxContactsIlluminate||null]]):'';
  html += `<div class="card"><h3>Radar parameters</h3>${radar}${illum?'<h3 style="margin-top:10px">Illumination</h3>'+illum:''}</div>`;
  html += trackingCard(s);
  return html;
}
function trackingCard(s){
  const pairs=[['Scan interval',s.ScanInterval?s.ScanInterval+' s':null],['Range resolution',s.ResolutionRange?s.ResolutionRange+' nm':null],['Height resolution',s.ResolutionHeight?s.ResolutionHeight+' m':null],['Angular resolution',s.ResolutionAngle?s.ResolutionAngle+'°':null],['DF accuracy',s.DirectionFindingAccuracy?'±'+s.DirectionFindingAccuracy+'°':null],['Max contacts (air / surface / sub)',(s.MaxContactsAir||s.MaxContactsSurface||s.MaxContactsSubmarine)?[s.MaxContactsAir,s.MaxContactsSurface,s.MaxContactsSubmarine].map(v=>v||0).join(' / '):null],['Availability',s.Availability!=null&&s.Availability!==100?s.Availability+' %':null]];
  return `<div class="card"><h3>Tracking &amp; resolution</h3>${kv(pairs)}</div>`;
}
function esmPanels(s){
  const color=FAMILY.esm.color;
  let html = sensorEnvelopeCard(s,color);
  const radarBands = s.freqST.filter(f=>f<2000), other = s.freqST.filter(f=>f>=2000);
  html += `<div class="card"><h3>Intercept coverage<span class="hint">bands this receiver can hear</span></h3>${radarBands.length?freqStrip(radarBands,[],[]):''}${other.length?`<div class="chips" style="margin-top:6px">${bandChips(other)}</div>`:''}${(!radarBands.length&&!other.length)?'<span class="small">No bands listed.</span>':''}</div>`;
  // DF wedge
  const acc = s.DirectionFindingAccuracy||0;
  const wedge = acc? (()=>{ const size=140,c=size/2,r=size/2-8; return SVG(size,size,`<circle cx="${c}" cy="${c}" r="${r}" fill="none" class="grid"/><path d="${polarPath(c,c,r,-acc,acc)}" fill="${color}" fill-opacity="0.25" stroke="${color}"/><line x1="${c}" y1="${c}" x2="${c}" y2="${c-r}" stroke="var(--text-3)" stroke-dasharray="2 2"/><text x="${c}" y="${c+r+2}" text-anchor="middle" class="lbl">±${acc}° bearing error</text>`); })() : '';
  html += `<div class="card"><h3>Receiver</h3><div style="display:flex;gap:14px;align-items:flex-start">${wedge?`<div>${wedge}</div>`:''}<div style="flex:1">${kv([['DF accuracy',acc?'±'+acc+'°':null],['Sensitivity',s.ESMSensitivity?s.ESMSensitivity+' dBm':null],['System loss',s.ESMSystemLoss?s.ESMSystemLoss+' dB':null],['Channels',s.ESMNumberOfChannels||null],['Precise emitter ID',s.ESMPreciseEmitterID?'yes':null],['Scan interval',s.ScanInterval?s.ScanInterval+' s':null],['Min signature (ESM)',s.MinimumSignature_ESM&&s.MinimumSignature_ESM>-99?s.MinimumSignature_ESM:null]])}</div></div></div>`;
  return html;
}
function ecmPanels(s){
  const color=FAMILY.ecm.color;
  let html = sensorEnvelopeCard(s,color);
  const radarBands = s.freqST.filter(f=>f<2000), other=s.freqST.filter(f=>f>=2000);
  html += `<div class="card"><h3>Jamming coverage<span class="hint">bands attacked</span></h3>${radarBands.length?freqStrip(radarBands,[],[]):''}${other.length?`<div class="chips" style="margin-top:6px">${bandChips(other)}</div>`:''}</div>`;
  html += `<div class="card"><h3>Jammer</h3>${kv([['Gain',s.ECMGain?s.ECMGain+' dB':null],['Peak power',s.ECMPeakPower?fmt.n(s.ECMPeakPower)+' W':null],['Bandwidth',s.ECMBandwidth?fmt.hz(s.ECMBandwidth):null],['Simultaneous targets',s.ECMNumberOfTargets||null],['PoK reduction',s.ECMPoKReduction?s.ECMPoKReduction+' %':null],['Scan interval',s.ScanInterval?s.ScanInterval+' s':null]])}</div>`;
  return html;
}
function opticalPanels(s){
  const isIR = s.fam==='ir'; const color = isIR?FAMILY.ir.color:FAMILY.visual.color;
  const det = isIR? s.IRDetectionZoomLevel : s.VisualDetectionZoomLevel, cls = isIR? s.IRClassificationZoomLevel : s.VisualClassificationZoomLevel;
  const maxZoom = Math.max(...[...D.sensor.values()].map(x=>Math.max(x.VisualDetectionZoomLevel||0,x.VisualClassificationZoomLevel||0,x.IRDetectionZoomLevel||0,x.IRClassificationZoomLevel||0)), 1);
  const hasAlt = (s.AltitudeMax||s.AltitudeMax_ASL)>0;
  let html = hasAlt ? sensorEnvelopeCard(s,color) : (s.RangeMax>0 ? `<div class="card"><h3>Coverage<span class="hint">nominal range, all-round (arcs come from the fitting platform)</span></h3>${coverageRings([{label:s.Name,range:s.RangeMax,mask:0xFFFF,color,sub:E('SensorRole',s.Role)}],{size:300})}</div>` : '');
  const night = s.codes.includes(2701);
  html += `<div class="card"><h3>${isIR?'Imaging':'Optics'}<span class="hint">zoom level = magnification class used by the engine</span></h3>
    ${gauge('Detection zoom', Math.log10(1+(det||0)), Math.log10(1+maxZoom), color, det?'×'+det:'—')}${gauge('Classification zoom', Math.log10(1+(cls||0)), Math.log10(1+maxZoom), color, cls?'×'+cls:'—')}<div class="small" style="margin-bottom:6px">bar = log scale up to the database maximum of ×${fmt.n(maxZoom)}</div>
    ${kv([['Generation',E('SensorGeneration',s.Generation)],['Night capable',night?'yes (LLTV/NVG/CCD)':(isIR?'yes (infrared)':'day only')],['Scan interval',s.ScanInterval?s.ScanInterval+' s':null],['Min signature',(isIR?s.MinimumSignature_IR:s.MinimumSignature_Visual)>-99&&(isIR?s.MinimumSignature_IR:s.MinimumSignature_Visual)?(isIR?s.MinimumSignature_IR:s.MinimumSignature_Visual):null]])}
    <div class="note">Optics have no altitude ceiling in the database; range is a nominal maximum and the actual detection distance depends on the target's ${isIR?'infrared':'visual'} signature and zoom level.</div></div>`;
  html += trackingCard(s);
  return html;
}
function sonarPanels(s){
  const color=FAMILY.sonar.color;
  const isTowed = s.Type>=5011&&s.Type<=5023, isDip = s.Type>=5031&&s.Type<=5033;
  const active = [5002,5003,5004,5012,5013,5022,5023,5032,5033].includes(s.Type), passive = ![5003,5013,5023,5033].includes(s.Type);
  let html='';
  // depth profile
  const dmin = s.SonarMinimumDeploymentDepth||0, dmax = s.SonarMaximumDeploymentDepth||0;
  if (dmin||dmax||s.SonarTowLength){
    const items=[{label:s.Name,color,r0:0,r1:s.RangeMax||1,a0:Math.min(dmin,dmax),a1:Math.max(dmin,dmax),tip:`deploy depth ${fmt.n(Math.abs(dmax))} – ${fmt.n(Math.abs(dmin))} m`}];
    html += `<div class="card"><h3>Deployment envelope<span class="hint">range × depth</span></h3>${envelopeChart(items,{mode:'depth',width:520,height:200})}<div class="note">${isTowed?'Towed array, cable '+fmt.n(s.SonarTowLength)+' m':isDip?'Dipping sonar':'Variable-depth'} · deploy ${fmt.n(Math.abs(dmax))} – ${fmt.n(Math.abs(dmin))} m</div></div>`;
  } else if (s.RangeMax>0){
    html += `<div class="card"><h3>Coverage</h3>${coverageRings([{label:s.Name,range:s.RangeMax,mask:0xFFFF,color}],{size:260})}</div>`;
  }
  html += `<div class="card"><h3>Acoustics<span class="hint">${active?'active':''}${active&&passive?' + ':''}${passive?'passive':''}</span></h3>${kv([['Max range',fmt.nm(s.RangeMax)],['Frequency bands',s.freqST.map(f=>E('SensorFrequency',f)).join('; ')||null],['Source level',s.SonarSourceLevel?s.SonarSourceLevel+' dB':null],['Pulse length',s.SonarPulseLength?s.SonarPulseLength+' ms':null],['Directivity index',s.SonarDirectivityIndex?s.SonarDirectivityIndex+' dB':null],['Recognition differential (active / passive)',(s.SonarRecognitionDifferentialActive||s.SonarRecognitionDifferentialPassive)?(s.SonarRecognitionDifferentialActive||0)+' / '+(s.SonarRecognitionDifferentialPassive||0)+' dB':null],['Sensor-to-machinery distance',s.SonarSensorToMachineryDistance?s.SonarSensorToMachineryDistance+' m':null],['Convergence zones',s.SonarCZNumber||null],['Scan interval',s.ScanInterval?s.ScanInterval+' s':null],['Angular resolution',s.ResolutionAngle?s.ResolutionAngle+'°':null],['Min signature (active / passive)',[s.MinimumSignature_ActiveSonar,s.MinimumSignature_PassiveSonar].some(v=>v&&v>-99)?[s.MinimumSignature_ActiveSonar,s.MinimumSignature_PassiveSonar].join(' / '):null]])}
  ${s.SonarCZNumber?`<div class="note">Convergence-zone capable: the engine can extend detection into ${s.SonarCZNumber} CZ annulus${s.SonarCZNumber>1?'es':''} beyond direct path when water conditions allow.</div>`:''}</div>`;
  return html;
}
function genericPanels(s){
  const color = FAMILY[s.fam].color;
  let html = sensorEnvelopeCard(s,color);
  const mine = (s.MineSweepWidth||s.MineSweepMaximumDepth)? kv([['Sweep width',s.MineSweepWidth?s.MineSweepWidth+' m':null],['Sweep depth',s.MineSweepMinimumDepth||s.MineSweepMaximumDepth?fmt.n(s.MineSweepMinimumDepth)+' – '+fmt.n(s.MineSweepMaximumDepth)+' m':null],['Max sweep speed',s.MineSweepMaximumSpeed?s.MineSweepMaximumSpeed+' kt':null]]) : '';
  if (mine) html += `<div class="card"><h3>Mine countermeasures</h3>${mine}</div>`;
  if (s.Type===9001){ html += `<div class="card"><h3>Group members</h3><div class="comp-list">${s.group.map(g=>{const m=D.sensor.get(g); return m?`<a class="comp" href="#/sensor/${m.ID}"><span></span><span><div class="nm">${esc(m.Name)}</div><div class="sub">${esc(E('SensorType',m.Type))} · ${esc(E('SensorRole',m.Role))}</div></span><span class="cnt">${fmt.nm(m.RangeMax)}</span></a>`:'';}).join('')}</div></div>`; }
  html += trackingCard(s);
  return html;
}
function viewSensor(id){
  const s=D.sensor.get(id); if(!s) return '<p>Unknown sensor.</p>';
  const f=FAMILY[s.fam];
  let html = `<div class="crumbs"><a href="#/">Overview</a> › <a href="#/sensor">Sensors</a> › <a href="#/sensor?f=${s.fam}">${f.label}</a></div>
  <h2 class="title"><span class="sw" style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${f.color};margin-right:8px"></span>${esc(s.Name)}${flags(s)}</h2>
  <div class="meta">${esc(E('SensorType',s.Type))} · ${esc(E('SensorRole',s.Role))}${D.enums.SensorRoleComment&&D.enums.SensorRoleComment[s.Role]?' '+esc(D.enums.SensorRoleComment[s.Role]):''} · ${esc(E('SensorGeneration',s.Generation))}${s.Comments&&s.Comments!=='-'?' · '+esc(s.Comments):''} · <span class="small">ID ${s.ID}</span></div>
  ${compareButton('sensor', s.ID, s.Name)}`;
  html += statTiles([['Max range',s.RangeMax?fmt.n(s.RangeMax,1):null,'nm'],['Min range',s.RangeMin?fmt.n(s.RangeMin,2):null,'nm'],['Altitude',sensorAltText(s)!=='—'?sensorAltText(s):null],['Scan',s.ScanInterval,'s'],['Max contacts',s.MaxContactsAir||s.MaxContactsSurface||s.MaxContactsSubmarine?Math.max(s.MaxContactsAir,s.MaxContactsSurface,s.MaxContactsSubmarine):null]]);
  html += capChips(s);
  html += `<div class="grid c2" style="margin-top:12px">`;
  if (s.fam==='radar') html += radarPanels(s);
  else if (s.fam==='esm') html += esmPanels(s);
  else if (s.fam==='ecm') html += ecmPanels(s);
  else if (s.fam==='visual'||s.fam==='ir') html += opticalPanels(s);
  else if (s.fam==='sonar') html += sonarPanels(s);
  else html += genericPanels(s);
  if (s.MasqueradeAs && s.MasqueradeAs!==1001){ const m=D.sensor.get(s.MasqueradeAs); if (m) html += `<div class="card"><h3>Masquerades as</h3><a href="#/sensor/${m.ID}">${esc(m.Name)}</a></div>`; }
  // used by
  html += carrierCard(sensorCarriers(id));
  const wps = (IDX.sensorWeapons.get(id)||[]).map(w=>D.weapon.get(w)).filter(Boolean);
  if (wps.length) html += `<div class="card"><h3>Seeker for<span class="hint">${wps.length} weapon${wps.length===1?'':'s'}</span></h3><div class="chips">${wps.slice(0,80).map(w=>`<a class="chip" href="#/weapon/${w.ID}">${esc(w.Name)}</a>`).join('')}${wps.length>80?`<span class="chip">… ${wps.length-80} more</span>`:''}</div></div>`;
  const grp = [...D.sensor.values()].filter(x=>x.Type===9001&&x.group.includes(id));
  if (grp.length) html += `<div class="card"><h3>Member of sensor groups</h3><div class="chips">${grp.map(g=>`<a class="chip" href="#/sensor/${g.ID}">${esc(g.Name)}</a>`).join('')}</div></div>`;
  html += `</div>`;
  return html;
}

<script>
/* ============================================================
   WEAPON DETAIL — family-specific presentation
